  { block: "Constitucional", tema: 1, ref: "Art. 7 CE", q: "Artículo 7 de la Constitución Española", a: "Los sindicatos de trabajadores y las asociaciones empresariales contribuyen a la defensa y promoción de los intereses económicos y sociales que les son propios. Su creación y el ejercicio de su actividad son libres dentro del respeto a la Constitución y a la ley. Su estructura interna y funcionamiento deberán ser democráticos." },
  { block: "Constitucional", tema: 1, ref: "Art. 8 CE", q: "Artículo 8 de la Constitución Española", a: "1. Las Fuerzas Armadas, constituidas por el Ejército de Tierra, la Armada y el Ejército del Aire, tienen como misión garantizar la soberanía e independencia de España, defender su integridad territorial y el ordenamiento constitucional.\n2. Una ley orgánica regulará las bases de la organización militar conforme a los principios de la presente Constitución." },
  { block: "Constitucional", tema: 1, ref: "Art. 10 CE", q: "Artículo 10 de la Constitución Española", a: "1. La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás son fundamento del orden político y de la paz social.\n2. Las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España." },
  { block: "Constitucional", tema: 6, ref: "Art. 19 CE", q: "Artículo 19 de la Constitución Española", a: "Los españoles tienen derecho a elegir libremente su residencia y a circular por el territorio nacional. Asimismo, tienen derecho a entrar y salir libremente de España en los términos que la ley establezca. Este derecho no podrá ser limitado por motivos políticos o ideológicos." },
  { block: "Constitucional", tema: 6, ref: "Art. 22 CE", q: "Artículo 22 de la Constitución Española", a: "1. Se reconoce el derecho de asociación.\n2. Las asociaciones que persigan fines o utilicen medios tipificados como delito son ilegales.\n4. Las asociaciones sólo podrán ser disueltas o suspendidas en sus actividades en virtud de resolución judicial motivada.\n5. Se prohíben las asociaciones secretas y las de carácter paramilitar." },
  { block: "Constitucional", tema: 6, ref: "Art. 23 CE", q: "Artículo 23 de la Constitución Española", a: "1. Los ciudadanos tienen el derecho a participar en los asuntos públicos, directamente o por medio de representantes, libremente elegidos en elecciones periódicas por sufragio universal.\n2. Asimismo, tienen derecho a acceder en condiciones de igualdad a las funciones y cargos públicos, con los requisitos que señalen las leyes." },
  { block: "Constitucional", tema: 6, ref: "Art. 26 CE", q: "Artículo 26 de la Constitución Española", a: "Se prohíben los Tribunales de Honor en el ámbito de la Administración civil y de las organizaciones profesionales." },
  { block: "Constitucional", tema: 6, ref: "Art. 29 CE", q: "Artículo 29 de la Constitución Española", a: "1. Todos los españoles tendrán el derecho de petición individual y colectiva, por escrito, en la forma y con los efectos que determine la ley.\n2. Los miembros de las Fuerzas o Institutos armados o de los Cuerpos sometidos a disciplina militar podrán ejercer este derecho sólo individualmente y con arreglo a lo dispuesto en su legislación específica." },
  { block: "Constitucional", tema: 6, ref: "Art. 30 CE", q: "Artículo 30 de la Constitución Española", a: "1. Los españoles tienen el derecho y el deber de defender a España.\n2. La ley fijará las obligaciones militares de los españoles y regulará, con las debidas garantías, la objeción de conciencia.\n3. Podrá establecerse un servicio civil para el cumplimiento de fines de interés general." },
  { block: "Constitucional", tema: 6, ref: "Art. 31 CE", q: "Artículo 31 de la Constitución Española", a: "1. Todos contribuirán al sostenimiento de los gastos públicos de acuerdo con su capacidad económica mediante un sistema tributario justo inspirado en los principios de igualdad y progresividad que, en ningún caso, tendrá alcance confiscatorio.\n2. El gasto público realizará una asignación equitativa de los recursos públicos, y su programación y ejecución responderán a los criterios de eficiencia y economía." },
  { block: "Constitucional", tema: 6, ref: "Art. 35 CE", q: "Artículo 35 de la Constitución Española", a: "1. Todos los españoles tienen el deber de trabajar y el derecho al trabajo, a la libre elección de profesión u oficio, a la promoción a través del trabajo y a una remuneración suficiente para satisfacer sus necesidades y las de su familia, sin que en ningún caso pueda hacerse discriminación por razón de sexo." },
  { block: "Constitucional", tema: 6, ref: "Art. 37 CE", q: "Artículo 37 de la Constitución Española", a: "1. La ley garantizará el derecho a la negociación colectiva laboral entre los representantes de los trabajadores y empresarios, así como la fuerza vinculante de los convenios.\n2. Se reconoce el derecho de los trabajadores y empresarios a adoptar medidas de conflicto colectivo." },
  { block: "Constitucional", tema: 6, ref: "Art. 39 CE", q: "Artículo 39 de la Constitución Española", a: "1. Los poderes públicos aseguran la protección social, económica y jurídica de la familia.\n2. Los poderes públicos aseguran, asimismo, la protección integral de los hijos, iguales éstos ante la ley con independencia de su filiación.\n4. Los niños gozarán de la protección prevista en los acuerdos internacionales que velan por sus derechos." },
  { block: "Constitucional", tema: 6, ref: "Art. 43 CE", q: "Artículo 43 de la Constitución Española", a: "1. Se reconoce el derecho a la protección de la salud.\n2. Compete a los poderes públicos organizar y tutelar la salud pública a través de medidas preventivas y de las prestaciones y servicios necesarios." },
  { block: "Constitucional", tema: 6, ref: "Art. 45 CE", q: "Artículo 45 de la Constitución Española", a: "1. Todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como el deber de conservarlo.\n2. Los poderes públicos velarán por la utilización racional de todos los recursos naturales.\n3. Para quienes violen lo dispuesto en el apartado anterior, se establecerán sanciones penales o, en su caso, administrativas, así como la obligación de reparar el daño causado." },
  { block: "Constitucional", tema: 6, ref: "Art. 47 CE", q: "Artículo 47 de la Constitución Española", a: "Todos los españoles tienen derecho a disfrutar de una vivienda digna y adecuada. Los poderes públicos promoverán las condiciones necesarias y establecerán las normas pertinentes para hacer efectivo este derecho, regulando la utilización del suelo de acuerdo con el interés general para impedir la especulación." },
  { block: "Constitucional", tema: 6, ref: "Art. 49 CE", q: "Artículo 49 de la Constitución Española", a: "Los poderes públicos realizarán una política de previsión, tratamiento, rehabilitación e integración de las personas con discapacidades físicas, sensoriales y psíquicas, a las que prestarán la atención especializada que requieran y las ampararán especialmente para el disfrute de los derechos que este Título otorga a todos los ciudadanos." },
  { block: "Constitucional", tema: 6, ref: "Art. 50 CE", q: "Artículo 50 de la Constitución Española", a: "Los poderes públicos garantizarán, mediante pensiones adecuadas y periódicamente actualizadas, la suficiencia económica a los ciudadanos durante la tercera edad. Asimismo, promoverán su bienestar mediante un sistema de servicios sociales que atenderán sus problemas específicos de salud, vivienda, cultura y ocio." },
  { block: "Constitucional", tema: 6, ref: "Art. 51 CE", q: "Artículo 51 de la Constitución Española", a: "1. Los poderes públicos garantizarán la defensa de los consumidores y usuarios, protegiendo, mediante procedimientos eficaces, la seguridad, la salud y los legítimos intereses económicos de los mismos." },
  { block: "Constitucional", tema: 9, ref: "Art. 55 CE", q: "Artículo 55 de la Constitución Española (suspensión de derechos)", a: "1. Los derechos reconocidos en los artículos 17, 18, apartados 2 y 3, artículos 19, 20, apartados 1, a) y d), y 5, artículos 21, 28, apartado 2, y artículo 37, apartado 2, podrán ser suspendidos cuando se acuerde la declaración del estado de excepción o de sitio.\n2. Una ley orgánica podrá determinar la forma y los casos en que, de forma individual y con la necesaria intervención judicial y el adecuado control parlamentario, los derechos reconocidos en los artículos 17.2 y 18.2 y 3 pueden ser suspendidos para personas determinadas, en relación con las investigaciones correspondientes a la actuación de bandas armadas o elementos terroristas." },
  { block: "Constitucional", tema: 14, ref: "Art. 57 CE", q: "Artículo 57 de la Constitución Española (sucesión de la Corona)", a: "1. La Corona de España es hereditaria en los sucesores de S.M. Don Juan Carlos I de Borbón, legítimo heredero de la dinastía histórica. La sucesión en el trono seguirá el orden regular de primogenitura y representación, siendo preferida siempre la línea anterior a las posteriores; en la misma línea, el grado más próximo al más remoto; en el mismo grado, el varón a la mujer, y en el mismo sexo, la persona de más edad a la de menos." },
  { block: "Constitucional", tema: 15, ref: "Art. 67 CE", q: "Artículo 67 de la Constitución Española", a: "1. Nadie podrá ser miembro de las dos Cámaras simultáneamente, ni acumular el acta de una Asamblea de Comunidad Autónoma con la de Diputado al Congreso.\n2. Los miembros de las Cortes Generales no estarán ligados por mandato imperativo.\n3. Las reuniones de Parlamentarios que se celebren sin convocatoria reglamentaria no vincularán a las Cámaras, y no podrán ejercer sus funciones ni ostentar sus privilegios." },
  { block: "Constitucional", tema: 15, ref: "Art. 71 CE", q: "Artículo 71 de la Constitución Española (inviolabilidad e inmunidad)", a: "1. Los Diputados y Senadores gozarán de inviolabilidad por las opiniones manifestadas en el ejercicio de sus funciones.\n2. Durante el período de su mandato los Diputados y Senadores gozarán asimismo de inmunidad y sólo podrán ser detenidos en caso de flagrante delito. No podrán ser inculpados ni procesados sin la previa autorización de la Cámara respectiva.\n3. En las causas contra Diputados y Senadores será competente la Sala de lo Penal del Tribunal Supremo." },
  { block: "Constitucional", tema: 15, ref: "Art. 87 CE", q: "Artículo 87 de la Constitución Española (iniciativa legislativa)", a: "1. La iniciativa legislativa corresponde al Gobierno, al Congreso y al Senado, de acuerdo con la Constitución y los Reglamentos de las Cámaras.\n2. Las Asambleas de las Comunidades Autónomas podrán solicitar del Gobierno la adopción de un proyecto de ley o remitir a la Mesa del Congreso una proposición de ley.\n3. Una ley orgánica regulará las formas de ejercicio y requisitos de la iniciativa popular para la presentación de proposiciones de ley. En todo caso se exigirán no menos de 500.000 firmas acreditadas." },
  { block: "Constitucional", tema: 16, ref: "Art. 98 CE", q: "Artículo 98 de la Constitución Española (Gobierno)", a: "1. El Gobierno se compone del Presidente, de los Vicepresidentes, en su caso, de los Ministros y de los demás miembros que establezca la ley.\n2. El Presidente dirige la acción del Gobierno y coordina las funciones de los demás miembros del mismo, sin perjuicio de la competencia y responsabilidad directa de éstos en su gestión." },
  { block: "Constitucional", tema: 16, ref: "Art. 108 CE", q: "Artículo 108 de la Constitución Española (responsabilidad política)", a: "El Gobierno responde solidariamente en su gestión política ante el Congreso de los Diputados." },
  { block: "Constitucional", tema: 19, ref: "Art. 118 CE", q: "Artículo 118 de la Constitución Española", a: "Es obligado cumplir las sentencias y demás resoluciones firmes de los Jueces y Tribunales, así como prestar la colaboración requerida por éstos en el curso del proceso y en la ejecución de lo resuelto." },
  { block: "Constitucional", tema: 19, ref: "Art. 119 CE", q: "Artículo 119 de la Constitución Española", a: "La justicia será gratuita cuando así lo disponga la ley y, en todo caso, respecto de quienes acrediten insuficiencia de recursos para litigar." },
  { block: "Constitucional", tema: 19, ref: "Art. 120 CE", q: "Artículo 120 de la Constitución Española", a: "1. Las actuaciones judiciales serán públicas, con las excepciones que prevean las leyes de procedimiento.\n2. El procedimiento será predominantemente oral, sobre todo en materia criminal.\n3. Las sentencias serán siempre motivadas y se pronunciarán en audiencia pública." },
  { block: "Constitucional", tema: 19, ref: "Art. 125 CE", q: "Artículo 125 de la Constitución Española (jurado y acción popular)", a: "Los ciudadanos podrán ejercer la acción popular y participar en la Administración de Justicia mediante la institución del Jurado, en la forma y con respecto a aquellos procesos penales que la ley determine, así como en los Tribunales consuetudinarios y tradicionales." },
];
// ===== AMPLIACIÓN: CIVIL =====
const CIVIL_2 = [
  { block: "Civil", tema: 1, ref: "Art. 2 CC", q: "Artículo 2 del Código Civil", a: "1. Las leyes entrarán en vigor a los veinte días de su completa publicación en el Boletín Oficial del Estado, si en ellas no se dispone otra cosa.\n2. Las leyes sólo se derogan por otras posteriores. La derogación tendrá el alcance que expresamente se disponga y se extenderá siempre a todo aquello que en la ley nueva, sobre la misma materia, sea incompatible con la anterior.\n3. Las leyes no tendrán efecto retroactivo si no dispusieren lo contrario." },
  { block: "Civil", tema: 3, ref: "Art. 5 CC", q: "Artículo 5 del Código Civil (cómputo de plazos)", a: "1. Siempre que no se establezca otra cosa, en los plazos señalados por días, a contar de uno determinado, quedará éste excluido del cómputo, el cual deberá empezar en el día siguiente; y si los plazos estuviesen fijados por meses o años, se computarán de fecha a fecha. Cuando en el mes del vencimiento no hubiera día equivalente al inicial del cómputo, se entenderá que el plazo expira el último del mes.\n2. En el cómputo civil de los plazos no se excluyen los días inhábiles." },
  { block: "Civil", tema: 3, ref: "Art. 17 CC", q: "Artículo 17 del Código Civil (nacionalidad de origen)", a: "1. Son españoles de origen: a) Los nacidos de padre o madre españoles. b) Los nacidos en España de padres extranjeros si, al menos, uno de ellos hubiera nacido también en España. c) Los nacidos en España de padres extranjeros, si ambos carecieren de nacionalidad, o si la legislación de ninguno de ellos atribuye al hijo una nacionalidad. d) Los nacidos en España cuya filiación no resulte determinada." },
  { block: "Civil", tema: 3, ref: "Art. 40 CC", q: "Artículo 40 del Código Civil (domicilio)", a: "Para el ejercicio de los derechos y el cumplimiento de las obligaciones civiles, el domicilio de las personas naturales es el lugar de su residencia habitual, y en su caso, el que determine la Ley de Enjuiciamiento Civil." },
  { block: "Civil", tema: 4, ref: "Art. 315 CC", q: "Artículo 315 del Código Civil (mayoría de edad)", a: "La mayor edad empieza a los dieciocho años cumplidos. Para el cómputo de los años de la mayoría de edad se incluirá completo el día del nacimiento." },
  { block: "Civil", tema: 4, ref: "Art. 317 CC", q: "Artículo 317 del Código Civil", a: "Para que la concesión de emancipación por los que ejerzan la patria potestad produzca efecto, ha de ser inscrita en el Registro Civil. Sin este requisito no perjudicará a terceras personas." },
  { block: "Civil", tema: 5, ref: "Art. 183 CC", q: "Artículo 183 del Código Civil (declaración de ausencia legal)", a: "La declaración de ausencia legal procederá: 1.º Pasado un año desde las últimas noticias o, a falta de éstas, desde su desaparición, si no hubiese dejado apoderado con facultades de administración de todos sus bienes. 2.º Pasados tres años, si hubiese dejado encomendada la administración de todos sus bienes." },
  { block: "Civil", tema: 5, ref: "Art. 195 CC", q: "Artículo 195 del Código Civil (efectos de la declaración de fallecimiento)", a: "La declaración de fallecimiento no es por sí sola prueba de la muerte y los efectos que en el orden civil produzca quedarán subordinados a la presunción que la misma sancione." },
  { block: "Civil", tema: 7, ref: "Art. 90 CC", q: "Artículo 90 del Código Civil (convenio regulador)", a: "1. El convenio regulador a que se refieren los artículos 81 y 86 de este Código deberá contener, al menos, los siguientes extremos: a) El cuidado de los hijos sujetos a la patria potestad de ambos, el ejercicio de esta y, en su caso, el régimen de comunicación y estancia de los hijos con el progenitor que no viva habitualmente con ellos. b) Si se considera necesario, el régimen de visitas y comunicación de los nietos con sus abuelos. c) La atribución del uso de la vivienda y ajuar familiar. d) La contribución a las cargas del matrimonio y alimentos, así como sus bases de actualización y garantías. e) La liquidación, cuando proceda, del régimen económico del matrimonio. f) La pensión que conforme al artículo 97 correspondiere satisfacer, en su caso, a uno de los cónyuges." },
  { block: "Civil", tema: 7, ref: "Art. 97 CC", q: "Artículo 97 del Código Civil (pensión compensatoria)", a: "El cónyuge al que la separación o el divorcio produzca un desequilibrio económico en relación con la posición del otro, que implique un empeoramiento en su situación anterior en el matrimonio, tendrá derecho a una compensación que podrá consistir en una pensión temporal o por tiempo indefinido, o en una prestación única, según se determine en el convenio regulador o en la sentencia." },
  { block: "Civil", tema: 8, ref: "Art. 92 CC", q: "Artículo 92 del Código Civil (efectos sobre los hijos)", a: "1. La separación, la nulidad y el divorcio no eximen a los padres de sus obligaciones para con los hijos.\n2. El Juez, cuando deba adoptar cualquier medida sobre la custodia, el cuidado y la educación de los hijos menores, velará por el cumplimiento de su derecho a ser oídos.\n5. Se acordará el ejercicio compartido de la guarda y custodia de los hijos cuando así lo soliciten los padres en la propuesta de convenio regulador o cuando ambos lleguen a este acuerdo en el transcurso del procedimiento." },
  { block: "Civil", tema: 8, ref: "Art. 110 CC", q: "Artículo 110 del Código Civil", a: "El padre y la madre, aunque no ostenten la patria potestad, están obligados a velar por los hijos menores y a prestarles alimentos." },
  { block: "Civil", tema: 9, ref: "Art. 222 CC", q: "Artículo 222 del Código Civil (personas sujetas a tutela)", a: "Están sujetos a tutela: 1.º Los menores no emancipados no sujetos a patria potestad. 2.º Las personas con discapacidad, cuando se haya determinado en resolución judicial. 3.º Los sujetos a la patria potestad prorrogada, al cesar ésta, salvo que proceda la curatela." },
  { block: "Civil", tema: 9, ref: "Art. 287 CC", q: "Artículo 287 del Código Civil (defensor judicial)", a: "Procederá el nombramiento de un defensor judicial que ampare los intereses de las personas mencionadas en el artículo anterior en los casos siguientes: 1.º Cuando en algún asunto exista conflicto de intereses entre estas y sus representantes legales o el curador. 2.º Cuando, por cualquier causa, el tutor o el curador no desempeñe sus funciones, hasta que cese la causa determinante o se designe otra persona." },
  { block: "Civil", tema: 10, ref: "Art. 348 CC", q: "Artículo 348 del Código Civil (propiedad)", a: "La propiedad es el derecho de gozar y disponer de una cosa, sin más limitaciones que las establecidas en las leyes. El propietario tiene acción contra el tenedor y el poseedor de la cosa para reivindicarla." },
  { block: "Civil", tema: 10, ref: "Art. 349 CC", q: "Artículo 349 del Código Civil (expropiación)", a: "Nadie podrá ser privado de su propiedad sino por Autoridad competente, por causa justificada de utilidad pública, previa siempre la correspondiente indemnización." },
  { block: "Civil", tema: 11, ref: "Art. 432 CC", q: "Artículo 432 del Código Civil (concepto de dueño u otro derecho)", a: "La posesión en los bienes y derechos puede tenerse en uno de dos conceptos: o en el de dueño, o en el de tenedor de la cosa o derecho para conservarlo o disfrutarlo, perteneciendo el dominio a otra persona." },
  { block: "Civil", tema: 11, ref: "Art. 448 CC", q: "Artículo 448 del Código Civil (presunción de posesión)", a: "El poseedor en concepto de dueño tiene a su favor la presunción legal de que posee con justo título, y no se le puede obligar a exhibirlo." },
  { block: "Civil", tema: 12, ref: "Art. 1961 CC", q: "Artículo 1961 del Código Civil (acciones prescriptibles)", a: "Las acciones prescriben por el mero lapso del tiempo fijado por la ley." },
  { block: "Civil", tema: 12, ref: "Art. 1964 CC", q: "Artículo 1964 del Código Civil (prescripción de acciones personales)", a: "1. La acción hipotecaria prescribe a los veinte años.\n2. Las acciones personales que no tengan plazo especial prescriben a los cinco años desde que pueda exigirse el cumplimiento de la obligación." },
  { block: "Civil", tema: 13, ref: "Art. 470 CC", q: "Artículo 470 del Código Civil (constitución del usufructo)", a: "El usufructo se constituye por la ley, por la voluntad de los particulares manifestada en actos entre vivos o en última voluntad, y por prescripción." },
  { block: "Civil", tema: 13, ref: "Art. 513 CC", q: "Artículo 513 del Código Civil (causas de extinción del usufructo)", a: "El usufructo se extingue: 1.º Por muerte del usufructuario. 2.º Por expirar el plazo por el que se constituyó, o cumplirse la condición resolutoria consignada en el título constitutivo. 3.º Por la reunión del usufructo y la propiedad en una misma persona. 4.º Por la renuncia del usufructuario. 5.º Por la pérdida total de la cosa objeto del usufructo. 6.º Por la resolución del derecho del constituyente. 7.º Por prescripción." },
  { block: "Civil", tema: 14, ref: "Art. 1876 CC", q: "Artículo 1876 del Código Civil (efecto de la hipoteca)", a: "La hipoteca sujeta directa e inmediatamente los bienes sobre que se impone, cualquiera que sea su poseedor, al cumplimiento de la obligación para cuya seguridad fue constituida." },
  { block: "Civil", tema: 14, ref: "Art. 1875 CC", q: "Artículo 1875 del Código Civil (requisitos de eficacia de la hipoteca)", a: "Además de los requisitos exigidos en el artículo 1857, es indispensable, para que la hipoteca quede válidamente constituida, que el documento en que se constituya sea inscrito en el Registro de la Propiedad." },
  { block: "Civil", tema: 16, ref: "Art. 1267 CC", q: "Artículo 1267 del Código Civil (violencia e intimidación)", a: "Hay violencia cuando para arrancar el consentimiento se emplea una fuerza irresistible. Hay intimidación cuando se inspira a uno de los contratantes el temor racional y fundado de sufrir un mal inminente y grave en su persona o bienes, o en la persona o bienes de su cónyuge, descendientes o ascendientes." },
  { block: "Civil", tema: 17, ref: "Art. 1303 CC", q: "Artículo 1303 del Código Civil (efectos de la nulidad)", a: "Declarada la nulidad de una obligación, los contratantes deben restituirse recíprocamente las cosas que hubiesen sido materia del contrato, con sus frutos, y el precio con los intereses, salvo lo que se dispone en los artículos siguientes." },
  { block: "Civil", tema: 17, ref: "Art. 1310 CC", q: "Artículo 1310 del Código Civil (confirmación)", a: "Sólo son confirmables los contratos que reúnan los requisitos expresados en el artículo 1261." },
  { block: "Civil", tema: 18, ref: "Art. 1101 CC", q: "Artículo 1101 del Código Civil (responsabilidad contractual)", a: "Quedan sujetos a la indemnización de los daños y perjuicios causados los que en el cumplimiento de sus obligaciones incurrieren en dolo, negligencia o morosidad, y los que de cualquier modo contravinieren al tenor de aquéllas." },
  { block: "Civil", tema: 19, ref: "Art. 1484 CC", q: "Artículo 1484 del Código Civil (saneamiento por vicios ocultos)", a: "El vendedor estará obligado al saneamiento por los defectos ocultos que tuviere la cosa vendida, si la hacen impropia para el uso a que se la destina, o si disminuyen de tal modo este uso que, de haberlos conocido el comprador, no la habría adquirido o habría dado menos precio por ella." },
  { block: "Civil", tema: 20, ref: "Art. 1546 CC", q: "Artículo 1546 del Código Civil (arrendador y arrendatario)", a: "El que da en arrendamiento se llama arrendador, y el que adquiere el derecho al goce o aprovechamiento se llama arrendatario." },
  { block: "Civil", tema: 21, ref: "Art. 662 CC", q: "Artículo 662 del Código Civil (capacidad para testar)", a: "Están capacitados para testar todos aquellos a quienes la ley no lo prohíbe expresamente." },
  { block: "Civil", tema: 21, ref: "Art. 663 CC", q: "Artículo 663 del Código Civil (incapacidad para testar)", a: "Están incapacitados para testar: 1.º Los menores de catorce años de uno y otro sexo. 2.º El que habitual o accidentalmente no se hallare en su cabal juicio." },
  { block: "Civil", tema: 22, ref: "Art. 808 CC", q: "Artículo 808 del Código Civil (cuantía de la legítima de los hijos)", a: "Constituyen la legítima de los hijos y descendientes las dos terceras partes del haber hereditario del padre y de la madre. Sin embargo, podrán éstos disponer de una parte de las dos que forman la legítima, para aplicarla como mejora a sus hijos o descendientes." },
  { block: "Civil", tema: 23, ref: "Art. 913 CC", q: "Artículo 913 del Código Civil (fundamento de la sucesión legítima)", a: "A falta de herederos testamentarios, la ley defiere la herencia a los parientes del difunto, al viudo o viuda y al Estado." },
  { block: "Civil", tema: 24, ref: "Art. 1903 CC", q: "Artículo 1903 del Código Civil (responsabilidad por hecho ajeno)", a: "La obligación que impone el artículo anterior es exigible, no sólo por los actos u omisiones propios, sino por los de aquellas personas de quienes se debe responder. Los padres son responsables de los daños causados por los hijos que se encuentren bajo su guarda. Los tutores lo son de los perjuicios causados por los menores o incapacitados que están bajo su autoridad y habitan en su compañía." },
  { block: "Civil", tema: 26, ref: "Art. 1144 CC", q: "Artículo 1144 del Código Civil (solidaridad activa y pasiva)", a: "El acreedor puede dirigirse contra cualquiera de los deudores solidarios o contra todos ellos simultáneamente. Las reclamaciones entabladas contra uno no serán obstáculo para las que posteriormente se dirijan contra los demás, mientras no resulte cobrada la deuda por completo." },
];
// ===== AMPLIACIÓN: PENAL =====
const PENAL_2 = [
  { block: "Penal", tema: 1, ref: "Art. 7 CP", q: "Artículo 7 del Código Penal (tiempo de comisión del delito)", a: "A los efectos de determinar la ley penal aplicable en el tiempo, los delitos se consideran cometidos en el momento en que el sujeto ejecuta la acción u omite el acto que estaba obligado a realizar, y ello con independencia del momento en que se produzca el resultado." },
  { block: "Penal", tema: 3, ref: "Art. 11 CP", q: "Artículo 11 del Código Penal (comisión por omisión)", a: "Los delitos que consistan en la producción de un resultado sólo se entenderán cometidos por omisión cuando la no evitación del mismo, al infringir un especial deber jurídico del autor, equivalga, según el sentido del texto de la ley, a su causación. A tal efecto se equiparará la omisión a la acción: a) Cuando exista una específica obligación legal o contractual de actuar. b) Cuando el omitente haya creado una ocasión de riesgo para el bien jurídicamente protegido mediante una acción u omisión precedente." },
  { block: "Penal", tema: 3, ref: "Art. 12 CP", q: "Artículo 12 del Código Penal (imprudencia)", a: "Las acciones u omisiones imprudentes sólo se castigarán cuando expresamente lo disponga la ley." },
  { block: "Penal", tema: 5, ref: "Art. 20.5 CP", q: "Artículo 20.5 del Código Penal (estado de necesidad)", a: "Está exento de responsabilidad criminal el que, en estado de necesidad, para evitar un mal propio o ajeno lesione un bien jurídico de otra persona o infrinja un deber, siempre que concurran los siguientes requisitos: Primero. Que el mal causado no sea mayor que el que se trate de evitar. Segundo. Que la situación de necesidad no haya sido provocada intencionadamente por el sujeto. Tercero. Que el necesitado no tenga, por su oficio o cargo, obligación de sacrificarse." },
  { block: "Penal", tema: 5, ref: "Art. 20.6 CP", q: "Artículo 20.6 del Código Penal (miedo insuperable)", a: "Está exento de responsabilidad criminal el que obre impulsado por miedo insuperable." },
  { block: "Penal", tema: 6, ref: "Art. 21.1 CP", q: "Artículo 21.1 del Código Penal (eximentes incompletas)", a: "Son circunstancias atenuantes las causas expresadas en el capítulo anterior, cuando no concurrieren todos los requisitos necesarios para eximir de responsabilidad en sus respectivos casos." },
  { block: "Penal", tema: 9, ref: "Art. 30 CP", q: "Artículo 30 del Código Penal (delitos cometidos a través de medios de difusión)", a: "1. En los delitos que se cometan utilizando medios o soportes de difusión mecánicos no responderán criminalmente ni los cómplices ni quienes los hubieren favorecido personal o realmente.\n2. Los autores a los que se refiere el artículo 28 responderán de forma escalonada, excluyente y subsidiaria conforme al siguiente orden: 1.º Quienes realmente hayan redactado el texto o producido el signo de que se trate. 2.º Los directores de la publicación o programa. 3.º Los directores de la empresa editora, emisora o difusora. 4.º Los directores de la empresa grabadora, reproductora o impresora." },
  { block: "Penal", tema: 10, ref: "Art. 35 CP", q: "Artículo 35 del Código Penal (penas privativas de libertad)", a: "Son penas privativas de libertad la prisión permanente revisable, la prisión y la localización permanente." },
  { block: "Penal", tema: 10, ref: "Art. 36 CP", q: "Artículo 36 del Código Penal (duración de la prisión)", a: "1. La pena de prisión tendrá una duración mínima de tres meses y máxima de veinte años, salvo lo que excepcionalmente dispongan otros preceptos del presente Código." },
  { block: "Penal", tema: 10, ref: "Art. 50 CP", q: "Artículo 50 del Código Penal (pena de multa)", a: "1. La pena de multa consistirá en la imposición al condenado de una sanción pecuniaria.\n2. La pena de multa se impondrá, salvo que la Ley disponga otra cosa, mediante el sistema de días-multa.\n3. Su extensión mínima será de diez días y la máxima de dos años. Las penas de multa imponibles a personas jurídicas tendrán una extensión máxima de cinco años.\n4. La cuota diaria tendrá un mínimo de 2 y un máximo de 400 euros." },
  { block: "Penal", tema: 11, ref: "Art. 81 CP", q: "Artículo 81 del Código Penal (condiciones de la suspensión)", a: "Serán condiciones necesarias para dejar en suspenso la ejecución de la pena las siguientes: 1.ª Que el condenado haya delinquido por primera vez. 2.ª Que la pena o la suma de las impuestas no sea superior a dos años. 3.ª Que se hayan satisfecho las responsabilidades civiles que se hubieren originado." },
  { block: "Penal", tema: 11, ref: "Art. 90 CP", q: "Artículo 90 del Código Penal (libertad condicional)", a: "1. El Juez de Vigilancia Penitenciaria acordará la suspensión de la ejecución del resto de la pena de prisión y concederá la libertad condicional a los penados en los que concurran las siguientes circunstancias: a) Que se encuentren clasificados en tercer grado. b) Que hayan extinguido las tres cuartas partes de la pena impuesta. c) Que hayan observado buena conducta." },
  { block: "Penal", tema: 12, ref: "Art. 140 CP", q: "Artículo 140 del Código Penal (asesinato agravado, prisión permanente revisable)", a: "1. El asesinato será castigado con pena de prisión permanente revisable cuando concurra alguna de las siguientes circunstancias: 1.ª Que la víctima sea menor de dieciséis años de edad, o se trate de persona especialmente vulnerable. 2.ª Que el hecho fuera subsiguiente a un delito contra la libertad sexual. 3.ª Que el delito se hubiera cometido por quien perteneciere a un grupo u organización criminal." },
  { block: "Penal", tema: 13, ref: "Art. 149 CP", q: "Artículo 149 del Código Penal (lesiones muy graves)", a: "1. El que causara a otro, por cualquier medio o procedimiento, la pérdida o la inutilidad de un órgano o miembro principal, o de un sentido, la impotencia, la esterilidad, una grave deformidad, o una grave enfermedad somática o psíquica, será castigado con la pena de prisión de seis a doce años." },
  { block: "Penal", tema: 14, ref: "Art. 249 CP", q: "Artículo 249 del Código Penal (pena de la estafa)", a: "Los reos de estafa serán castigados con la pena de prisión de seis meses a tres años. Para la fijación de la pena se tendrá en cuenta el importe de lo defraudado, el quebranto económico causado al perjudicado, las relaciones entre éste y el defraudador, los medios empleados por éste y cuantas otras circunstancias sirvan para valorar la gravedad de la infracción." },
  { block: "Penal", tema: 15, ref: "Art. 235 CP", q: "Artículo 235 del Código Penal (hurto agravado)", a: "1. El hurto será castigado con la pena de prisión de uno a tres años cuando concurra alguna de las siguientes circunstancias: 1.ª Se sustraigan cosas de valor artístico, histórico, cultural o científico. 2.ª Se trate de cosas de primera necesidad y se cause una situación de desabastecimiento. 5.ª Se utilice a menores de dieciséis años para la comisión del delito." },
  { block: "Penal", tema: 16, ref: "Art. 404 CP", q: "Artículo 404 del Código Penal (prevaricación administrativa)", a: "A la autoridad o funcionario público que, a sabiendas de su injusticia, dictare una resolución arbitraria en un asunto administrativo se le castigará con la pena de inhabilitación especial para empleo o cargo público y para el ejercicio del derecho de sufragio pasivo por tiempo de nueve a quince años." },
  { block: "Penal", tema: 16, ref: "Art. 419 CP", q: "Artículo 419 del Código Penal (cohecho)", a: "La autoridad o funcionario público que, en provecho propio o de un tercero, recibiere o solicitare, por sí o por persona interpuesta, dádiva, favor o retribución de cualquier clase o aceptare ofrecimiento o promesa para realizar en el ejercicio de su cargo un acto contrario a los deberes inherentes al mismo o para no realizar o retrasar injustificadamente el que debiera practicar, incurrirá en la pena de prisión de tres a seis años." },
  { block: "Penal", tema: 16, ref: "Art. 432 CP", q: "Artículo 432 del Código Penal (malversación)", a: "1. La autoridad o funcionario público que se apropiare para sí o para un tercero del patrimonio público que tenga a su cargo, o sobre el que tenga facultades de disposición por razón de sus funciones, será castigado con una pena de prisión de dos a seis años." },
  { block: "Penal", tema: 3, ref: "Art. 6.2 CP", q: "Artículo 6.2 del Código Penal (proporcionalidad de la medida de seguridad)", a: "Las medidas de seguridad no pueden resultar ni más gravosas ni de mayor duración que la pena abstractamente aplicable al hecho cometido, ni exceder el límite de lo necesario para prevenir la peligrosidad del autor." },
];
// ===== AMPLIACIÓN: PROCESAL CIVIL =====
const PROCESAL_CIVIL_2 = [
  { block: "Procesal Civil", tema: 2, ref: "Art. 36 LEC", q: "Artículo 36 de la Ley de Enjuiciamiento Civil (extensión y límites de la jurisdicción)", a: "1. La extensión y límites de la jurisdicción de los tribunales civiles españoles se determinará por lo dispuesto en la Ley Orgánica del Poder Judicial y en los tratados y convenios internacionales en los que España sea parte." },
  { block: "Procesal Civil", tema: 2, ref: "Art. 45 LEC", q: "Artículo 45 de la Ley de Enjuiciamiento Civil (competencia objetiva)", a: "Corresponde a los Juzgados de Primera Instancia, en el orden civil, el conocimiento, en primera instancia, de todos los asuntos que no se hallen atribuidos por esta u otra Ley a otros tribunales." },
  { block: "Procesal Civil", tema: 3, ref: "Art. 253 LEC", q: "Artículo 253 de la Ley de Enjuiciamiento Civil (determinación de la cuantía)", a: "1. En toda demanda habrá de expresarse la cuantía de la misma, con arreglo a las siguientes reglas: si son varios los demandados, se tendrá en cuenta el valor de lo reclamado a todos ellos conjuntamente. Si son varias las acciones acumuladas, la cuantía vendrá determinada por la suma del valor de todas las pretensiones." },
  { block: "Procesal Civil", tema: 5, ref: "Art. 403 LEC", q: "Artículo 403 de la Ley de Enjuiciamiento Civil (admisión de la demanda)", a: "1. Las demandas sólo se inadmitirán en los casos y por las causas expresamente previstas en esta Ley." },
  { block: "Procesal Civil", tema: 6, ref: "Art. 405 LEC", q: "Artículo 405 de la Ley de Enjuiciamiento Civil (contestación a la demanda)", a: "1. En la contestación a la demanda, que se redactará en la forma prevenida para ésta en el artículo 399, el demandado expondrá los fundamentos de su oposición a las pretensiones del actor, alegando las excepciones materiales que tuviere por conveniente." },
  { block: "Procesal Civil", tema: 6, ref: "Art. 431 LEC", q: "Artículo 431 de la Ley de Enjuiciamiento Civil (finalidad del juicio)", a: "El juicio, cuya finalidad es la práctica de las pruebas, se llevará a cabo conforme a lo previsto en los artículos siguientes." },
  { block: "Procesal Civil", tema: 7, ref: "Art. 281 LEC", q: "Artículo 281 de la Ley de Enjuiciamiento Civil (objeto de la prueba)", a: "1. La prueba tendrá como objeto los hechos que guarden relación con la tutela judicial que se pretenda obtener en el proceso.\n3. Están exentos de prueba los hechos sobre los que exista plena conformidad de las partes, salvo en los casos en que la materia objeto del proceso esté fuera del poder de disposición de los litigantes.\n4. No será necesario probar los hechos que gocen de notoriedad absoluta y general." },
  { block: "Procesal Civil", tema: 7, ref: "Art. 335 LEC", q: "Artículo 335 de la Ley de Enjuiciamiento Civil (objeto y finalidad del dictamen de peritos)", a: "1. Cuando sean necesarios conocimientos científicos, artísticos, técnicos o prácticos para valorar hechos o circunstancias relevantes en el asunto o adquirir certeza sobre ellos, las partes podrán aportar al proceso el dictamen de peritos que posean los conocimientos correspondientes." },
  { block: "Procesal Civil", tema: 9, ref: "Art. 400 LEC", q: "Artículo 400 de la Ley de Enjuiciamiento Civil (preclusión de la alegación de hechos y fundamentos jurídicos)", a: "1. Cuando lo que se pida en la demanda pueda fundarse en diferentes hechos o en distintos fundamentos o títulos jurídicos, habrán de aducirse en ella cuantos resulten conocidos o puedan invocarse al tiempo de interponerla, sin que sea admisible reservar su alegación para un proceso ulterior." },
  { block: "Procesal Civil", tema: 10, ref: "Art. 448 LEC", q: "Artículo 448 de la Ley de Enjuiciamiento Civil (derecho a los recursos)", a: "1. Contra las resoluciones de los Tribunales y Letrados de la Administración de Justicia que les afecten desfavorablemente, las partes podrán interponer los recursos previstos en la Ley." },
  { block: "Procesal Civil", tema: 10, ref: "Art. 477 LEC", q: "Artículo 477 de la Ley de Enjuiciamiento Civil (motivos del recurso de casación)", a: "1. El recurso de casación habrá de fundarse, como motivo único, en la infracción de normas aplicables para resolver las cuestiones objeto del proceso.\n2. Serán recurribles en casación las sentencias dictadas en segunda instancia por las Audiencias Provinciales cuando se dictaran para la tutela judicial civil de derechos fundamentales, cuando la cuantía del asunto excediere de 600.000 euros, y cuando la resolución del recurso presente interés casacional." },
  { block: "Procesal Civil", tema: 11, ref: "Art. 816 LEC", q: "Artículo 816 de la Ley de Enjuiciamiento Civil (incomparecencia del deudor)", a: "1. Si el deudor requerido de pago no atendiere el requerimiento de pago ni compareciere, el Letrado de la Administración de Justicia dictará decreto dando por terminado el proceso monitorio y dará traslado al acreedor para que inste el despacho de ejecución." },
  { block: "Procesal Civil", tema: 12, ref: "Art. 528 LEC", q: "Artículo 528 de la Ley de Enjuiciamiento Civil (ámbito de la ejecución provisional)", a: "1. Todas las sentencias dictadas en primera instancia son ejecutables provisionalmente, salvo las excepciones previstas en esta Ley." },
  { block: "Procesal Civil", tema: 13, ref: "Art. 730 LEC", q: "Artículo 730 de la Ley de Enjuiciamiento Civil (momento de solicitud de medidas cautelares)", a: "1. Las medidas cautelares se solicitarán, de ordinario, junto con la demanda principal.\n2. Podrán también solicitarse medidas cautelares antes de la demanda si quien en ese momento las pide alega y acredita razones de urgencia o necesidad." },
];

// ===== AMPLIACIÓN: PROCESAL PENAL =====
const PROCESAL_PENAL_2 = [
  { block: "Procesal Penal", tema: 1, ref: "Art. 14 LECrim", q: "Artículo 14 de la Ley de Enjuiciamiento Criminal (competencia)", a: "Fuera de los casos que expresamente determine esta Ley, serán competentes: para el conocimiento de los juicios por delito leve, el Juzgado de Paz o el Juzgado de Instrucción; para la instrucción de las causas por delito, el Juzgado de Instrucción; para el conocimiento y fallo de las causas por delito a que se refiere el artículo 14 bis, los Juzgados de lo Penal; para el conocimiento y fallo de las causas por los demás delitos, la Audiencia Provincial." },
  { block: "Procesal Penal", tema: 2, ref: "Art. 118 LECrim", q: "Artículo 118 de la Ley de Enjuiciamiento Criminal (derecho de defensa)", a: "1. Toda persona a quien se atribuya un hecho punible podrá ejercitar el derecho de defensa, actuando en el proceso para hacer valer sus derechos e intereses legítimos, desde la atribución del hecho hasta la extinción de la pena." },
  { block: "Procesal Penal", tema: 2, ref: "Art. 302 LECrim", q: "Artículo 302 de la Ley de Enjuiciamiento Criminal (secreto del sumario)", a: "Las partes personadas podrán tomar conocimiento de las actuaciones e intervenir en todas las diligencias del procedimiento. El Juez de Instrucción, de oficio o a instancia de parte, podrá declarar secretas las actuaciones para todas las partes personadas, incluso el investigado, por tiempo no superior a un mes, cuando resulte necesario para evitar un riesgo grave para la vida, libertad o integridad física de otra persona." },
  { block: "Procesal Penal", tema: 4, ref: "Art. 502 LECrim", q: "Artículo 502 de la Ley de Enjuiciamiento Criminal (competencia y forma)", a: "1. La prisión provisional sólo se adoptará cuando objetivamente sea necesaria y cuando no existan otras medidas menos gravosas para el derecho a la libertad a través de las cuales puedan alcanzarse los mismos fines.\n2. La prisión provisional sólo podrá ser decretada previa audiencia del investigado o encausado y del Ministerio Fiscal.\n3. Los autos de prisión y libertad provisionales serán siempre motivados." },
  { block: "Procesal Penal", tema: 4, ref: "Art. 528 LECrim", q: "Artículo 528 de la Ley de Enjuiciamiento Criminal (libertad provisional)", a: "Todo auto de prisión o de libertad provisional será reformable durante todo el curso de la causa." },
  { block: "Procesal Penal", tema: 7, ref: "Art. 108 LECrim", q: "Artículo 108 de la Ley de Enjuiciamiento Criminal (ejercicio conjunto de acciones)", a: "La acción penal deberá entablarse conjuntamente con la civil por el Ministerio Fiscal, haya o no en el proceso acusador particular; pero si el ofendido renunciara expresamente a su derecho de restitución, reparación o indemnización, el Ministerio Fiscal se limitará a pedir el castigo de los culpables." },
  { block: "Procesal Penal", tema: 9, ref: "Art. 790 LECrim", q: "Artículo 790 de la Ley de Enjuiciamiento Criminal (recurso de apelación en el procedimiento abreviado)", a: "1. La sentencia dictada por el Juez de lo Penal es apelable ante la Audiencia Provincial correspondiente. También son apelables los autos que decidan los incidentes, los de sobreseimiento y los que decidan la aplicación de medidas cautelares." },
  { block: "Procesal Penal", tema: 8, ref: "LO 5/1995, art. 2", q: "Artículo 2 de la Ley Orgánica del Tribunal del Jurado (deber y derecho de participar)", a: "1. Todos los ciudadanos españoles, mayores de edad y en pleno ejercicio de sus derechos políticos, podrán participar en la Administración de Justicia mediante la institución del Jurado, en los términos que la presente ley establece.\n2. Igualmente les incumbe el deber de desempeñar la función de jurado cuando fueren llamados a hacerlo." },
];

  { block: "Mercantil", tema: 3, ref: "Art. 23 LSC", q: "Artículo 23 de la Ley de Sociedades de Capital (estatutos)", a: "En los estatutos que han de regir el funcionamiento de las sociedades de capital se hará constar: a) La denominación de la sociedad. b) El objeto social. c) El domicilio social. d) El capital social, las participaciones o acciones en que se divida. e) El modo o modos de organizar la administración de la sociedad." },
  { block: "Mercantil", tema: 4, ref: "Art. 160 LSC", q: "Artículo 160 de la Ley de Sociedades de Capital (competencia de la junta general)", a: "Es competencia de la junta general deliberar y acordar sobre los siguientes asuntos: a) La aprobación de las cuentas anuales, la aplicación del resultado y la aprobación de la gestión social. b) El nombramiento y separación de los administradores. c) La modificación de los estatutos sociales. d) El aumento y la reducción del capital social." },
  { block: "Mercantil", tema: 4, ref: "Art. 236 LSC", q: "Artículo 236 de la Ley de Sociedades de Capital (responsabilidad de los administradores)", a: "1. Los administradores de derecho o de hecho, así como los administradores con arreglo a lo previsto en el artículo siguiente, responderán frente a la sociedad, frente a los socios y frente a los acreedores sociales, del daño que causen por actos u omisiones contrarios a la ley o a los estatutos o por los realizados incumpliendo los deberes inherentes al desempeño del cargo." },
  { block: "Mercantil", tema: 5, ref: "Art. 5 TRLC", q: "Artículo 5 del Texto Refundido de la Ley Concursal (deber de solicitar la declaración de concurso)", a: "1. El deudor deberá solicitar la declaración de concurso dentro de los dos meses siguientes a la fecha en que hubiera conocido o debido conocer el estado de insolvencia actual." },
  { block: "Mercantil", tema: 5, ref: "Art. 44 TRLC", q: "Artículo 44 del Texto Refundido de la Ley Concursal (fases del concurso)", a: "El procedimiento de concurso podrá tener dos fases: la fase común y, una vez finalizada la fase común, la fase de convenio o la de liquidación, sin perjuicio de la existencia de una fase previa de comunicación de negociaciones." },
  { block: "Mercantil", tema: 6, ref: "Art. 33 LCCh", q: "Artículo 33 de la Ley Cambiaria y del Cheque (vencimiento)", a: "La letra de cambio podrá librarse: a la fecha fija, a un plazo contado desde la fecha, a la vista, y a un plazo contado desde la vista. Las letras de cambio que tuvieren otros vencimientos, o vencimientos sucesivos, serán nulas." },
  { block: "Mercantil", tema: 7, ref: "Art. 2 Ley 50/1980", q: "Artículo 2 de la Ley de Contrato de Seguro (fuentes)", a: "Las distintas modalidades del contrato de seguro, en defecto de precepto legal aplicable, se regirán por la voluntad de las partes, por la presente Ley, cuyos preceptos, salvo los referidos a los que están dedicados a normas de Derecho Internacional Privado, tienen carácter imperativo, a no ser que en ellos se disponga otra cosa, por la Ley de Contrato de Seguro, y por las condiciones generales y particulares de la póliza." },
  { block: "Mercantil", tema: 8, ref: "Art. 4 Ley de Marcas", q: "Artículo 4 de la Ley 17/2001 de Marcas (concepto de marca)", a: "1. Se entiende por marca todo signo susceptible de representación gráfica que sirva para distinguir en el mercado los productos o servicios de una empresa de los de otras." },
];

// ===== AMPLIACIÓN: ADMINISTRATIVO =====
const ADMINISTRATIVO_2 = [
  { block: "Administrativo", tema: 1, ref: "Art. 39 LPAC", q: "Artículo 39 de la Ley 39/2015 (eficacia de los actos)", a: "1. Los actos de las Administraciones Públicas sujetos al Derecho Administrativo se presumirán válidos y producirán efectos desde la fecha en que se dicten, salvo que en ellos se disponga otra cosa.\n2. La eficacia quedará demorada cuando así lo exija el contenido del acto o esté supeditada a su notificación, publicación o aprobación superior." },
  { block: "Administrativo", tema: 1, ref: "Art. 40 LPAC", q: "Artículo 40 de la Ley 39/2015 (notificación)", a: "1. El órgano que dicte las resoluciones y actos administrativos los notificará a los interesados cuyos derechos e intereses sean afectados por aquéllos, en los términos previstos en los artículos siguientes.\n2. Toda notificación deberá ser cursada dentro del plazo de diez días a partir de la fecha en que el acto haya sido dictado, y deberá contener el texto íntegro de la resolución, con indicación de si pone fin o no a la vía administrativa, la expresión de los recursos que procedan." },
  { block: "Administrativo", tema: 3, ref: "Art. 122 LPAC", q: "Artículo 122 de la Ley 39/2015 (plazo del recurso de alzada)", a: "1. El plazo para la interposición del recurso de alzada será de un mes, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos. Si el acto no fuera expreso el solicitante y otros posibles interesados podrán interponer recurso de alzada en cualquier momento a partir del día siguiente a aquel en que, de acuerdo con su normativa específica, se produzcan los efectos del silencio administrativo." },
  { block: "Administrativo", tema: 4, ref: "Art. 21 LPAC", q: "Artículo 21 de la Ley 39/2015 (obligación de resolver)", a: "1. La Administración está obligada a dictar resolución expresa y a notificarla en todos los procedimientos cualquiera que sea su forma de iniciación.\n2. El plazo máximo en el que debe notificarse la resolución expresa será el fijado por la norma reguladora del correspondiente procedimiento. Este plazo no podrá exceder de seis meses, salvo que una norma con rango de Ley establezca uno mayor o así venga previsto en el Derecho de la Unión Europea." },
  { block: "Administrativo", tema: 5, ref: "Art. 34 LRJSP", q: "Artículo 34 de la Ley 40/2015 (indemnización)", a: "1. Sólo serán indemnizables las lesiones producidas al particular provenientes de daños que éste no tenga el deber jurídico de soportar de acuerdo con la Ley.\n2. La indemnización se calculará con arreglo a los criterios de valoración establecidos en la legislación fiscal, de expropiación forzosa y demás normas aplicables, ponderándose, en su caso, las valoraciones predominantes en el mercado." },
  { block: "Administrativo", tema: 6, ref: "Art. 25 LJCA", q: "Artículo 25 de la Ley 29/1998 (objeto del recurso)", a: "1. El recurso contencioso-administrativo es admisible en relación con las disposiciones de carácter general y con los actos expresos y presuntos de la Administración Pública que pongan fin a la vía administrativa." },
];

// ===== AMPLIACIÓN: LABORAL =====
const LABORAL_2 = [
  { block: "Laboral", tema: 1, ref: "Art. 8 ET", q: "Artículo 8 del Estatuto de los Trabajadores (forma del contrato)", a: "1. El contrato de trabajo se podrá celebrar por escrito o de palabra. Se presumirá existente entre todo el que presta un servicio por cuenta y dentro del ámbito de organización y dirección de otro y el que lo recibe a cambio de una retribución a aquel." },
  { block: "Laboral", tema: 2, ref: "Art. 56 ET", q: "Artículo 56 del Estatuto de los Trabajadores (efectos del despido improcedente)", a: "1. Cuando el despido sea declarado improcedente, el empresario, en el plazo de cinco días desde la notificación de la sentencia, podrá optar entre la readmisión del trabajador o el abono de una indemnización equivalente a treinta y tres días de salario por año de servicio." },
  { block: "Laboral", tema: 4, ref: "Art. 5 ET", q: "Artículo 5 del Estatuto de los Trabajadores (deberes laborales)", a: "Los trabajadores tienen como deberes básicos: a) Cumplir con las obligaciones concretas de su puesto de trabajo. b) Observar las medidas de prevención de riesgos laborales. c) Cumplir las órdenes e instrucciones del empresario en el ejercicio regular de sus facultades directivas. d) No concurrir con la actividad de la empresa. e) Contribuir a la mejora de la productividad. f) Cuantos se deriven de los respectivos contratos de trabajo." },
  { block: "Laboral", tema: 5, ref: "Art. 26 LRJS", q: "Artículo 26 de la Ley 36/2011 (competencia territorial)", a: "1. La competencia territorial de los órganos jurisdiccionales del orden social se determinará con arreglo a las normas siguientes: con carácter general será competente el Juzgado de lo Social del lugar de prestación de los servicios, o el del domicilio del demandado, a elección del demandante." },
];

const CONSTITUCIONAL_3 = [
  { block: "Constitucional", tema: 6, ref: "Art. 32 CE", q: "Artículo 32 de la Constitución Española", a: "1. El hombre y la mujer tienen derecho a contraer matrimonio con plena igualdad jurídica.\n2. La ley regulará las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges, las causas de separación y disolución y sus efectos." },
  { block: "Constitucional", tema: 6, ref: "Art. 34 CE", q: "Artículo 34 de la Constitución Española", a: "1. Se reconoce el derecho de fundación para fines de interés general, con arreglo a la ley.\n2. Regirá también para las fundaciones el apartado 2 del artículo 22." },
  { block: "Constitucional", tema: 6, ref: "Art. 36 CE", q: "Artículo 36 de la Constitución Española", a: "La ley regulará las peculiaridades propias del régimen jurídico de los Colegios Profesionales y el ejercicio de las profesiones tituladas. La estructura interna y el funcionamiento de los Colegios deberán ser democráticos." },
  { block: "Constitucional", tema: 6, ref: "Art. 38 CE", q: "Artículo 38 de la Constitución Española", a: "Se reconoce la libertad de empresa en el marco de la economía de mercado. Los poderes públicos garantizan y protegen su ejercicio y la defensa de la productividad, de acuerdo con las exigencias de la economía general y, en su caso, de la planificación." },
  { block: "Constitucional", tema: 6, ref: "Art. 40 CE", q: "Artículo 40 de la Constitución Española", a: "1. Los poderes públicos promoverán las condiciones favorables para el progreso social y económico y para una distribución de la renta regional y personal más equitativa, en el marco de una política de estabilidad económica. De manera especial realizarán una política orientada al pleno empleo.\n2. Asimismo, los poderes públicos fomentarán una política que garantice la formación y readaptación profesionales; velarán por la seguridad e higiene en el trabajo y garantizarán el descanso necesario, mediante la limitación de la jornada laboral, las vacaciones periódicas retribuidas y la promoción de centros adecuados." },
  { block: "Constitucional", tema: 6, ref: "Art. 41 CE", q: "Artículo 41 de la Constitución Española", a: "Los poderes públicos mantendrán un régimen público de Seguridad Social para todos los ciudadanos, que garantice la asistencia y prestaciones sociales suficientes ante situaciones de necesidad, especialmente en caso de desempleo. La asistencia y prestaciones complementarias serán libres." },
  { block: "Constitucional", tema: 6, ref: "Art. 44 CE", q: "Artículo 44 de la Constitución Española", a: "1. Los poderes públicos promoverán y tutelarán el acceso a la cultura, a la que todos tienen derecho.\n2. Los poderes públicos promoverán la ciencia y la investigación científica y técnica en beneficio del interés general." },
  { block: "Constitucional", tema: 6, ref: "Art. 46 CE", q: "Artículo 46 de la Constitución Española", a: "Los poderes públicos garantizarán la conservación y promoverán el enriquecimiento del patrimonio histórico, cultural y artístico de los pueblos de España y de los bienes que lo integran, cualquiera que sea su régimen jurídico y su titularidad." },
  { block: "Constitucional", tema: 6, ref: "Art. 48 CE", q: "Artículo 48 de la Constitución Española", a: "Los poderes públicos promoverán las condiciones para la participación libre y eficaz de la juventud en el desarrollo político, social, económico y cultural." },
  { block: "Constitucional", tema: 6, ref: "Art. 52 CE", q: "Artículo 52 de la Constitución Española", a: "La ley regulará las organizaciones profesionales que contribuyan a la defensa de los intereses económicos que les sean propios. Su estructura interna y funcionamiento deberán ser democráticos." },
  { block: "Constitucional", tema: 12, ref: "Art. 160 CE", q: "Artículo 160 de la Constitución Española (Presidente del TC)", a: "El Presidente del Tribunal Constitucional será nombrado entre sus miembros por el Rey, a propuesta del mismo Tribunal en pleno y por un período de tres años." },
  { block: "Constitucional", tema: 12, ref: "Art. 165 CE", q: "Artículo 165 de la Constitución Española", a: "Una ley orgánica regulará el funcionamiento del Tribunal Constitucional, el estatuto de sus miembros, el procedimiento ante el mismo y las condiciones para el ejercicio de las acciones." },
  { block: "Constitucional", tema: 20, ref: "Art. 137 CE", q: "Artículo 137 de la Constitución Española", a: "El Estado se organiza territorialmente en municipios, en provincias y en las Comunidades Autónomas que se constituyan. Todas estas entidades gozan de autonomía para la gestión de sus respectivos intereses." },
  { block: "Constitucional", tema: 20, ref: "Art. 140 CE", q: "Artículo 140 de la Constitución Española (autonomía municipal)", a: "La Constitución garantiza la autonomía de los municipios. Éstos gozarán de personalidad jurídica plena. Su gobierno y administración corresponde a sus respectivos Ayuntamientos, integrados por los Alcaldes y los Concejales. Los Concejales serán elegidos por los vecinos del municipio mediante sufragio universal, igual, libre, directo y secreto." },
  { block: "Constitucional", tema: 20, ref: "Art. 141 CE", q: "Artículo 141 de la Constitución Española (provincia)", a: "1. La provincia es una entidad local con personalidad jurídica propia, determinada por la agrupación de municipios y división territorial para el cumplimiento de las actividades del Estado. Cualquier alteración de los límites provinciales habrá de ser aprobada por las Cortes Generales mediante ley orgánica.\n2. El Gobierno y la administración autónoma de las provincias estarán encomendados a Diputaciones u otras Corporaciones de carácter representativo." },
  { block: "Constitucional", tema: 21, ref: "Art. 147 CE", q: "Artículo 147 de la Constitución Española (Estatutos de Autonomía)", a: "1. Dentro de los términos de la presente Constitución, los Estatutos serán la norma institucional básica de cada Comunidad Autónoma y el Estado los reconocerá y amparará como parte integrante de su ordenamiento jurídico.\n2. Los Estatutos de autonomía deberán contener: a) La denominación de la Comunidad. b) La delimitación de su territorio. c) La denominación, organización y sede de las instituciones autónomas propias. d) Las competencias asumidas." },
  { block: "Constitucional", tema: 22, ref: "Art. 148 CE", q: "Artículo 148 de la Constitución Española (competencias autonómicas)", a: "1. Las Comunidades Autónomas podrán asumir competencias en las siguientes materias: 1.ª Organización de sus instituciones de autogobierno. 2.ª Las alteraciones de los términos municipales. 3.ª Ordenación del territorio, urbanismo y vivienda. 4.ª Las obras públicas de interés de la Comunidad Autónoma en su propio territorio. 7.ª La agricultura y ganadería. 21.ª Sanidad e higiene." },
  { block: "Constitucional", tema: 22, ref: "Art. 149 CE", q: "Artículo 149 de la Constitución Española (competencias exclusivas del Estado)", a: "1. El Estado tiene competencia exclusiva sobre las siguientes materias: 1.ª La regulación de las condiciones básicas que garanticen la igualdad de todos los españoles en el ejercicio de los derechos y en el cumplimiento de los deberes constitucionales. 2.ª Nacionalidad, inmigración, emigración, extranjería y derecho de asilo. 6.ª Legislación mercantil, penal y penitenciaria; legislación procesal. 8.ª Legislación civil, sin perjuicio de la conservación, modificación y desarrollo por las CCAA de los derechos civiles, forales o especiales. 18.ª Las bases del régimen jurídico de las Administraciones Públicas." },
  { block: "Constitucional", tema: 23, ref: "Art. 138 CE", q: "Artículo 138 de la Constitución Española", a: "1. El Estado garantiza la realización efectiva del principio de solidaridad consagrado en el artículo 2 de la Constitución, velando por el establecimiento de un equilibrio económico, adecuado y justo entre las diversas partes del territorio español.\n2. Las diferencias entre los Estatutos de las distintas Comunidades Autónomas no podrán implicar, en ningún caso, privilegios económicos o sociales." },
  { block: "Constitucional", tema: 24, ref: "Art. 155 CE", q: "Artículo 155 de la Constitución Española", a: "1. Si una Comunidad Autónoma no cumpliere las obligaciones que la Constitución u otras leyes le impongan, o actuare de forma que atente gravemente al interés general de España, el Gobierno, previo requerimiento al Presidente de la Comunidad Autónoma y, en el caso de no ser atendido, con la aprobación por mayoría absoluta del Senado, podrá adoptar las medidas necesarias para obligar a aquélla al cumplimiento forzoso de dichas obligaciones, o para la protección del mencionado interés general." },
  { block: "Constitucional", tema: 26, ref: "Art. 107 CE", q: "Artículo 107 de la Constitución Española (Consejo de Estado)", a: "El Consejo de Estado es el supremo órgano consultivo del Gobierno. Una ley orgánica regulará su composición y competencia." },
  { block: "Constitucional", tema: 27, ref: "Art. 136 CE", q: "Artículo 136 de la Constitución Española (Tribunal de Cuentas)", a: "1. El Tribunal de Cuentas es el supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado, así como del sector público. Dependerá directamente de las Cortes Generales y ejercerá sus funciones por delegación de ellas en el examen y comprobación de la Cuenta General del Estado.\n2. Las cuentas del Estado y del sector público estatal se rendirán al Tribunal de Cuentas y serán censuradas por éste." },
  { block: "Constitucional", tema: 1, ref: "Art. 96 CE", q: "Artículo 96 de la Constitución Española (tratados internacionales)", a: "1. Los tratados internacionales válidamente celebrados, una vez publicados oficialmente en España, formarán parte del ordenamiento interno. Sus disposiciones sólo podrán ser derogadas, modificadas o suspendidas en la forma prevista en los propios tratados o de acuerdo con las normas generales del Derecho internacional.\n2. Para la denuncia de los tratados y convenios internacionales se utilizará el mismo procedimiento previsto para su aprobación en el artículo 94." },
  { block: "Constitucional", tema: 1, ref: "Art. 94 CE", q: "Artículo 94 de la Constitución Española (autorización de tratados)", a: "1. La prestación del consentimiento del Estado para obligarse por medio de tratados o convenios requerirá la previa autorización de las Cortes Generales, en los siguientes casos: a) Tratados de carácter político. b) Tratados o convenios de carácter militar. c) Tratados o convenios que afecten a la integridad territorial del Estado o a los derechos y deberes fundamentales establecidos en el Título I. d) Tratados o convenios que impliquen obligaciones financieras para la Hacienda Pública." },
  { block: "Constitucional", tema: 15, ref: "Art. 90 CE", q: "Artículo 90 de la Constitución Española (tramitación de leyes en el Senado)", a: "1. Aprobado un proyecto de Ley Ordinaria u Orgánica por el Congreso de los Diputados, su Presidente dará inmediata cuenta del mismo al Presidente del Senado, el cual lo someterá a la deliberación de éste.\n2. El Senado en el plazo de dos meses, a partir del día de la recepción del texto, puede, mediante mensaje motivado, oponer su veto o introducir enmiendas al mismo." },
  { block: "Constitucional", tema: 17, ref: "Art. 115 CE", q: "Artículo 115 de la Constitución Española (disolución de las Cámaras)", a: "1. El Presidente del Gobierno, previa deliberación del Consejo de Ministros, y bajo su exclusiva responsabilidad, podrá proponer la disolución del Congreso, del Senado o de las Cortes Generales, que será decretada por el Rey. El decreto de disolución fijará la fecha de las elecciones.\n3. No procederá la disolución cuando esté en trámite una moción de censura." },
  { block: "Constitucional", tema: 18, ref: "Art. 105 CE", q: "Artículo 105 de la Constitución Española", a: "La ley regulará: a) La audiencia de los ciudadanos, directamente o a través de las organizaciones y asociaciones reconocidas por la ley, en el procedimiento de elaboración de las disposiciones administrativas que les afecten. b) El acceso de los ciudadanos a los archivos y registros administrativos, salvo en lo que afecte a la seguridad y defensa del Estado, la averiguación de los delitos y la intimidad de las personas. c) El procedimiento a través del cual deben producirse los actos administrativos." },
  { block: "Constitucional", tema: 18, ref: "Art. 106 CE", q: "Artículo 106 de la Constitución Española", a: "1. Los Tribunales controlan la potestad reglamentaria y la legalidad de la actuación administrativa, así como el sometimiento de ésta a los fines que la justifican.\n2. Los particulares, en los términos establecidos por la ley, tendrán derecho a ser indemnizados por toda lesión que sufran en cualquiera de sus bienes y derechos, salvo en los casos de fuerza mayor, siempre que la lesión sea consecuencia del funcionamiento de los servicios públicos." },
];
const CIVIL_3 = [
  { block: "Civil", tema: 1, ref: "Art. 7 CC", q: "Artículo 7 del Código Civil (buena fe y abuso de derecho)", a: "1. Los derechos deberán ejercitarse conforme a las exigencias de la buena fe.\n2. La ley no ampara el abuso del derecho o el ejercicio antisocial del mismo. Todo acto u omisión que por la intención de su autor, por su objeto o por las circunstancias en que se realice sobrepase manifiestamente los límites normales del ejercicio de un derecho, con daño para tercero, dará lugar a la correspondiente indemnización." },
  { block: "Civil", tema: 3, ref: "Art. 18 CC", q: "Artículo 18 del Código Civil (prueba de la nacionalidad)", a: "Las declaraciones de opción y las de recuperación o conservación de la nacionalidad, así como las de renuncia, se formularán ante el encargado del Registro Civil del domicilio del declarante o ante el que reglamentariamente se determine." },
  { block: "Civil", tema: 3, ref: "Art. 20 CC", q: "Artículo 20 del Código Civil (opción a la nacionalidad)", a: "1. Tienen derecho a optar por la nacionalidad española: a) Las personas que estén o hayan estado sujetas a la patria potestad de un español. b) Aquellas cuyo padre o madre hubiera sido originariamente español y nacido en España. c) Las que se hallen comprendidas en el segundo apartado del artículo 17 o en el artículo 19." },
  { block: "Civil", tema: 3, ref: "Art. 25 CC", q: "Artículo 25 del Código Civil (pérdida de la nacionalidad)", a: "1. Los españoles que sean mayores de edad y se encuentren en pleno uso de su capacidad, perderán la nacionalidad española por adquirir voluntariamente otra nacionalidad si es residiendo habitualmente en el extranjero, o por utilizar exclusivamente la nacionalidad extranjera. 2. En todo caso pierden la nacionalidad los que, habiéndola adquirido, la renuncien expresamente." },
  { block: "Civil", tema: 3, ref: "Art. 41 CC", q: "Artículo 41 del Código Civil (domicilio de las personas jurídicas)", a: "Cuando ni la ley que las haya creado o reconocido, ni los estatutos o las reglas de fundación fijaren el domicilio de las personas jurídicas, se entenderá que lo tienen en el lugar en que se halle establecida su representación legal, o donde ejerzan las principales funciones de su instituto." },
  { block: "Civil", tema: 4, ref: "Art. 319 CC", q: "Artículo 319 del Código Civil (mayoría de edad por vida independiente)", a: "Se reputará para todos los efectos como emancipado al hijo mayor de dieciséis años que con el consentimiento de los padres viviere independientemente de éstos. Los padres podrán revocar este consentimiento." },
  { block: "Civil", tema: 4, ref: "Art. 323 CC", q: "Artículo 323 del Código Civil (efectos de la emancipación)", a: "La emancipación habilita al menor para regir su persona y bienes como si fuera mayor, pero hasta que llegue a la mayor edad no podrá el emancipado tomar dinero a préstamo, gravar o enajenar bienes inmuebles y establecimientos mercantiles o industriales u objetos de extraordinario valor sin consentimiento de sus padres." },
  { block: "Civil", tema: 6, ref: "Art. 48 CC", q: "Artículo 48 del Código Civil (dispensa de impedimentos)", a: "El Juez de Primera Instancia podrá dispensar los impedimentos de muerte dolosa del cónyuge anterior y de parentesco de grado tercero entre colaterales, con arreglo a lo que se disponga en la Ley del Registro Civil." },
  { block: "Civil", tema: 6, ref: "Art. 58 CC", q: "Artículo 58 del Código Civil (expediente matrimonial)", a: "Quien pretenda contraer matrimonio acreditará previamente, en expediente tramitado conforme a la legislación del Registro Civil, que reúne los requisitos de capacidad establecidos en este Código." },
  { block: "Civil", tema: 6, ref: "Art. 61 CC", q: "Artículo 61 del Código Civil (efectos del matrimonio)", a: "El matrimonio produce efectos civiles desde su celebración. Para el pleno reconocimiento de los mismos será necesaria su inscripción en el Registro Civil. El matrimonio no inscrito no perjudica los derechos adquiridos de buena fe por terceras personas." },
  { block: "Civil", tema: 6, ref: "Art. 66 CC", q: "Artículo 66 del Código Civil (igualdad conyugal)", a: "Los cónyuges son iguales en derechos y deberes." },
  { block: "Civil", tema: 6, ref: "Art. 68 CC", q: "Artículo 68 del Código Civil (deberes conyugales)", a: "Los cónyuges están obligados a vivir juntos, guardarse fidelidad y socorrerse mutuamente. Deberán, además, compartir las responsabilidades domésticas y el cuidado y atención de ascendientes y descendientes y otras personas dependientes a su cargo." },
  { block: "Civil", tema: 7, ref: "Art. 82 CC", q: "Artículo 82 del Código Civil (separación de mutuo acuerdo)", a: "1. Los cónyuges podrán acordar su separación de mutuo acuerdo transcurridos tres meses desde la celebración del matrimonio mediante la formulación de un convenio regulador ante el Letrado de la Administración de Justicia o en escritura pública ante Notario." },
  { block: "Civil", tema: 7, ref: "Art. 86 CC", q: "Artículo 86 del Código Civil (divorcio a petición de uno o ambos cónyuges)", a: "Se decretará judicialmente el divorcio, cualquiera que sea la forma de celebración del matrimonio, a petición de uno solo de los cónyuges, de ambos o de uno con el consentimiento del otro, una vez transcurridos tres meses desde la celebración del matrimonio." },
  { block: "Civil", tema: 8, ref: "Art. 160 CC", q: "Artículo 160 del Código Civil (derecho de relación de los hijos)", a: "1. Los progenitores, aunque no ejerzan la patria potestad, y los hijos tienen derecho a relacionarse entre sí, incluso cuando exista un procedimiento penal iniciado por atentar uno contra el otro, salvo que el Juez lo prohíba mediante resolución motivada." },
  { block: "Civil", tema: 8, ref: "Art. 162 CC", q: "Artículo 162 del Código Civil (representación de los hijos)", a: "Los progenitores que ostenten la patria potestad tienen la representación legal de sus hijos menores no emancipados. Se exceptúan: 1.º Los actos relativos a derechos de la personalidad u otros que el hijo, de acuerdo con las leyes y con sus condiciones de madurez, pueda realizar por sí mismo. 2.º Aquellos en que exista conflicto de intereses entre los progenitores y el hijo." },
  { block: "Civil", tema: 8, ref: "Art. 170 CC", q: "Artículo 170 del Código Civil (privación de la patria potestad)", a: "El padre o la madre podrán ser privados total o parcialmente de su potestad por sentencia fundada en el incumplimiento de los deberes inherentes a la misma o dictada en causa criminal o matrimonial." },
  { block: "Civil", tema: 9, ref: "Art. 233 CC", q: "Artículo 233 del Código Civil (constitución de la tutela)", a: "La tutela se constituirá siempre en beneficio de la persona que necesite el apoyo de la misma, con respeto a su voluntad, deseos y preferencias." },
  { block: "Civil", tema: 9, ref: "Art. 258 CC", q: "Artículo 258 del Código Civil (constitución de la curatela)", a: "La curatela solo se aplicará a las personas con discapacidad mayores de edad o menores emancipados en quienes concurra causa de necesitar el complemento de su capacidad." },
  { block: "Civil", tema: 10, ref: "Art. 353 CC", q: "Artículo 353 del Código Civil (accesión)", a: "La propiedad de los bienes da derecho por accesión a todo lo que ellos producen, o se les une o incorpora, natural o artificialmente." },
  { block: "Civil", tema: 10, ref: "Art. 392 CC", q: "Artículo 392 del Código Civil (comunidad de bienes)", a: "Hay comunidad cuando la propiedad de una cosa o de un derecho pertenece pro indiviso a varias personas. A falta de contratos, o de disposiciones especiales, se regirá la comunidad por las prescripciones de este título." },
  { block: "Civil", tema: 11, ref: "Art. 447 CC", q: "Artículo 447 del Código Civil (posesión por acto propio)", a: "Sólo la posesión que se adquiere y disfruta en concepto de dueño puede servir de título para adquirir el dominio." },
  { block: "Civil", tema: 11, ref: "Art. 464 CC", q: "Artículo 464 del Código Civil (posesión de bienes muebles)", a: "La posesión de los bienes muebles, adquirida de buena fe, equivale al título. Sin embargo, el que hubiese perdido una cosa mueble o hubiese sido privado de ella ilegalmente podrá reivindicarla de quien la posea." },
  { block: "Civil", tema: 12, ref: "Art. 1969 CC", q: "Artículo 1969 del Código Civil (cómputo de plazos de prescripción)", a: "El tiempo para la prescripción de toda clase de acciones, cuando no haya disposición especial que otra cosa determine, se contará desde el día en que pudieron ejercitarse." },
  { block: "Civil", tema: 12, ref: "Art. 1973 CC", q: "Artículo 1973 del Código Civil (interrupción de la prescripción)", a: "La prescripción de las acciones se interrumpe por su ejercicio ante los Tribunales, por reclamación extrajudicial del acreedor y por cualquier acto de reconocimiento de la deuda por el deudor." },
  { block: "Civil", tema: 13, ref: "Art. 531 CC", q: "Artículo 531 del Código Civil (clases de servidumbre por su origen)", a: "También pueden establecerse servidumbres en provecho de una o más personas, o de una comunidad, a quienes no pertenezca la finca gravada." },
  { block: "Civil", tema: 13, ref: "Art. 546 CC", q: "Artículo 546 del Código Civil (causas de extinción de las servidumbres)", a: "Las servidumbres se extinguen: 1.º Por reunirse en una misma persona la propiedad del predio dominante y la del sirviente. 2.º Por el no uso durante veinte años. 3.º Cuando los predios vengan a tal estado que no pueda usarse la servidumbre. 4.º Por llegar el día o realizarse la condición, si la servidumbre fuera temporal o condicional. 5.º Por la renuncia del dueño del predio dominante. 6.º Por la redención convenida entre el dueño del predio dominante y el del sirviente." },
  { block: "Civil", tema: 14, ref: "Art. 1861 CC", q: "Artículo 1861 del Código Civil (indivisibilidad de la prenda e hipoteca)", a: "Los contratos de prenda e hipoteca garantizan todos los bienes del deudor, salvo pacto en contrario. La prenda y la hipoteca son indivisibles, aunque la deuda se divida entre los causahabientes del deudor o del acreedor." },
  { block: "Civil", tema: 14, ref: "Art. 1911 CC", q: "Artículo 1911 del Código Civil (responsabilidad universal del deudor)", a: "Del cumplimiento de las obligaciones responde el deudor con todos sus bienes, presentes y futuros." },
  { block: "Civil", tema: 15, ref: "Art. 1256 CC", q: "Artículo 1256 del Código Civil", a: "La validez y el cumplimiento de los contratos no pueden dejarse al arbitrio de uno de los contratantes." },
  { block: "Civil", tema: 15, ref: "Art. 1258 CC", q: "Artículo 1258 del Código Civil (buena fe en la integración contractual)", a: "Los contratos se perfeccionan por el mero consentimiento, y desde entonces obligan, no sólo al cumplimiento de lo expresamente pactado, sino también a todas las consecuencias que, según su naturaleza, sean conformes a la buena fe, al uso y a la ley." },
  { block: "Civil", tema: 15, ref: "Art. 1091 CC", q: "Artículo 1091 del Código Civil (pacta sunt servanda)", a: "Las obligaciones que nacen de los contratos tienen fuerza de ley entre las partes contratantes, y deben cumplirse al tenor de los mismos." },
  { block: "Civil", tema: 18, ref: "Art. 1105 CC", q: "Artículo 1105 del Código Civil (caso fortuito)", a: "Fuera de los casos expresamente mencionados en la ley, y de los en que así lo declare la obligación, nadie responderá de aquellos sucesos que no hubieran podido preverse, o que, previstos, fueran inevitables." },
  { block: "Civil", tema: 18, ref: "Art. 1108 CC", q: "Artículo 1108 del Código Civil (indemnización moratoria en obligaciones dinerarias)", a: "Si la obligación consistiere en el pago de una cantidad de dinero, y el deudor incurriere en mora, la indemnización de daños y perjuicios, no habiendo pacto en contrario, consistirá en el pago de los intereses convenidos, y a falta de convenio, en el interés legal." },
  { block: "Civil", tema: 19, ref: "Art. 1450 CC", q: "Artículo 1450 del Código Civil (perfección de la venta)", a: "La venta se perfeccionará entre comprador y vendedor, y será obligatoria para ambos, si hubieren convenido en la cosa objeto del contrato y en el precio, aunque ni la una ni el otro se hayan entregado." },
  { block: "Civil", tema: 19, ref: "Art. 1462 CC", q: "Artículo 1462 del Código Civil (entrega de la cosa vendida)", a: "Se entenderá entregada la cosa vendida, cuando se ponga en poder y posesión del comprador. Cuando se haga la venta mediante escritura pública, el otorgamiento de ésta equivaldrá a la entrega de la cosa objeto del contrato, si de la misma escritura no resultare o se dedujere claramente lo contrario." },
  { block: "Civil", tema: 20, ref: "Art. 1554 CC", q: "Artículo 1554 del Código Civil (obligaciones del arrendador)", a: "El arrendador está obligado: 1.º A entregar al arrendatario la cosa objeto del contrato. 2.º A hacer en ella durante el arrendamiento todas las reparaciones necesarias a fin de conservarla en estado de servir para el uso a que ha sido destinada. 3.º A mantener al arrendatario en el goce pacífico del arrendamiento por todo el tiempo del contrato." },
