<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Judicatura 26/27</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Judicatura">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4efe6">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper: #f4efe6;
    --ink: #1f2a24;
    --ink-soft: #4a5850;
    --line: #d8cdb8;
    --stamp: #7a2e2e;
    --stamp-soft: #a8514f;
    --gold: #9c7a3c;
    --card: #fffdf8;
    --shadow: rgba(31,42,36,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 10% -10%, #ece3d0 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 50px;
  }

  .masthead{
    width:100%;
    max-width:720px;
    text-align:center;
    border-bottom: 3px double var(--ink);
    padding-bottom:12px;
    margin-bottom:18px;
  }
  .masthead .eyebrow{
    font-family: "Courier New", monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--stamp);
    margin-bottom:6px;
  }
  .masthead h1{
    margin:0;
    font-size:clamp(24px,6vw,34px);
    font-weight:700;
  }
  .masthead .sub{
    margin-top:6px;
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .panel{
    width:100%;
    max-width:720px;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow: 0 12px 30px -18px var(--shadow), 0 2px 0 var(--line);
    border-radius:2px;
    padding:18px;
    margin-bottom:16px;
  }

  .panel h2{
    margin:0 0 10px;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    font-weight:600;
    font-family: "Courier New", monospace;
  }
  .block-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
    gap:7px;
  }
  .block-chip{
    display:flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
    background:#fbf8f1;
    padding:7px 9px;
    border-radius:3px;
    cursor:pointer;
    font-size:13.5px;
    user-select:none;
  }
  .block-chip:hover{ border-color:var(--gold); }
  .block-chip input{ accent-color:var(--stamp); width:15px;height:15px; flex-shrink:0; }
  .block-chip .count{
    margin-left:auto;
    font-family:"Courier New",monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .block-chip.active{ background:#f3e9d8; border-color:var(--gold); }

  .filter-actions{
    display:flex;
    gap:10px;
    margin-top:12px;
    font-size:12.5px;
  }
  .filter-actions button{
    background:none;
    border:none;
    color:var(--stamp);
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
    font-size:12.5px;
    padding:2px 0;
  }

  .stage{
    width:100%;
    max-width:720px;
  }

  .card{
    position:relative;
    min-height:220px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow: 0 18px 40px -22px var(--shadow), 0 2px 0 var(--line);
    padding:30px 26px 26px;
    display:flex;
    flex-direction:column;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background: linear-gradient(90deg, var(--stamp) 0%, var(--stamp) 33%, var(--gold) 33%, var(--gold) 66%, var(--ink) 66%);
    opacity:.65;
  }

  .card-tag{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:6px;
  }
  .card-tag .block-name{
    font-family:"Courier New",monospace;
    font-size:11.5px;
    letter-spacing:.08em;
    color:var(--stamp);
    border:1px solid var(--stamp-soft);
    padding:3px 8px;
    border-radius:2px;
  }
  .card-tag .tema-num{
    font-size:11.5px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .prompt-label{
    font-family:"Courier New",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--gold);
    margin-bottom:10px;
  }
  .article-ref{
    font-size:clamp(28px,7vw,38px);
    line-height:1.2;
    margin:0 0 8px;
    font-weight:700;
    color:var(--ink);
  }
  .article-hint{
    font-size:14.5px;
    color:var(--ink-soft);
    font-style:italic;
    margin:0 0 8px;
  }

  .answer-wrap{
    border-top:1px dashed var(--line);
    padding-top:16px;
    margin-top:20px;
  }
  .a-label{
    font-family:"Courier New",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--gold);
    margin-bottom:8px;
  }
  .answer-text{
    font-size:15.5px;
    line-height:1.62;
    color:var(--ink);
    margin:0;
    white-space:pre-line;
  }

  .reveal-btn{
    align-self:flex-start;
    margin-top:auto;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:12px 22px;
    font-family: "Courier New", monospace;
    font-size:13px;
    letter-spacing:.06em;
    cursor:pointer;
    border-radius:2px;
  }
  .reveal-btn:active{ background:#33443b; }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-top:16px;
    width:100%;
    max-width:720px;
    flex-wrap:wrap;
  }
  .progress-note{
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:"Courier New",monospace;
  }
  .next-btn{
    background:var(--stamp);
    color:#fff5ea;
    border:none;
    padding:13px 26px;
    font-size:15px;
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:700;
    cursor:pointer;
    border-radius:3px;
    box-shadow: 0 8px 18px -8px rgba(122,46,46,.55);
  }
  .next-btn:active{ background:#8f3535; transform: translateY(1px); }

  .empty-state{
    text-align:center;
    padding:36px 20px;
    color:var(--ink-soft);
  }
  .empty-state strong{ display:block; color:var(--ink); margin-bottom:6px; font-size:16px; }

  @media (max-width:480px){
    .panel{padding:14px;}
    .card{padding:22px 16px 20px; min-height:200px;}
    .controls{ justify-content:center; text-align:center; }
    .next-btn{ width:100%; }
  }
</style>
</head>
<body>

  <div class="masthead">
    <div class="eyebrow">Acceso a la Carrera Judicial y Fiscal · Convocatoria 2026/2027</div>
    <h1>Repaso oral</h1>
    <div class="sub">Se te da el artículo — recítalo mentalmente y destapa para comprobar.</div>
  </div>

  <div class="panel filters">
    <h2>FILTRAR POR BLOQUE</h2>
    <div class="block-grid" id="blockGrid"></div>
    <div class="filter-actions">
      <button id="selectAll">Marcar todos</button>
      <button id="selectNone">Ninguno</button>
    </div>
  </div>

  <div class="stage">
    <div class="card" id="card"></div>
  </div>

  <div class="controls">
    <div class="progress-note" id="progressNote">—</div>
    <button class="next-btn" id="nextBtn">Otro artículo →</button>
  </div>

<script>
// ===== BLOQUE: CONSTITUCIONAL =====
const CONSTITUCIONAL = [
  { block: "Constitucional", tema: 1, ref: "Art. 1 CE", q: "Artículo 1 de la Constitución Española", a: "1. España se constituye en un Estado social y democrático de Derecho, que propugna como valores superiores de su ordenamiento jurídico la libertad, la justicia, la igualdad y el pluralismo político.\n2. La soberanía nacional reside en el pueblo español, del que emanan los poderes del Estado.\n3. La forma política del Estado español es la Monarquía parlamentaria." },
  { block: "Constitucional", tema: 1, ref: "Art. 2 CE", q: "Artículo 2 de la Constitución Española", a: "La Constitución se fundamenta en la indisoluble unidad de la Nación española, patria común e indivisible de todos los españoles, y reconoce y garantiza el derecho a la autonomía de las nacionalidades y regiones que la integran y la solidaridad entre todas ellas." },
  { block: "Constitucional", tema: 1, ref: "Art. 3 CE", q: "Artículo 3 de la Constitución Española", a: "1. El castellano es la lengua española oficial del Estado. Todos los españoles tienen el deber de conocerla y el derecho a usarla.\n2. Las demás lenguas españolas serán también oficiales en las respectivas Comunidades Autónomas de acuerdo con sus Estatutos.\n3. La riqueza de las distintas modalidades lingüísticas de España es un patrimonio cultural que será objeto de especial respeto y protección." },
  { block: "Constitucional", tema: 1, ref: "Art. 4 CE", q: "Artículo 4 de la Constitución Española", a: "1. La bandera de España está formada por tres franjas horizontales, roja, amarilla y roja, siendo la amarilla de doble anchura que cada una de las rojas.\n2. Los Estatutos podrán reconocer banderas y enseñas propias de las CCAA, que se utilizarán junto a la bandera de España en sus edificios públicos y actos oficiales." },
  { block: "Constitucional", tema: 1, ref: "Art. 9 CE", q: "Artículo 9 de la Constitución Española", a: "1. Los ciudadanos y los poderes públicos están sujetos a la Constitución y al resto del ordenamiento jurídico.\n2. Corresponde a los poderes públicos promover las condiciones para que la libertad e igualdad del individuo y de los grupos sean reales y efectivas.\n3. La Constitución garantiza el principio de legalidad, la jerarquía normativa, la publicidad de las normas, la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, la seguridad jurídica, la responsabilidad y la interdicción de la arbitrariedad de los poderes públicos." },
  { block: "Constitucional", tema: 2, ref: "Art. 81 CE", q: "Artículo 81 de la Constitución Española", a: "1. Son leyes orgánicas las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general y las demás previstas en la Constitución.\n2. La aprobación, modificación o derogación de las leyes orgánicas exigirá mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto." },
  { block: "Constitucional", tema: 2, ref: "Art. 82 CE", q: "Artículo 82 de la Constitución Española (delegación legislativa)", a: "1. Las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley sobre materias determinadas no incluidas en el artículo anterior.\n2. La delegación legislativa deberá otorgarse mediante una ley de bases cuando su objeto sea la formación de textos articulados o por una ley ordinaria cuando se trate de refundir varios textos legales en uno solo." },
  { block: "Constitucional", tema: 2, ref: "Art. 86 CE", q: "Artículo 86 de la Constitución Española (decreto-ley)", a: "1. En caso de extraordinaria y urgente necesidad, el Gobierno podrá dictar disposiciones legislativas provisionales que tomarán la forma de Decretos-leyes, que no podrán afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades de los ciudadanos regulados en el Título I, al régimen de las CCAA ni al Derecho electoral general.\n2. Los Decretos-leyes deberán ser inmediatamente sometidos a debate y votación de totalidad al Congreso, convocado si no estuviere reunido, en el plazo de los treinta días siguientes a su promulgación." },
  { block: "Constitucional", tema: 5, ref: "Art. 167 CE", q: "Artículo 167 de la Constitución Española (reforma ordinaria)", a: "1. Los proyectos de reforma constitucional deberán ser aprobados por una mayoría de tres quintos de cada una de las Cámaras. De no lograrse el acuerdo entre ambas, se intentará por Comisión de composición paritaria, sometiéndose a votación del Congreso y del Senado.\n2. De no lograrse la aprobación mediante el procedimiento anterior, y siempre que el texto hubiere obtenido el voto favorable de la mayoría absoluta del Senado, el Congreso podrá aprobar la reforma por mayoría de dos tercios.\n3. Aprobada la reforma por las Cortes Generales, será sometida a referéndum para su ratificación cuando así lo soliciten, dentro de los quince días siguientes a su aprobación, una décima parte de los miembros de cualquiera de las Cámaras." },
  { block: "Constitucional", tema: 5, ref: "Art. 168 CE", q: "Artículo 168 de la Constitución Española (reforma agravada)", a: "1. Cuando se propusiere la revisión total de la Constitución o una parcial que afecte al Título Preliminar, al Capítulo Segundo, Sección Primera del Título I, o al Título II, se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, y a la disolución inmediata de las Cortes.\n2. Las Cámaras elegidas deberán ratificar la decisión y proceder al estudio del nuevo texto constitucional, que deberá ser aprobado por mayoría de dos tercios de ambas Cámaras.\n3. Aprobada la reforma por las Cortes Generales, será sometida a referéndum para su ratificación." },
  { block: "Constitucional", tema: 6, ref: "Art. 14 CE", q: "Artículo 14 de la Constitución Española", a: "Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social." },
  { block: "Constitucional", tema: 6, ref: "Art. 15 CE", q: "Artículo 15 de la Constitución Española", a: "Todos tienen derecho a la vida y a la integridad física y moral, sin que, en ningún caso, puedan ser sometidos a tortura ni a penas o tratos inhumanos o degradantes. Queda abolida la pena de muerte, salvo lo que puedan disponer las leyes penales militares para tiempos de guerra." },
  { block: "Constitucional", tema: 6, ref: "Art. 16 CE", q: "Artículo 16 de la Constitución Española", a: "1. Se garantiza la libertad ideológica, religiosa y de culto de los individuos y las comunidades sin más limitación, en sus manifestaciones, que la necesaria para el mantenimiento del orden público protegido por la ley.\n2. Nadie podrá ser obligado a declarar sobre su ideología, religión o creencias.\n3. Ninguna confesión tendrá carácter estatal. Los poderes públicos tendrán en cuenta las creencias religiosas de la sociedad española y mantendrán las consiguientes relaciones de cooperación con la Iglesia Católica y las demás confesiones." },
  { block: "Constitucional", tema: 8, ref: "Art. 17 CE", q: "Artículo 17 de la Constitución Española", a: "1. Toda persona tiene derecho a la libertad y a la seguridad. Nadie puede ser privado de su libertad, sino con la observancia de lo establecido en este artículo y en los casos y en la forma previstos en la ley.\n2. La detención preventiva no podrá durar más del tiempo estrictamente necesario para la realización de las averiguaciones tendentes al esclarecimiento de los hechos, y, en todo caso, en el plazo máximo de setenta y dos horas, el detenido deberá ser puesto en libertad o a disposición de la autoridad judicial.\n3. Toda persona detenida debe ser informada de forma inmediata, y de modo que le sea comprensible, de sus derechos y de las razones de su detención, no pudiendo ser obligada a declarar. Se garantiza la asistencia de abogado al detenido en las diligencias policiales y judiciales, en los términos que la ley establezca.\n4. La ley regulará un procedimiento de 'habeas corpus' para producir la inmediata puesta a disposición judicial de toda persona detenida ilegalmente. Asimismo, por ley se determinará el plazo máximo de duración de la prisión provisional." },
  { block: "Constitucional", tema: 6, ref: "Art. 18 CE", q: "Artículo 18 de la Constitución Española", a: "1. Se garantiza el derecho al honor, a la intimidad personal y familiar y a la propia imagen.\n2. El domicilio es inviolable. Ninguna entrada o registro podrá hacerse en él sin consentimiento del titular o resolución judicial, salvo en caso de flagrante delito.\n3. Se garantiza el secreto de las comunicaciones y, en especial, de las postales, telegráficas y telefónicas, salvo resolución judicial.\n4. La ley limitará el uso de la informática para garantizar el honor y la intimidad personal y familiar de los ciudadanos y el pleno ejercicio de sus derechos." },
  { block: "Constitucional", tema: 6, ref: "Art. 20 CE", q: "Artículo 20 de la Constitución Española", a: "1. Se reconocen y protegen los derechos: a) a expresar y difundir libremente los pensamientos, ideas y opiniones; b) a la producción y creación literaria, artística, científica y técnica; c) a la libertad de cátedra; d) a comunicar o recibir libremente información veraz por cualquier medio de difusión.\n2. El ejercicio de estos derechos no puede restringirse mediante ningún tipo de censura previa.\n5. Solo podrá acordarse el secuestro de publicaciones, grabaciones y otros medios de información en virtud de resolución judicial." },
  { block: "Constitucional", tema: 6, ref: "Art. 21 CE", q: "Artículo 21 de la Constitución Española", a: "1. Se reconoce el derecho de reunión pacífica y sin armas. El ejercicio de este derecho no necesitará autorización previa.\n2. En los casos de reuniones en lugares de tránsito público y manifestaciones se dará comunicación previa a la autoridad, que sólo podrá prohibirlas cuando existan razones fundadas de alteración del orden público, con peligro para personas o bienes." },
  { block: "Constitucional", tema: 6, ref: "Art. 24 CE", q: "Artículo 24 de la Constitución Española", a: "1. Todas las personas tienen derecho a obtener la tutela efectiva de los jueces y tribunales en el ejercicio de sus derechos e intereses legítimos, sin que, en ningún caso, pueda producirse indefensión.\n2. Asimismo, todos tienen derecho al Juez ordinario predeterminado por la ley, a la defensa y a la asistencia de letrado, a ser informados de la acusación formulada contra ellos, a un proceso público sin dilaciones indebidas y con todas las garantías, a utilizar los medios de prueba pertinentes para su defensa, a no declarar contra sí mismos, a no confesarse culpables y a la presunción de inocencia." },
  { block: "Constitucional", tema: 6, ref: "Art. 25 CE", q: "Artículo 25 de la Constitución Española", a: "1. Nadie puede ser condenado o sancionado por acciones u omisiones que en el momento de producirse no constituyan delito, falta o infracción administrativa, según la legislación vigente en aquel momento.\n2. Las penas privativas de libertad y las medidas de seguridad estarán orientadas hacia la reeducación y reinserción social.\n3. La Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad." },
  { block: "Constitucional", tema: 6, ref: "Art. 27 CE", q: "Artículo 27 de la Constitución Española", a: "1. Todos tienen el derecho a la educación. Se reconoce la libertad de enseñanza.\n2. La educación tendrá por objeto el pleno desarrollo de la personalidad humana en el respeto a los principios democráticos de convivencia y a los derechos y libertades fundamentales.\n4. La enseñanza básica es obligatoria y gratuita.\n5. Los poderes públicos garantizan el derecho de todos a la educación, mediante una programación general de la enseñanza, con participación efectiva de todos los sectores afectados y la creación de centros docentes." },
  { block: "Constitucional", tema: 6, ref: "Art. 28 CE", q: "Artículo 28 de la Constitución Española", a: "1. Todos tienen derecho a sindicarse libremente. La ley podrá limitar o exceptuar el ejercicio de este derecho a las Fuerzas o Institutos armados o a los demás Cuerpos sometidos a disciplina militar. La libertad sindical comprende el derecho a fundar sindicatos y a afiliarse al de su elección.\n2. Se reconoce el derecho a la huelga de los trabajadores para la defensa de sus intereses. La ley que regule el ejercicio de este derecho establecerá las garantías precisas para asegurar el mantenimiento de los servicios esenciales de la comunidad." },
  { block: "Constitucional", tema: 6, ref: "Art. 33 CE", q: "Artículo 33 de la Constitución Española", a: "1. Se reconoce el derecho a la propiedad privada y a la herencia.\n2. La función social de estos derechos delimitará su contenido, de acuerdo con las leyes.\n3. Nadie podrá ser privado de sus bienes y derechos sino por causa justificada de utilidad pública o interés social, mediante la correspondiente indemnización y de conformidad con lo dispuesto por las leyes." },
  { block: "Constitucional", tema: 9, ref: "Art. 53 CE", q: "Artículo 53 de la Constitución Española (protección de derechos)", a: "1. Los derechos y libertades reconocidos en el Capítulo Segundo del presente Título vinculan a todos los poderes públicos. Sólo por ley, que en todo caso deberá respetar su contenido esencial, podrá regularse el ejercicio de tales derechos y libertades.\n2. Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo Segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de preferencia y sumariedad y, en su caso, a través del recurso de amparo ante el Tribunal Constitucional.\n3. El reconocimiento, el respeto y la protección de los principios reconocidos en el Capítulo Tercero informarán la legislación positiva, la práctica judicial y la actuación de los poderes públicos." },
  { block: "Constitucional", tema: 9, ref: "Art. 54 CE", q: "Artículo 54 de la Constitución Española (Defensor del Pueblo)", a: "Una ley orgánica regulará la institución del Defensor del Pueblo, como alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos comprendidos en este Título, a cuyo efecto podrá supervisar la actividad de la Administración, dando cuenta a las Cortes Generales." },
  { block: "Constitucional", tema: 14, ref: "Art. 56 CE", q: "Artículo 56 de la Constitución Española (el Rey)", a: "1. El Rey es el Jefe del Estado, símbolo de su unidad y permanencia, arbitra y modera el funcionamiento regular de las instituciones, asume la más alta representación del Estado español en las relaciones internacionales, especialmente con las naciones de su comunidad histórica, y ejerce las funciones que le atribuyen expresamente la Constitución y las leyes.\n2. Su título es el de Rey de España y podrá utilizar los demás que correspondan a la Corona.\n3. La persona del Rey es inviolable y no está sujeta a responsabilidad. Sus actos estarán siempre refrendados." },
  { block: "Constitucional", tema: 14, ref: "Art. 62 CE", q: "Artículo 62 de la Constitución Española (funciones del Rey)", a: "Corresponde al Rey: a) Sancionar y promulgar las leyes; b) Convocar y disolver las Cortes Generales y convocar elecciones; c) Convocar a referéndum en los casos previstos en la Constitución; d) Proponer el candidato a Presidente del Gobierno y, en su caso, nombrarlo, así como poner fin a sus funciones; f) Expedir los decretos acordados en el Consejo de Ministros, conferir los empleos civiles y militares y conceder honores y distinciones; h) El mando supremo de las Fuerzas Armadas; i) Ejercer el derecho de gracia con arreglo a la ley." },
  { block: "Constitucional", tema: 15, ref: "Art. 66 CE", q: "Artículo 66 de la Constitución Española (Cortes Generales)", a: "1. Las Cortes Generales representan al pueblo español y están formadas por el Congreso de los Diputados y el Senado.\n2. Las Cortes Generales ejercen la potestad legislativa del Estado, aprueban sus Presupuestos, controlan la acción del Gobierno y tienen las demás competencias que les atribuya la Constitución.\n3. Las Cortes Generales son inviolables." },
  { block: "Constitucional", tema: 15, ref: "Art. 68 CE", q: "Artículo 68 de la Constitución Española (Congreso de los Diputados)", a: "1. El Congreso se compone de un mínimo de 300 y un máximo de 400 Diputados, elegidos por sufragio universal, libre, igual, directo y secreto.\n2. La circunscripción electoral es la provincia.\n4. El Congreso es elegido por cuatro años. El mandato de los Diputados termina cuatro años después de su elección o el día de la disolución de la Cámara." },
  { block: "Constitucional", tema: 15, ref: "Art. 69 CE", q: "Artículo 69 de la Constitución Española (Senado)", a: "1. El Senado es la Cámara de representación territorial.\n2. En cada provincia se elegirán cuatro Senadores por sufragio universal, libre, igual, directo y secreto.\n5. Las Comunidades Autónomas designarán además un Senador y otro más por cada millón de habitantes de su respectivo territorio.\n6. El Senado es elegido por cuatro años. El mandato de los Senadores termina cuatro años después de su elección o el día de la disolución de la Cámara." },
  { block: "Constitucional", tema: 16, ref: "Art. 99 CE", q: "Artículo 99 de la Constitución Española (investidura)", a: "1. Después de cada renovación del Congreso de los Diputados, y en los demás supuestos constitucionales en que así proceda, el Rey, previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria, propondrá, a través del Presidente del Congreso, un candidato a la Presidencia del Gobierno.\n2. El candidato propuesto expondrá ante el Congreso de los Diputados el programa político del Gobierno que pretenda formar y solicitará la confianza de la Cámara.\n3. Si el Congreso, por el voto de la mayoría absoluta de sus miembros, otorgare su confianza a dicho candidato, el Rey le nombrará Presidente.\n4. De no alcanzarse la mayoría absoluta, se someterá la misma propuesta a nueva votación cuarenta y ocho horas después, y la confianza se entenderá otorgada si obtuviere la mayoría simple." },
  { block: "Constitucional", tema: 16, ref: "Art. 113 CE", q: "Artículo 113 de la Constitución Española (moción de censura)", a: "1. El Congreso de los Diputados puede exigir la responsabilidad política del Gobierno mediante la adopción por mayoría absoluta de la moción de censura.\n2. La moción de censura deberá ser propuesta al menos por la décima parte de los Diputados, y habrá de incluir un candidato a la Presidencia del Gobierno.\n3. La moción de censura no podrá ser votada hasta que transcurran cinco días desde su presentación.\n4. Si la moción de censura no fuere aprobada por el Congreso, los signatarios de la misma no podrán presentar otra durante el mismo período de sesiones." },
  { block: "Constitucional", tema: 17, ref: "Art. 112 CE", q: "Artículo 112 de la Constitución Española (cuestión de confianza)", a: "El Presidente del Gobierno, previa deliberación del Consejo de Ministros, puede plantear ante el Congreso de los Diputados la cuestión de confianza sobre su programa o sobre una declaración de política general. La confianza se entenderá otorgada cuando vote a favor de la misma la mayoría simple de los Diputados." },
  { block: "Constitucional", tema: 19, ref: "Art. 117 CE", q: "Artículo 117 de la Constitución Española (Poder Judicial)", a: "1. La justicia emana del pueblo y se administra en nombre del Rey por Jueces y Magistrados integrantes del poder judicial, independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley.\n3. El ejercicio de la potestad jurisdiccional en todo tipo de procesos, juzgando y haciendo ejecutar lo juzgado, corresponde exclusivamente a los Juzgados y Tribunales determinados por las leyes, según las normas de competencia y procedimiento que las mismas establezcan.\n4. Los Juzgados y Tribunales no ejercerán más funciones que las señaladas en el apartado anterior y las que expresamente les sean atribuidas por ley en garantía de cualquier derecho.\n5. El principio de unidad jurisdiccional es la base de la organización y funcionamiento de los Tribunales. La ley regulará el ejercicio de la jurisdicción militar." },
  { block: "Constitucional", tema: 19, ref: "Art. 122 CE", q: "Artículo 122 de la Constitución Española (CGPJ)", a: "1. La ley orgánica del poder judicial determinará la constitución, funcionamiento y gobierno de los Juzgados y Tribunales.\n2. El Consejo General del Poder Judicial es el órgano de gobierno del mismo. La ley orgánica establecerá su estatuto y el régimen de incompatibilidades de sus miembros y sus funciones, en particular en materia de nombramientos, ascensos, inspección y régimen disciplinario.\n3. El Consejo se compondrá del Presidente del Tribunal Supremo, que lo presidirá, y de veinte miembros nombrados por el Rey por un período de cinco años." },
  { block: "Constitucional", tema: 19, ref: "Art. 124 CE", q: "Artículo 124 de la Constitución Española (Ministerio Fiscal)", a: "1. El Ministerio Fiscal, sin perjuicio de las funciones encomendadas a otros órganos, tiene por misión promover la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la ley, de oficio o a petición de los interesados, así como velar por la independencia de los Tribunales y procurar ante éstos la satisfacción del interés social.\n2. El Ministerio Fiscal ejerce sus funciones por medio de órganos propios conforme a los principios de unidad de actuación y dependencia jerárquica y con sujeción, en todo caso, a los de legalidad e imparcialidad.\n4. El Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno, oído el Consejo General del Poder Judicial." },
  { block: "Constitucional", tema: 12, ref: "Art. 159 CE", q: "Artículo 159 de la Constitución Española (Tribunal Constitucional)", a: "1. El Tribunal Constitucional se compone de 12 miembros nombrados por el Rey; de éstos, cuatro a propuesta del Congreso por mayoría de tres quintos, cuatro a propuesta del Senado con idéntica mayoría, dos a propuesta del Gobierno y dos a propuesta del Consejo General del Poder Judicial.\n3. Los miembros del Tribunal Constitucional serán designados por un período de nueve años y se renovarán por terceras partes cada tres." },
  { block: "Constitucional", tema: 10, ref: "Art. 161 CE", q: "Artículo 161 de la Constitución Española (competencias TC)", a: "1. El Tribunal Constitucional tiene jurisdicción en todo el territorio español y es competente para conocer: a) Del recurso de inconstitucionalidad contra leyes y disposiciones normativas con fuerza de ley; b) Del recurso de amparo por violación de los derechos y libertades referidos en el artículo 53.2; c) De los conflictos de competencia entre el Estado y las Comunidades Autónomas o de los de éstas entre sí; d) De las demás materias que le atribuyan la Constitución o las leyes orgánicas." },
];

// ===== BLOQUE: CIVIL =====
const CIVIL = [
  { block: "Civil", tema: 1, ref: "Art. 1 CC", q: "Artículo 1 del Código Civil", a: "1. Las fuentes del ordenamiento jurídico español son la ley, la costumbre y los principios generales del derecho.\n3. La costumbre sólo regirá en defecto de ley aplicable, siempre que no sea contraria a la moral o al orden público, y que resulte probada.\n4. Los principios generales del derecho se aplicarán en defecto de ley o costumbre, sin perjuicio de su carácter informador del ordenamiento jurídico.\n6. La jurisprudencia complementará el ordenamiento jurídico con la doctrina que, de modo reiterado, establezca el Tribunal Supremo." },
  { block: "Civil", tema: 2, ref: "Art. 3 CC", q: "Artículo 3 del Código Civil", a: "1. Las normas se interpretarán según el sentido propio de sus palabras, en relación con el contexto, los antecedentes históricos y legislativos, y la realidad social del tiempo en que han de ser aplicadas, atendiendo fundamentalmente al espíritu y finalidad de aquellas.\n2. La equidad habrá de ponderarse en la aplicación de las normas, si bien las resoluciones de los Tribunales sólo podrán descansar de manera exclusiva en ella cuando la ley expresamente lo permita." },
  { block: "Civil", tema: 2, ref: "Art. 4 CC", q: "Artículo 4 del Código Civil", a: "1. Procederá la aplicación analógica de las normas cuando éstas no contemplen un supuesto específico, pero regulen otro semejante entre los que se aprecie identidad de razón.\n2. Las leyes penales, las excepcionales y las de ámbito temporal no se aplicarán a supuestos ni en momentos distintos de los comprendidos expresamente en ellas.\n3. Las disposiciones de este Código se aplicarán como supletorias en las materias regidas por otras leyes." },
  { block: "Civil", tema: 2, ref: "Art. 6 CC", q: "Artículo 6 del Código Civil", a: "1. La ignorancia de las leyes no excusa de su cumplimiento. El error de derecho producirá únicamente aquellos efectos que las leyes determinen.\n3. Los actos contrarios a las normas imperativas y a las prohibitivas son nulos de pleno derecho, salvo que en ellas se establezca un efecto distinto para el caso de contravención.\n4. Los actos realizados al amparo del texto de una norma que persigan un resultado prohibido por el ordenamiento jurídico se considerarán ejecutados en fraude de ley y no impedirán la debida aplicación de la norma que se hubiere tratado de eludir." },
  { block: "Civil", tema: 3, ref: "Art. 29 CC", q: "Artículo 29 del Código Civil", a: "El nacimiento determina la personalidad; pero el concebido no nacido se tiene por nacido para todos los efectos que le sean favorables, siempre que nazca con las condiciones que expresa el artículo siguiente." },
  { block: "Civil", tema: 3, ref: "Art. 30 CC", q: "Artículo 30 del Código Civil", a: "La personalidad se adquiere en el momento del nacimiento con vida, una vez producido el entero desprendimiento del seno materno." },
  { block: "Civil", tema: 3, ref: "Art. 32 CC", q: "Artículo 32 del Código Civil", a: "La personalidad civil se extingue por la muerte de las personas." },
  { block: "Civil", tema: 4, ref: "Art. 314 CC", q: "Artículo 314 del Código Civil (causas de emancipación)", a: "La emancipación tiene lugar: 1.º Por la mayor edad. 2.º Por concesión de los que ejerzan la patria potestad. 3.º Por concesión judicial." },
  { block: "Civil", tema: 4, ref: "Art. 316 CC", q: "Artículo 316 del Código Civil", a: "Para que tenga lugar la emancipación por concesión de quienes ejerzan la patria potestad se requiere que el menor tenga dieciséis años cumplidos y que la consienta. Esta emancipación se otorgará por escritura pública o por comparecencia ante el Juez encargado del Registro." },
  { block: "Civil", tema: 5, ref: "Art. 181 CC", q: "Artículo 181 del Código Civil (ausencia legal)", a: "Procede el nombramiento de un defensor que ampare y represente al desaparecido, en caso de que la persona hubiese desaparecido de su domicilio o de su última residencia, sin haberse tenido de ella noticias, o sin haber persona que legalmente le represente, en los casos que determine este Código." },
  { block: "Civil", tema: 5, ref: "Art. 193 CC", q: "Artículo 193 del Código Civil (declaración de fallecimiento)", a: "Procede también la declaración de fallecimiento: 1.º De los que se encuentren en un naufragio, siniestro de aeronave, o sepultamiento, y no se hubiese tenido noticias en un año. 2.º De los que participen en operación de campaña y hayan desaparecido en ella, no habiéndose tenido noticias durante los dos años siguientes a la fecha de la firma del tratado de paz. 3.º De los que hayan desaparecido con ocasión de accidentes con riesgo de vida distintos de los anteriores, no habiéndose tenido noticias en el plazo de tres meses." },
  { block: "Civil", tema: 6, ref: "Art. 44 CC", q: "Artículo 44 del Código Civil", a: "El hombre y la mujer tienen derecho a contraer matrimonio conforme a las disposiciones de este Código. El matrimonio tendrá los mismos requisitos y efectos cuando ambos contrayentes sean del mismo o de diferente sexo." },
  { block: "Civil", tema: 6, ref: "Art. 45 CC", q: "Artículo 45 del Código Civil", a: "No hay matrimonio sin consentimiento matrimonial. La condición, término o modo del consentimiento se tendrá por no puesta." },
  { block: "Civil", tema: 6, ref: "Art. 46 CC", q: "Artículo 46 del Código Civil (impedimentos)", a: "No pueden contraer matrimonio: 1.º Los menores de edad no emancipados. 2.º Los que estén ligados con vínculo matrimonial." },
  { block: "Civil", tema: 6, ref: "Art. 47 CC", q: "Artículo 47 del Código Civil (impedimento de parentesco)", a: "Tampoco pueden contraer matrimonio entre sí: 1.º Los parientes en línea recta por consanguinidad o adopción. 2.º Los colaterales por consanguinidad hasta el tercer grado. 3.º Los condenados como autores o cómplices de la muerte dolosa del cónyuge o persona con la que hubiera estado unida por análoga relación de afectividad a la conyugal." },
  { block: "Civil", tema: 7, ref: "Art. 73 CC", q: "Artículo 73 del Código Civil (causas de nulidad)", a: "Es nulo, cualquiera que sea la forma de su celebración: 1.º El matrimonio celebrado sin consentimiento matrimonial. 2.º El matrimonio celebrado entre las personas a que se refieren los artículos 46 y 47, salvo dispensa. 3.º El que se contraiga sin la intervención del Juez, Alcalde o funcionario ante quien deba celebrarse. 4.º El celebrado por error en la identidad de la persona o en cualidades personalísimas. 5.º El contraído por coacción o miedo grave." },
  { block: "Civil", tema: 7, ref: "Art. 81 CC", q: "Artículo 81 del Código Civil (separación)", a: "Se decretará judicialmente la separación cuando existan y así se acrediten, cualquiera que sea la forma de celebración del matrimonio: a petición de ambos cónyuges o de uno con el consentimiento del otro, una vez transcurridos tres meses desde la celebración del matrimonio; o a petición de uno solo de los cónyuges, transcurridos tres meses desde la celebración del matrimonio." },
  { block: "Civil", tema: 7, ref: "Art. 85 CC", q: "Artículo 85 del Código Civil (divorcio)", a: "El matrimonio se disuelve, sea cual fuere la forma y el tiempo de su celebración, por la muerte o la declaración de fallecimiento de uno de los cónyuges y por el divorcio." },
  { block: "Civil", tema: 8, ref: "Art. 154 CC", q: "Artículo 154 del Código Civil (patria potestad)", a: "Los hijos e hijas menores no emancipados están bajo la patria potestad de sus progenitores. La patria potestad, como responsabilidad parental, se ejercerá siempre en beneficio de los hijos, de acuerdo con su personalidad, y con respeto a sus derechos, su integridad física y mental. Comprende los deberes y facultades de: velar por ellos, tenerlos en su compañía, alimentarlos, educarlos y procurarles una formación integral; representarlos y administrar sus bienes." },
  { block: "Civil", tema: 8, ref: "Art. 156 CC", q: "Artículo 156 del Código Civil", a: "La patria potestad se ejercerá conjuntamente por ambos progenitores o por uno solo con el consentimiento expreso o tácito del otro. Serán válidos los actos que realice uno de ellos conforme al uso social y a las circunstancias, o en situaciones de urgente necesidad." },
  { block: "Civil", tema: 9, ref: "Art. 199 CC", q: "Artículo 199 del Código Civil (medidas de apoyo)", a: "Las personas con discapacidad que precisen apoyo para el adecuado ejercicio de su capacidad jurídica en igualdad de condiciones que las demás podrán solicitar la provisión de medidas de apoyo, incluida la guarda de hecho, la curatela y el defensor judicial." },
  { block: "Civil", tema: 9, ref: "Art. 249 CC", q: "Artículo 249 del Código Civil (curatela)", a: "La curatela se establece para la asistencia en el ejercicio de la capacidad jurídica de las personas mayores de edad, cuando lo necesiten, así como para el mismo fin, en el caso de los menores emancipados cuyos progenitores hubieran fallecido o estuvieren impedidos para el ejercicio de la asistencia prevenida por la ley." },
  { block: "Civil", tema: 11, ref: "Art. 430 CC", q: "Artículo 430 del Código Civil (posesión)", a: "Posesión natural es la tenencia de una cosa o el disfrute de un derecho por una persona. Posesión civil es esa misma tenencia o disfrute unidos a la intención de haber la cosa o derecho como suyos." },
  { block: "Civil", tema: 11, ref: "Art. 433 CC", q: "Artículo 433 del Código Civil (buena fe)", a: "Se reputa poseedor de buena fe al que ignora que en su título o modo de adquirir exista vicio que lo invalide. Se reputa poseedor de mala fe al que se halla en el caso contrario." },
  { block: "Civil", tema: 12, ref: "Art. 1930 CC", q: "Artículo 1930 del Código Civil (prescripción)", a: "Por la prescripción se adquieren, de la manera y con las condiciones determinadas en la ley, el dominio y demás derechos reales. También se extinguen del propio modo por la prescripción los derechos y las acciones, de cualquier clase que sean." },
  { block: "Civil", tema: 12, ref: "Art. 1955 CC", q: "Artículo 1955 del Código Civil (usucapión de muebles)", a: "El dominio de los bienes muebles se prescribe por la posesión no interrumpida de tres años con buena fe. También se prescribe el dominio de las cosas muebles por la posesión no interrumpida de seis años, sin necesidad de ninguna otra condición." },
  { block: "Civil", tema: 12, ref: "Art. 1957 CC", q: "Artículo 1957 del Código Civil (usucapión ordinaria de inmuebles)", a: "El dominio y demás derechos reales sobre bienes inmuebles se prescriben por la posesión durante diez años entre presentes y veinte entre ausentes, con buena fe y justo título." },
  { block: "Civil", tema: 13, ref: "Art. 467 CC", q: "Artículo 467 del Código Civil (usufructo)", a: "El usufructo da derecho a disfrutar los bienes ajenos con la obligación de conservar su forma y sustancia, a no ser que el título de su constitución o la ley autoricen otra cosa." },
  { block: "Civil", tema: 13, ref: "Art. 530 CC", q: "Artículo 530 del Código Civil (servidumbre)", a: "La servidumbre es un gravamen impuesto sobre un inmueble en beneficio de otro perteneciente a distinto dueño. El inmueble a cuyo favor está constituida la servidumbre se llama predio dominante; el que la sufre, predio sirviente." },
  { block: "Civil", tema: 14, ref: "Art. 1857 CC", q: "Artículo 1857 del Código Civil (requisitos de la hipoteca)", a: "Son requisitos esenciales de los contratos de prenda e hipoteca: 1.º Que se constituya para asegurar el cumplimiento de una obligación principal. 2.º Que la cosa pignorada o hipotecada pertenezca en propiedad al que la empeña o hipoteca. 3.º Que las personas que constituyan la prenda o hipoteca tengan la libre disposición de sus bienes." },
  { block: "Civil", tema: 15, ref: "Art. 1254 CC", q: "Artículo 1254 del Código Civil (definición de contrato)", a: "El contrato existe desde que una o varias personas consienten en obligarse, respecto de otra u otras, a dar alguna cosa o prestar algún servicio." },
  { block: "Civil", tema: 15, ref: "Art. 1261 CC", q: "Artículo 1261 del Código Civil (elementos esenciales)", a: "No hay contrato sino cuando concurren los requisitos siguientes: 1.º Consentimiento de los contratantes. 2.º Objeto cierto que sea materia del contrato. 3.º Causa de la obligación que se establezca." },
  { block: "Civil", tema: 16, ref: "Art. 1265 CC", q: "Artículo 1265 del Código Civil (vicios del consentimiento)", a: "Será nulo el consentimiento prestado por error, violencia, intimidación o dolo." },
  { block: "Civil", tema: 16, ref: "Art. 1266 CC", q: "Artículo 1266 del Código Civil (error)", a: "Para que el error invalide el consentimiento, deberá recaer sobre la sustancia de la cosa que fuere objeto del contrato, o sobre aquellas condiciones de la misma que principalmente hubiesen dado motivo a celebrarlo. El error sobre la persona sólo invalidará el contrato cuando la consideración a ella hubiere sido la causa principal del mismo." },
  { block: "Civil", tema: 16, ref: "Art. 1269 CC", q: "Artículo 1269 del Código Civil (dolo)", a: "Hay dolo cuando, con palabras o maquinaciones insidiosas de parte de uno de los contratantes, es inducido el otro a celebrar un contrato que, sin ellas, no hubiera hecho." },
  { block: "Civil", tema: 17, ref: "Art. 1300 CC", q: "Artículo 1300 del Código Civil (anulabilidad)", a: "Los contratos en que concurran los requisitos que expresa el artículo 1261 pueden ser anulados, aunque no haya lesión para los contratantes, siempre que adolezcan de alguno de los vicios que los invalidan con arreglo a la ley." },
  { block: "Civil", tema: 17, ref: "Art. 1301 CC", q: "Artículo 1301 del Código Civil (plazo de caducidad)", a: "La acción de nulidad sólo durará cuatro años. Este tiempo empezará a correr: en los casos de intimidación o violencia, desde el día en que éstas hubiesen cesado; en los de error, o dolo, desde la consumación del contrato." },
  { block: "Civil", tema: 18, ref: "Art. 1124 CC", q: "Artículo 1124 del Código Civil (resolución por incumplimiento)", a: "La facultad de resolver las obligaciones se entiende implícita en las recíprocas, para el caso de que uno de los obligados no cumpliere lo que le incumbe. El perjudicado podrá escoger entre exigir el cumplimiento o la resolución de la obligación, con el resarcimiento de daños y abono de intereses en ambos casos. También podrá pedir la resolución, aun después de haber optado por el cumplimiento, cuando éste resultare imposible." },
  { block: "Civil", tema: 19, ref: "Art. 1445 CC", q: "Artículo 1445 del Código Civil (compraventa)", a: "Por el contrato de compra y venta uno de los contratantes se obliga a entregar una cosa determinada y el otro a pagar por ella un precio cierto, en dinero o signo que lo represente." },
  { block: "Civil", tema: 19, ref: "Art. 1461 CC", q: "Artículo 1461 del Código Civil (obligaciones del vendedor)", a: "El vendedor está obligado a la entrega y saneamiento de la cosa objeto de la venta." },
  { block: "Civil", tema: 19, ref: "Art. 1500 CC", q: "Artículo 1500 del Código Civil (obligación del comprador)", a: "El comprador está obligado a pagar el precio de la cosa vendida en el tiempo y lugar fijados por el contrato. Si no se hubieren fijado, deberá hacerse el pago en el tiempo y lugar en que se haga la entrega de la cosa vendida." },
  { block: "Civil", tema: 21, ref: "Art. 688 CC", q: "Artículo 688 del Código Civil (testamento ológrafo)", a: "El testamento ológrafo sólo podrá otorgarse por personas mayores de edad. Para que sea válido este testamento deberá estar escrito todo él y firmado por el testador, con expresión del año, mes y día en que se otorgue." },
  { block: "Civil", tema: 21, ref: "Art. 695 CC", q: "Artículo 695 del Código Civil (protocolización del ológrafo)", a: "Presentado el testamento ológrafo, si el Notario lo considera válido en cuanto a sus formalidades, lo protocolizará en unión del acta, siempre que del examen de los otros medios de prueba practicados no resultare la falta de autenticidad del testamento." },
  { block: "Civil", tema: 22, ref: "Art. 806 CC", q: "Artículo 806 del Código Civil (legítima)", a: "Legítima es la porción de bienes de que el testador no puede disponer por haberla reservado la ley a determinados herederos, llamados por esto herederos forzosos." },
  { block: "Civil", tema: 22, ref: "Art. 807 CC", q: "Artículo 807 del Código Civil (herederos forzosos)", a: "Son herederos forzosos: 1.º Los hijos y descendientes respecto de sus padres y ascendientes. 2.º A falta de los anteriores, los padres y ascendientes respecto de sus hijos y descendientes. 3.º El viudo o viuda en la forma y medida que establece este Código." },
  { block: "Civil", tema: 23, ref: "Art. 912 CC", q: "Artículo 912 del Código Civil (sucesión intestada)", a: "La sucesión legítima tiene lugar: 1.º Cuando uno muere sin testamento, o con testamento nulo, o que haya perdido después su validez. 2.º Cuando el testamento no contiene institución de heredero en todo o en parte de los bienes. 3.º Cuando falta la condición puesta a la institución de heredero, o éste muere antes que el testador, o repudia la herencia sin tener sustituto y sin que haya lugar al derecho de acrecer." },
  { block: "Civil", tema: 24, ref: "Art. 1902 CC", q: "Artículo 1902 del Código Civil (responsabilidad extracontractual)", a: "El que por acción u omisión causa daño a otro, interviniendo culpa o negligencia, está obligado a reparar el daño causado." },
  { block: "Civil", tema: 25, ref: "Art. 1100 CC", q: "Artículo 1100 del Código Civil (mora)", a: "Incurren en mora los obligados a entregar o a hacer alguna cosa desde que el acreedor les exija judicial o extrajudicialmente el cumplimiento de su obligación. En las obligaciones recíprocas, ninguno de los obligados incurre en mora si el otro no cumple o no se allana a cumplir debidamente lo que le incumbe." },
  { block: "Civil", tema: 26, ref: "Art. 1137 CC", q: "Artículo 1137 del Código Civil (mancomunidad como regla general)", a: "La concurrencia de dos o más acreedores o de dos o más deudores en una sola obligación no implica que cada uno de aquéllos tenga derecho a pedir, ni cada uno de éstos deba prestar íntegramente, las cosas objeto de la misma. Sólo habrá lugar a esto cuando la obligación expresamente lo determine, constituyéndose con el carácter de solidaria." },
  { block: "Civil", tema: 20, ref: "Art. 1543 CC", q: "Artículo 1543 del Código Civil (arrendamiento)", a: "En el arrendamiento de cosas, una de las partes se obliga a dar a la otra el goce o uso de una cosa por tiempo determinado y precio cierto." },
];

// ===== BLOQUE: PENAL =====
const PENAL = [
  { block: "Penal", tema: 1, ref: "Art. 1 CP", q: "Artículo 1 del Código Penal", a: "1. No será castigada ninguna acción ni omisión que no esté prevista como delito por ley anterior a su perpetración.\n2. Las medidas de seguridad sólo podrán aplicarse cuando concurran los presupuestos establecidos previamente por la ley." },
  { block: "Penal", tema: 1, ref: "Art. 2 CP", q: "Artículo 2 del Código Penal (irretroactividad y retroactividad favorable)", a: "1. No será castigado ningún delito con pena que no se halle prevista por ley anterior a su perpetración. Carecerán, igualmente, de efecto retroactivo las leyes que establezcan medidas de seguridad.\n2. No obstante, tendrán efecto retroactivo aquellas leyes penales que favorezcan al reo, aunque al entrar en vigor hubiera recaído sentencia firme y el sujeto estuviese cumpliendo condena." },
  { block: "Penal", tema: 1, ref: "Art. 4 CP", q: "Artículo 4 del Código Penal (interpretación)", a: "1. Las leyes penales no se aplicarán a casos distintos de los comprendidos expresamente en ellas.\n2. En el caso de que un Juez o Tribunal, en el ejercicio de su jurisdicción, tenga conocimiento de alguna acción u omisión que, sin estar penada por la ley, estime digna de represión, se abstendrá de todo procedimiento sobre ella y expondrá al Gobierno las razones que le asistan para creer que debiera ser objeto de sanción penal." },
  { block: "Penal", tema: 3, ref: "Art. 10 CP", q: "Artículo 10 del Código Penal (definición de delito)", a: "Son delitos las acciones y omisiones dolosas o imprudentes penadas por la ley." },
  { block: "Penal", tema: 4, ref: "Art. 5 CP", q: "Artículo 5 del Código Penal (dolo o imprudencia)", a: "No hay pena sin dolo o imprudencia." },
  { block: "Penal", tema: 5, ref: "Art. 20 CP", q: "Artículo 20 del Código Penal (causas eximentes)", a: "Están exentos de responsabilidad criminal: 1.º El que al tiempo de cometer la infracción penal, a causa de cualquier anomalía o alteración psíquica, no pueda comprender la ilicitud del hecho o actuar conforme a esa comprensión. 2.º El que al tiempo de cometer la infracción penal se halle en estado de intoxicación plena por el consumo de bebidas alcohólicas, drogas tóxicas, estupefacientes, sustancias psicotrópicas u otras que produzcan efectos análogos. 4.º El que obre en defensa de la persona o derechos propios o ajenos (legítima defensa). 5.º El que, en estado de necesidad, para evitar un mal propio o ajeno lesione un bien jurídico de otra persona o infrinja un deber, siempre que concurran los requisitos legales. 7.º El que obre en cumplimiento de un deber o en el ejercicio legítimo de un derecho, oficio o cargo." },
  { block: "Penal", tema: 6, ref: "Art. 20.4 CP", q: "Artículo 20.4 del Código Penal (legítima defensa)", a: "Está exento de responsabilidad criminal el que obre en defensa de la persona o derechos propios o ajenos, siempre que concurran los requisitos siguientes: Primero. Agresión ilegítima. Segundo. Necesidad racional del medio empleado para impedirla o repelerla. Tercero. Falta de provocación suficiente por parte del defensor." },
  { block: "Penal", tema: 7, ref: "Art. 19 CP", q: "Artículo 19 del Código Penal (minoría de edad penal)", a: "Los menores de dieciocho años no serán responsables criminalmente con arreglo a este Código. Cuando un menor de dicha edad cometa un hecho delictivo podrá ser responsable con arreglo a lo dispuesto en la ley que regule la responsabilidad penal del menor." },
  { block: "Penal", tema: 8, ref: "Art. 16 CP", q: "Artículo 16 del Código Penal (tentativa)", a: "1. Hay tentativa cuando el sujeto da principio a la ejecución del delito directamente por hechos exteriores, practicando todos o parte de los actos que objetivamente deberían producir el resultado, y sin embargo éste no se produce por causas independientes de la voluntad del autor.\n2. Quedará exento de responsabilidad penal por el delito intentado quien evite voluntariamente la consumación del delito, ya desistiendo de la ejecución ya iniciada, ya impidiendo la producción del resultado." },
  { block: "Penal", tema: 8, ref: "Art. 17 CP", q: "Artículo 17 del Código Penal (conspiración, proposición y provocación)", a: "1. La conspiración existe cuando dos o más personas se conciertan para la ejecución de un delito y resuelven ejecutarlo.\n2. La proposición existe cuando el que ha resuelto cometer un delito invita a otra u otras personas a participar en él.\n3. La conspiración y la proposición para delinquir sólo se castigarán en los casos especialmente previstos en la ley." },
  { block: "Penal", tema: 9, ref: "Art. 27 CP", q: "Artículo 27 del Código Penal (responsables criminalmente)", a: "Son responsables criminalmente de los delitos los autores y los cómplices." },
  { block: "Penal", tema: 9, ref: "Art. 28 CP", q: "Artículo 28 del Código Penal (autoría)", a: "Son autores quienes realizan el hecho por sí solos, conjuntamente o por medio de otro del que se sirven como instrumento. También serán considerados autores: a) Los que inducen directamente a otro u otros a ejecutarlo. b) Los que cooperan a su ejecución con un acto sin el cual no se habría efectuado." },
  { block: "Penal", tema: 9, ref: "Art. 29 CP", q: "Artículo 29 del Código Penal (complicidad)", a: "Son cómplices los que, no hallándose comprendidos en el artículo anterior, cooperan a la ejecución del hecho con actos anteriores o simultáneos." },
  { block: "Penal", tema: 10, ref: "Art. 33 CP", q: "Artículo 33 del Código Penal (clasificación de las penas)", a: "1. En función de su naturaleza y duración, las penas se clasifican en graves, menos graves y leves.\n2. Son penas graves, entre otras: la prisión permanente revisable, la prisión superior a cinco años, la inhabilitación absoluta.\n3. Son penas menos graves: la prisión de tres meses hasta cinco años, las inhabilitaciones especiales hasta cinco años, la suspensión de empleo o cargo público." },
  { block: "Penal", tema: 11, ref: "Art. 80 CP", q: "Artículo 80 del Código Penal (suspensión de la ejecución)", a: "1. Los jueces o tribunales, mediante resolución motivada, podrán dejar en suspenso la ejecución de las penas privativas de libertad no superiores a dos años cuando sea razonable esperar que la ejecución de la pena no sea necesaria para evitar la comisión futura por el penado de nuevos delitos." },
  { block: "Penal", tema: 12, ref: "Art. 138 CP", q: "Artículo 138 del Código Penal (homicidio)", a: "1. El que matare a otro será castigado, como reo de homicidio, con la pena de prisión de diez a quince años." },
  { block: "Penal", tema: 12, ref: "Art. 139 CP", q: "Artículo 139 del Código Penal (asesinato)", a: "1. Será castigado con la pena de prisión de quince a veinticinco años, como reo de asesinato, el que matare a otro concurriendo alguna de las circunstancias siguientes: 1.ª Con alevosía. 2.ª Por precio, recompensa o promesa. 3.ª Con ensañamiento, aumentando deliberada e inhumanamente el dolor del ofendido. 4.ª Para facilitar la comisión de otro delito o para evitar que se descubra." },
  { block: "Penal", tema: 13, ref: "Art. 147 CP", q: "Artículo 147 del Código Penal (lesiones)", a: "1. El que, por cualquier medio o procedimiento, causare a otro una lesión que menoscabe su integridad corporal o su salud física o mental, será castigado, como reo del delito de lesiones con la pena de prisión de tres meses a tres años o multa, siempre que la lesión requiera objetivamente para su sanidad, además de una primera asistencia facultativa, tratamiento médico o quirúrgico." },
  { block: "Penal", tema: 14, ref: "Art. 248 CP", q: "Artículo 248 del Código Penal (estafa)", a: "1. Cometen estafa los que, con ánimo de lucro, utilizaren engaño bastante para producir error en otro, induciéndolo a realizar un acto de disposición en perjuicio propio o ajeno." },
  { block: "Penal", tema: 15, ref: "Art. 234 CP", q: "Artículo 234 del Código Penal (hurto)", a: "1. El que, con ánimo de lucro, tomare las cosas muebles ajenas sin la voluntad de su dueño, será castigado, como reo de hurto, con la pena de prisión de seis a dieciocho meses si la cuantía de lo sustraído excede de 400 euros." },
  { block: "Penal", tema: 15, ref: "Art. 237 CP", q: "Artículo 237 del Código Penal (robo)", a: "Son reos del delito de robo los que, con ánimo de lucro, se apoderaren de las cosas muebles ajenas empleando fuerza en las cosas para acceder al lugar donde éstas se encuentran o violencia o intimidación en las personas." },
  { block: "Penal", tema: 16, ref: "Art. 446 CP", q: "Artículo 446 del Código Penal (prevaricación judicial dolosa)", a: "El Juez o Magistrado que, a sabiendas, dictare sentencia o resolución injusta será castigado con pena de prisión de uno a cuatro años si se trata de sentencia injusta contra el reo en causa criminal por delito, y con la de inhabilitación especial para empleo o cargo público por tiempo de diez a veinte años cuando dictare cualquier otra sentencia o resolución injustas." },
  { block: "Penal", tema: 16, ref: "Art. 447 CP", q: "Artículo 447 del Código Penal (prevaricación judicial imprudente)", a: "El Juez o Magistrado que por imprudencia grave o ignorancia inexcusable dictara sentencia o resolución manifiestamente injusta incurrirá en la pena de inhabilitación especial para empleo o cargo público por tiempo de dos a seis años." },
  { block: "Penal", tema: 17, ref: "Art. 21 CP", q: "Artículo 21 del Código Penal (atenuantes)", a: "Son circunstancias atenuantes: 1.ª Las causas expresadas en el capítulo anterior, cuando no concurrieren todos los requisitos necesarios para eximir de responsabilidad. 2.ª La grave adicción a sustancias. 3.ª Obrar por causas o estímulos tan poderosos que hayan producido arrebato, obcecación u otro estado pasional de entidad semejante. 4.ª Haber procedido el culpable a confesar la infracción a las autoridades antes de conocer que el procedimiento se dirige contra él. 5.ª Haber procedido a reparar el daño ocasionado a la víctima." },
  { block: "Penal", tema: 17, ref: "Art. 22 CP", q: "Artículo 22 del Código Penal (agravantes)", a: "Son circunstancias agravantes: 1.ª Ejecutar el hecho con alevosía. 2.ª Ejecutar el hecho mediante disfraz, con abuso de superioridad, o aprovechando circunstancias de lugar, tiempo o auxilio de otras personas que debiliten la defensa del ofendido. 3.ª Ejecutar el hecho mediante precio, recompensa o promesa. 4.ª Cometer el delito por motivos racistas, antisemitas u otra clase de discriminación. 8.ª Ser reincidente." },
  { block: "Penal", tema: 12, ref: "Art. 142 CP", q: "Artículo 142 del Código Penal (homicidio imprudente)", a: "1. El que por imprudencia grave causare la muerte de otro, será castigado, como reo de homicidio imprudente, con la pena de prisión de uno a cuatro años." },
  { block: "Penal", tema: 13, ref: "Art. 148 CP", q: "Artículo 148 del Código Penal (lesiones agravadas)", a: "Las lesiones del artículo anterior podrán ser castigadas con la pena de prisión de dos a cinco años, atendiendo al resultado causado o riesgo producido: 1.º Si en la agresión se hubieren utilizado armas, instrumentos, objetos, medios, métodos o formas concretamente peligrosas para la vida o salud, física o psíquica, del lesionado." },
];

// ===== BLOQUE: PROCESAL CIVIL =====
const PROCESAL_CIVIL = [
  { block: "Procesal Civil", tema: 2, ref: "Art. 1 LEC", q: "Artículo 1 de la Ley de Enjuiciamiento Civil", a: "En los procesos civiles, los Tribunales y quienes ante ellos acudan e intervengan deberán actuar con arreglo a lo dispuesto en esta Ley." },
  { block: "Procesal Civil", tema: 2, ref: "Art. 5 LEC", q: "Artículo 5 de la Ley de Enjuiciamiento Civil (clases de tutela)", a: "1. Se podrá pretender de los tribunales la condena a determinada prestación, la declaración de la existencia de derechos y de situaciones jurídicas, la constitución, modificación o extinción de estas últimas, la ejecución, la adopción de medidas cautelares y cualquier otra clase de tutela que esté expresamente prevista por la ley." },
  { block: "Procesal Civil", tema: 2, ref: "Art. 216 LEC", q: "Artículo 216 de la Ley de Enjuiciamiento Civil (principio de justicia rogada)", a: "Los tribunales civiles decidirán los asuntos en virtud de las aportaciones de hechos, pruebas y pretensiones de las partes, excepto cuando la ley disponga otra cosa en casos especiales." },
  { block: "Procesal Civil", tema: 3, ref: "Art. 249 LEC", q: "Artículo 249 de la Ley de Enjuiciamiento Civil (juicio ordinario)", a: "1. Se decidirán en el juicio ordinario las demandas relativas a derechos honoríficos de la persona, las que pretendan la tutela del derecho al honor, a la intimidad y a la propia imagen, las de impugnación de acuerdos sociales, las de competencia desleal, propiedad industrial, propiedad intelectual y publicidad, y las de cuantía superior a 6.000 euros." },
  { block: "Procesal Civil", tema: 4, ref: "Art. 250 LEC", q: "Artículo 250 de la Ley de Enjuiciamiento Civil (juicio verbal)", a: "1. Se decidirán en juicio verbal las demandas cuya cuantía no exceda de 6.000 euros y no se refieran a ninguna de las materias del apartado siguiente, así como las demandas sobre reclamación de cantidad, tercerías de dominio o mejor derecho, suspensión de obra nueva, desahucio, entre otras." },
  { block: "Procesal Civil", tema: 5, ref: "Art. 399 LEC", q: "Artículo 399 de la Ley de Enjuiciamiento Civil (la demanda)", a: "1. El juicio principiará por demanda, en la que, consignados de conformidad los datos y circunstancias de identificación del actor y del demandado, y el domicilio o residencia en que pueden ser citados, se expondrán numerados y separados los hechos y los fundamentos de derecho y se fijará con claridad y precisión lo que se pida." },
  { block: "Procesal Civil", tema: 6, ref: "Art. 414 LEC", q: "Artículo 414 de la Ley de Enjuiciamiento Civil (audiencia previa)", a: "1. Contestada la demanda y, en su caso, la reconvención, el tribunal, dentro del tercer día, convocará a las partes a una audiencia que habrá de celebrarse en el plazo de veinte días desde la convocatoria. En dicha audiencia, se intentará un acuerdo o transacción de las partes que ponga fin al proceso." },
  { block: "Procesal Civil", tema: 6, ref: "Art. 428 LEC", q: "Artículo 428 de la Ley de Enjuiciamiento Civil (fijación de hechos controvertidos)", a: "1. En la audiencia, las partes o sus defensores, oído el parecer del tribunal, fijarán con precisión los hechos sobre los que exista contradicción entre ellas." },
  { block: "Procesal Civil", tema: 7, ref: "Art. 299 LEC", q: "Artículo 299 de la Ley de Enjuiciamiento Civil (medios de prueba)", a: "1. Los medios de prueba de que se podrá hacer uso en juicio son: 1.º Interrogatorio de las partes. 2.º Documentos públicos. 3.º Documentos privados. 4.º Dictamen de peritos. 5.º Reconocimiento judicial. 6.º Interrogatorio de testigos.\n2. También se admitirán, conforme a lo dispuesto en esta Ley, los medios de reproducción de la palabra, el sonido y la imagen, así como los instrumentos que permiten archivar y conocer o reproducir datos relevantes para el proceso." },
  { block: "Procesal Civil", tema: 8, ref: "Art. 217 LEC", q: "Artículo 217 de la Ley de Enjuiciamiento Civil (carga de la prueba)", a: "1. Cuando, al tiempo de dictar sentencia o resolución semejante, el tribunal considerase dudosos unos hechos relevantes para la decisión, desestimará las pretensiones del actor o del reconviniente, o las del demandado o reconvenido, según corresponda a unos u otros la carga de probar los hechos que permanezcan inciertos y fundamenten las pretensiones.\n2. Corresponde al actor la carga de probar la certeza de los hechos de los que ordinariamente se desprenda, según las normas jurídicas a ellos aplicables, el efecto jurídico correspondiente a las pretensiones de la demanda.\n3. Incumbe al demandado la carga de probar los hechos que, conforme a las normas que les sean aplicables, impidan, extingan o enerven la eficacia jurídica de los hechos a que se refiere el apartado anterior." },
  { block: "Procesal Civil", tema: 9, ref: "Art. 222 LEC", q: "Artículo 222 de la Ley de Enjuiciamiento Civil (cosa juzgada)", a: "1. La cosa juzgada de las sentencias firmes, sean estimatorias o desestimatorias, excluirá, conforme a la ley, un ulterior proceso cuyo objeto sea idéntico al del proceso en que aquélla se produjo.\n4. Lo resuelto con fuerza de cosa juzgada en la sentencia firme que haya puesto fin a un proceso vinculará al tribunal de un proceso posterior cuando en éste aparezca como antecedente lógico de lo que sea su objeto, siempre que los litigantes de ambos procesos sean los mismos o la cosa juzgada se extienda a ellos por disposición legal." },
  { block: "Procesal Civil", tema: 10, ref: "Art. 455 LEC", q: "Artículo 455 de la Ley de Enjuiciamiento Civil (recurso de apelación)", a: "1. Las sentencias dictadas en toda clase de juicio, los autos definitivos y aquellos otros que la ley expresamente señale, serán apelables ante el tribunal que corresponda." },
  { block: "Procesal Civil", tema: 10, ref: "Art. 469 LEC", q: "Artículo 469 de la Ley de Enjuiciamiento Civil (motivos del recurso extraordinario por infracción procesal)", a: "1. El recurso extraordinario por infracción procesal solo podrá fundarse en los siguientes motivos: 1.º Infracción de las normas sobre jurisdicción y competencia objetiva o funcional. 2.º Infracción de las normas procesales reguladoras de la sentencia. 3.º Infracción de las normas legales que rigen los actos y garantías del proceso, cuando produzca indefensión. 4.º Vulneración, en el proceso civil, de derechos fundamentales reconocidos en el artículo 24 CE." },
  { block: "Procesal Civil", tema: 11, ref: "Art. 812 LEC", q: "Artículo 812 de la Ley de Enjuiciamiento Civil (proceso monitorio)", a: "1. Podrá acudir al proceso monitorio quien pretenda de otro el pago de deuda dineraria, cualquiera que sea su cuantía, líquida, determinada, vencida y exigible, cuando la deuda se acredite mediante documentos que aparezcan firmados por el deudor, o mediante facturas, albaranes de entrega, certificaciones, telegramas, telefax, o cualesquiera otros documentos que sean habituales en la relación jurídica de que se trate." },
  { block: "Procesal Civil", tema: 11, ref: "Art. 815 LEC", q: "Artículo 815 de la Ley de Enjuiciamiento Civil (admisión de la petición y requerimiento de pago)", a: "1. Si los documentos aportados con la petición fueran de los previstos en el apartado 2 del artículo 812 o los que se acompañasen constituyen un principio de prueba del derecho del peticionario, el Secretario Judicial requerirá al deudor para que en el plazo de veinte días pague al peticionario, acreditándolo ante el tribunal, o comparezca ante éste y alegue sucintamente, en escrito de oposición, las razones por las que, a su entender, no debe, en todo o en parte, la cantidad reclamada." },
  { block: "Procesal Civil", tema: 12, ref: "Art. 524 LEC", q: "Artículo 524 de la Ley de Enjuiciamiento Civil (ejecución provisional)", a: "1. Salvo cuando se trate de las sentencias a que se refiere el capítulo II de este título, todas las demás sentencias serán ejecutables, mientras penda el recurso de apelación, con arreglo a lo establecido en el presente capítulo. La ejecución provisional deberá ser solicitada por quien haya obtenido un pronunciamiento a su favor en la sentencia." },
  { block: "Procesal Civil", tema: 13, ref: "Art. 727 LEC", q: "Artículo 727 de la Ley de Enjuiciamiento Civil (medidas cautelares específicas)", a: "Conforme a lo establecido en el artículo anterior, podrán acordarse, entre otras, las siguientes medidas cautelares: 1.ª El embargo preventivo de bienes. 2.ª La intervención o la administración judiciales de bienes productivos. 3.ª El depósito de cosa mueble. 4.ª La formación de inventarios de bienes. 5.ª La anotación preventiva de demanda, cuando ésta se refiera a bienes o derechos susceptibles de inscripción en Registros públicos." },
  { block: "Procesal Civil", tema: 13, ref: "Art. 728 LEC", q: "Artículo 728 de la Ley de Enjuiciamiento Civil (presupuestos de las medidas cautelares)", a: "1. Sólo podrán acordarse medidas cautelares si quien las solicita justifica que, en el caso de que se trate, podrían producirse durante la pendencia del proceso situaciones que impidieren o dificultaren la efectividad de la tutela que pudiera otorgarse en una eventual sentencia estimatoria (periculum in mora).\n2. El solicitante de medidas cautelares habrá de presentar los datos, argumentos y justificaciones documentales que conduzcan a fundar, por parte del tribunal, un juicio provisional e indiciario favorable al fundamento de su pretensión (fumus boni iuris).\n3. Salvo que expresamente se disponga otra cosa, el solicitante de la medida cautelar deberá prestar caución suficiente para responder de los daños y perjuicios que la adopción de la medida cautelar pudiera causar." },
  { block: "Procesal Civil", tema: 14, ref: "Art. 71 LEC", q: "Artículo 71 de la Ley de Enjuiciamiento Civil (acumulación de acciones)", a: "1. El actor podrá acumular en la demanda cuantas acciones le competan contra el demandado, aunque provengan de diferentes títulos, siempre que aquéllas no sean incompatibles entre sí." },
  { block: "Procesal Civil", tema: 15, ref: "Art. 410 LEC", q: "Artículo 410 de la Ley de Enjuiciamiento Civil (litispendencia)", a: "La litispendencia, en su aspecto procesal, se produce, con todos sus efectos, desde la interposición de la demanda, si después es admitida." },
];

  { block: "Procesal Penal", tema: 1, ref: "Art. 1 LECrim", q: "Artículo 1 de la Ley de Enjuiciamiento Criminal", a: "No se impondrá pena alguna por consecuencia de actos punibles cuya represión incumbe a la jurisdicción ordinaria, sino de conformidad con las disposiciones del presente Código o de Leyes especiales y en virtud de sentencia dictada por Juez competente." },
  { block: "Procesal Penal", tema: 1, ref: "Art. 2 LECrim (in dubio pro reo)", q: "Artículo 2 de la Ley de Enjuiciamiento Criminal", a: "Todas las Autoridades y funcionarios que intervengan en el procedimiento penal cuidarán, dentro de los límites de su respectiva competencia, de dictar los mandatos necesarios para procurar el buen fin del proceso y de evitar los retrasos que perjudiquen la celeridad del proceso." },
  { block: "Procesal Penal", tema: 4, ref: "Art. 503 LECrim", q: "Artículo 503 de la Ley de Enjuiciamiento Criminal (requisitos de la prisión provisional)", a: "1. La prisión provisional solo podrá ser decretada cuando concurran los siguientes requisitos: 1.º Que conste en la causa la existencia de uno o varios hechos que presenten caracteres de delito sancionado con pena cuyo máximo sea igual o superior a dos años de prisión. 2.º Que aparezcan en la causa motivos bastantes para creer responsable criminalmente del delito a la persona contra quien se haya de dictar el auto de prisión. 3.º Que mediante la prisión provisional se persiga alguno de los fines: asegurar la presencia del investigado o encausado, evitar la ocultación, destrucción o alteración de pruebas, o evitar que el investigado pueda actuar contra bienes jurídicos de la víctima." },
  { block: "Procesal Penal", tema: 4, ref: "Art. 505 LECrim", q: "Artículo 505 de la Ley de Enjuiciamiento Criminal (plazos de la prisión provisional)", a: "Sobre la petición de prisión o libertad provisionales, si ha sido interesada por alguna de las partes, y siempre que el investigado o encausado lo haya sido por delito al que pudiera corresponder pena de prisión igual o superior a dos años, el Juez o Tribunal resolverá mediante auto motivado, dentro de las setenta y dos horas siguientes a su puesta a disposición judicial." },
  { block: "Procesal Penal", tema: 5, ref: "Art. 739 LECrim", q: "Artículo 739 de la Ley de Enjuiciamiento Criminal (última palabra)", a: "Se preguntará a los procesados si tienen algo que manifestar al Tribunal, y si dijeren que sí se les concederá la palabra, y el Presidente les hará retirar del uso de ella tan luego como noten que abusan de su concesión, saliéndose de los límites de la defensa para censurar la conducta de las autoridades o funcionarios o para escitar de cualquiera manera las pasiones populares." },
  { block: "Procesal Penal", tema: 6, ref: "Art. 787 LECrim", q: "Artículo 787 de la Ley de Enjuiciamiento Criminal (conformidad)", a: "1. Antes de iniciarse la práctica de la prueba, la defensa, con la conformidad del acusado presente, podrá pedir al Juez o Tribunal que proceda a dictar sentencia de conformidad con el escrito de acusación que contenga pena de mayor gravedad, o con el que se presentara en ese acto." },
  { block: "Procesal Penal", tema: 7, ref: "Art. 101 LECrim", q: "Artículo 101 de la Ley de Enjuiciamiento Criminal (acción popular)", a: "La acción penal es pública. Todos los ciudadanos españoles podrán ejercitarla con arreglo a las prescripciones de la Ley." },
  { block: "Procesal Penal", tema: 7, ref: "Art. 105 LECrim", q: "Artículo 105 de la Ley de Enjuiciamiento Criminal (obligación del Ministerio Fiscal)", a: "Los funcionarios del Ministerio fiscal tendrán la obligación de ejercitar, con arreglo a las disposiciones de la Ley, todas las acciones penales que consideren procedentes, haya o no acusador particular en las causas, salvo lo dispuesto en el artículo 100 y los casos en que la ley reserve la acusación exclusivamente al ofendido." },
  { block: "Procesal Penal", tema: 8, ref: "LO 5/1995, art. 1", q: "Competencia del Tribunal del Jurado según su Ley Orgánica", a: "El Tribunal del Jurado es competente para el enjuiciamiento de los delitos tasados por su ley orgánica: homicidio, amenazas, omisión del deber de socorro, allanamiento de morada, incendios forestales, infidelidad en la custodia de documentos, cohecho, tráfico de influencias, malversación, fraudes y exacciones ilegales, entre otros expresamente listados." },
  { block: "Procesal Penal", tema: 9, ref: "Art. 847 LECrim", q: "Artículo 847 de la Ley de Enjuiciamiento Criminal (recurso de casación)", a: "1. Podrá interponerse recurso de casación: a) Por infracción de ley y por quebrantamiento de forma, contra las sentencias dictadas en apelación por las Audiencias Provinciales o Sala de lo Penal de la Audiencia Nacional. b) Por infracción de ley, contra las sentencias dictadas en apelación por las Salas Civiles y Penales de los Tribunales Superiores de Justicia." },
  { block: "Procesal Penal", tema: 2, ref: "Art. 299 LECrim", q: "Artículo 299 de la Ley de Enjuiciamiento Criminal (sumario)", a: "Constituyen el sumario las actuaciones encaminadas a preparar el juicio, y practicadas para averiguar y hacer constar la perpetración de los delitos con todas las circunstancias que puedan influir en su calificación, y la culpabilidad de los delincuentes, asegurando sus personas y las responsabilidades pecuniarias de los mismos." },
  { block: "Procesal Penal", tema: 3, ref: "Art. 795 LECrim", q: "Artículo 795 de la Ley de Enjuiciamiento Criminal (diligencias urgentes / juicio rápido)", a: "1. Corresponde el trámite regulado en este Capítulo para el enjuiciamiento rápido de determinados delitos cuando concurran conjuntamente estas circunstancias: 1.ª Que se trate de un delito flagrante, o cuya pena no exceda de cinco años de prisión, o de otras penas de distinta naturaleza cuya duración no exceda de diez años, entre determinados delitos tasados. 2.ª Que se trate de un delito de instrucción sencilla." },
];

  { block: "Laboral", tema: 2, ref: "Art. 54 ET", q: "Artículo 54 del Estatuto de los Trabajadores (despido disciplinario)", a: "1. El contrato de trabajo podrá extinguirse por decisión del empresario, mediante despido basado en un incumplimiento grave y culpable del trabajador.\n2. Se considerarán incumplimientos contractuales: a) Las faltas repetidas e injustificadas de asistencia o puntualidad al trabajo. b) La indisciplina o desobediencia en el trabajo. c) Las ofensas verbales o físicas al empresario o a las personas que trabajan en la empresa o a los familiares que convivan con ellos. d) La transgresión de la buena fe contractual, así como el abuso de confianza en el desempeño del trabajo. e) La disminución continuada y voluntaria en el rendimiento de trabajo normal o pactado. f) La embriaguez habitual o toxicomanía si repercuten negativamente en el trabajo. g) El acoso por razón de origen racial o étnico, religión o convicciones, discapacidad, edad u orientación sexual y el acoso sexual o por razón de sexo al empresario o a las personas que trabajan en la empresa." },
