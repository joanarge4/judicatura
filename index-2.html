  { block: "Civil", tema: 21, ref: "Art. 667 CC", q: "Artículo 667 del Código Civil (concepto de testamento)", a: "El acto por el cual una persona dispone para después de su muerte de todos sus bienes o de parte de ellos, se llama testamento." },
  { block: "Civil", tema: 21, ref: "Art. 670 CC", q: "Artículo 670 del Código Civil (carácter personalísimo del testamento)", a: "El testamento es un acto personalísimo: no podrá dejarse su formación, en todo ni en parte, al arbitrio de un tercero, ni hacerse por medio de comisario o mandatario. Tampoco podrá dejarse al arbitrio de un tercero la subsistencia del nombramiento de herederos o legatarios, ni la designación de las porciones en que hayan de suceder cuando sean instituidos nominalmente." },
  { block: "Civil", tema: 21, ref: "Art. 687 CC", q: "Artículo 687 del Código Civil (nulidad del testamento por defecto de forma)", a: "Será nulo el testamento en cuyo otorgamiento no se hayan observado las formalidades respectivamente establecidas en este capítulo." },
  { block: "Civil", tema: 22, ref: "Art. 809 CC", q: "Artículo 809 del Código Civil (legítima de los ascendientes)", a: "Constituye la legítima de los padres o ascendientes la mitad del haber hereditario de los hijos y descendientes, salvo el caso en que concurrieren con el cónyuge viudo del descendiente causante, en cuyo supuesto será de una tercera parte de la herencia." },
  { block: "Civil", tema: 22, ref: "Art. 834 CC", q: "Artículo 834 del Código Civil (legítima del cónyuge viudo)", a: "El cónyuge que al morir su consorte no se hallase separado de éste legalmente o de hecho, si concurre a la herencia con hijos o descendientes, tendrá derecho al usufructo del tercio destinado a mejora." },
  { block: "Civil", tema: 23, ref: "Art. 930 CC", q: "Artículo 930 del Código Civil (orden en la sucesión de los descendientes)", a: "La sucesión corresponde en primer lugar a la línea recta descendente." },
  { block: "Civil", tema: 23, ref: "Art. 943 CC", q: "Artículo 943 del Código Civil (colaterales)", a: "A falta de hermanos e hijos de hermanos, sucederán al difunto los demás parientes del mismo en línea colateral hasta el cuarto grado, más allá del cual no se extiende el derecho de heredar ab intestato." },
  { block: "Civil", tema: 23, ref: "Art. 956 CC", q: "Artículo 956 del Código Civil (sucesión del Estado)", a: "A falta de personas que tengan derecho a heredar conforme a lo dispuesto en las precedentes Secciones, heredará el Estado." },
  { block: "Civil", tema: 24, ref: "Art. 1904 CC", q: "Artículo 1904 del Código Civil (repetición del que pagó)", a: "El que paga el daño causado por sus dependientes puede repetir de éstos lo que hubiese satisfecho." },
  { block: "Civil", tema: 25, ref: "Art. 1096 CC", q: "Artículo 1096 del Código Civil (obligación de dar)", a: "Cuando lo que deba entregarse sea una cosa determinada, el acreedor, independientemente del derecho que le otorga el artículo 1101, puede compeler al deudor a que realice la entrega." },
  { block: "Civil", tema: 26, ref: "Art. 1138 CC", q: "Artículo 1138 del Código Civil (efectos de la mancomunidad)", a: "Si del texto de las obligaciones a que se refiere el artículo anterior no resulta otra cosa, el crédito o la deuda se presumirán divididos en tantas partes iguales como acreedores o deudores haya, reputándose créditos o deudas distintos unos de otros." },
];
const PENAL_3 = [
  { block: "Penal", tema: 3, ref: "Art. 13 CP", q: "Artículo 13 del Código Penal (clasificación de las infracciones)", a: "1. Son delitos graves las infracciones que la Ley castiga con pena grave.\n2. Son delitos menos graves las infracciones que la Ley castiga con pena menos grave.\n3. Son delitos leves las infracciones que la ley castiga con pena leve.\n4. Cuando la pena, por su extensión, pueda incluirse a la vez entre las graves y las menos graves, el delito se considerará, en todo caso, como grave." },
  { block: "Penal", tema: 3, ref: "Art. 14 CP", q: "Artículo 14 del Código Penal (error de tipo y error de prohibición)", a: "1. El error invencible sobre un hecho constitutivo de la infracción penal excluye la responsabilidad criminal. Si el error, atendidas las circunstancias del hecho y las personales del autor, fuera vencible, la infracción será castigada, en su caso, como imprudente.\n2. El error sobre un hecho que cualifique la infracción o sobre una circunstancia agravante, impedirá su apreciación.\n3. El error invencible sobre la ilicitud del hecho constitutivo de la infracción penal excluye la responsabilidad criminal. Si el error fuera vencible, se aplicará la pena inferior en uno o dos grados." },
  { block: "Penal", tema: 5, ref: "Art. 20.3 CP", q: "Artículo 20.3 del Código Penal (alteraciones en la percepción)", a: "Está exento de responsabilidad criminal el que, por sufrir alteraciones en la percepción desde el nacimiento o desde la infancia, tenga alterada gravemente la conciencia de la realidad." },
  { block: "Penal", tema: 6, ref: "Art. 21.3 CP", q: "Artículo 21.3 del Código Penal (arrebato u obcecación)", a: "Es circunstancia atenuante obrar por causas o estímulos tan poderosos que hayan producido arrebato, obcecación u otro estado pasional de entidad semejante." },
  { block: "Penal", tema: 6, ref: "Art. 21.4 CP", q: "Artículo 21.4 del Código Penal (confesión)", a: "Es circunstancia atenuante haber procedido el culpable, antes de conocer que el procedimiento judicial se dirige contra él, a confesar la infracción a las autoridades." },
  { block: "Penal", tema: 9, ref: "Art. 31 CP", q: "Artículo 31 del Código Penal (actuación en nombre de otro)", a: "El que actúe como administrador de hecho o de derecho de una persona jurídica, o en nombre o representación legal o voluntaria de otro, responderá personalmente, aunque no concurran en él las condiciones, cualidades o relaciones que la correspondiente figura de delito requiera para poder ser sujeto activo del mismo, si tales circunstancias se dan en la entidad o persona en cuyo nombre o representación obre." },
  { block: "Penal", tema: 9, ref: "Art. 31 bis CP", q: "Artículo 31 bis del Código Penal (responsabilidad penal de las personas jurídicas)", a: "1. En los supuestos previstos en este Código, las personas jurídicas serán penalmente responsables: a) De los delitos cometidos en nombre o por cuenta de las mismas, y en su beneficio directo o indirecto, por sus representantes legales o por aquellos que actuando individualmente o como integrantes de un órgano de la persona jurídica, están autorizados para tomar decisiones en nombre de la persona jurídica u ostentan facultades de organización y control dentro de la misma." },
  { block: "Penal", tema: 10, ref: "Art. 32 CP", q: "Artículo 32 del Código Penal (clases de penas)", a: "Las penas que pueden imponerse con arreglo a este Código, bien con carácter principal bien como accesorias, son privativas de libertad, privativas de otros derechos y multa." },
  { block: "Penal", tema: 10, ref: "Art. 39 CP", q: "Artículo 39 del Código Penal (penas privativas de derechos)", a: "Son penas privativas de derechos: a) La inhabilitación absoluta. b) Las de inhabilitación especial para empleo o cargo público, profesión, oficio, industria o comercio. c) La suspensión de empleo o cargo público. d) La privación del derecho a conducir vehículos a motor y ciclomotores. e) La privación del derecho a la tenencia y porte de armas. f) La privación del derecho a residir en determinados lugares o acudir a ellos. g) La prohibición de aproximarse a la víctima. h) La prohibición de comunicarse con la víctima. i) Los trabajos en beneficio de la comunidad. j) La privación de la patria potestad." },
  { block: "Penal", tema: 12, ref: "Art. 143 CP", q: "Artículo 143 del Código Penal (inducción y cooperación al suicidio)", a: "1. El que indujere al suicidio de otro será castigado con la pena de prisión de cuatro a ocho años.\n2. Se impondrá la pena de prisión de dos a cinco años al que coopere con actos necesarios al suicidio de una persona.\n3. Será castigado con la pena de prisión de seis a diez años si la cooperación llegara hasta el punto de ejecutar la muerte." },
  { block: "Penal", tema: 12, ref: "Art. 173 CP", q: "Artículo 173 del Código Penal (trato degradante)", a: "1. El que infligiera a otra persona un trato degradante, menoscabando gravemente su integridad moral, será castigado con la pena de prisión de seis meses a dos años." },
  { block: "Penal", tema: 12, ref: "Art. 178 CP", q: "Artículo 178 del Código Penal (agresión sexual)", a: "1. Es agresión sexual todo acto que atente contra la libertad sexual de otra persona sin su consentimiento. Se entiende que no hay consentimiento cuando el sujeto pasivo no haya manifestado libremente por actos exteriores, concluyentes e inequívocos, de acuerdo con las circunstancias concurrentes, su voluntad expresa de participar en el acto." },
  { block: "Penal", tema: 15, ref: "Art. 238 CP", q: "Artículo 238 del Código Penal (medios comisivos del robo con fuerza)", a: "Son reos del delito de robo con fuerza en las cosas los que ejecuten el hecho cuando concurra alguna de las circunstancias siguientes: 1.º Escalamiento. 2.º Rompimiento de pared, techo o suelo, o fractura de puerta o ventana. 3.º Fractura de armarios, arcas u otra clase de muebles u objetos cerrados o sellados. 4.º Uso de llaves falsas. 5.º Inutilización de sistemas específicos de alarma o guarda." },
  { block: "Penal", tema: 15, ref: "Art. 242 CP", q: "Artículo 242 del Código Penal (robo con violencia o intimidación)", a: "1. El culpable de robo con violencia o intimidación en las personas será castigado con la pena de prisión de dos a cinco años, sin perjuicio de la que pudiera corresponder a los actos de violencia física que realizase." },
  { block: "Penal", tema: 12, ref: "Art. 152 CP", q: "Artículo 152 del Código Penal (lesiones por imprudencia)", a: "1. El que por imprudencia grave causare alguna de las lesiones previstas en los artículos anteriores será castigado con la pena de prisión de tres a seis meses si se tratare de las lesiones del artículo 147.1." },
  { block: "Penal", tema: 16, ref: "Art. 452 CP", q: "Artículo 452 del Código Penal (agravante genérica de prevalimiento de carácter público)", a: "Los ministros de cualquier culto o los funcionarios que abusaren de su ministerio o cargo para cometer alguno de los delitos de este capítulo, serán castigados con la pena que corresponda al delito cometido en su mitad superior y con la de inhabilitación especial para empleo o cargo público, profesión u oficio." },
  { block: "Penal", tema: 17, ref: "Art. 23 CP", q: "Artículo 23 del Código Penal (circunstancia mixta de parentesco)", a: "Es circunstancia que puede atenuar o agravar la responsabilidad, según la naturaleza, los motivos y los efectos del delito, ser o haber sido el agraviado cónyuge o persona que esté o haya estado ligada de forma estable por análoga relación de afectividad, o ser ascendiente, descendiente o hermano por naturaleza o adopción del ofensor o de su cónyuge o conviviente." },
];
const PROCESAL_CIVIL_3 = [
  { block: "Procesal Civil", tema: 2, ref: "Art. 6 LEC", q: "Artículo 6 de la Ley de Enjuiciamiento Civil (capacidad para ser parte)", a: "1. Podrán ser parte en los procesos ante los tribunales civiles: 1.º Las personas físicas. 2.º El concebido no nacido, para todos los efectos que le sean favorables. 3.º Las personas jurídicas. 4.º Las masas patrimoniales o los patrimonios separados que carezcan transitoriamente de titular. 5.º Las entidades sin personalidad jurídica a las que la ley reconozca capacidad para ser parte. 7.º El Ministerio Fiscal, respecto de los procesos en que, conforme a la ley, haya de intervenir." },
  { block: "Procesal Civil", tema: 2, ref: "Art. 7 LEC (capacidad procesal)", q: "Artículo 7 de la Ley de Enjuiciamiento Civil (capacidad procesal)", a: "1. Sólo podrán comparecer en juicio los que estén en el pleno ejercicio de sus derechos civiles. 2. Las personas físicas que no se hallen en el caso del apartado anterior habrán de comparecer mediante la representación o con la asistencia, la autorización, la habilitación o el defensor exigidos por la ley." },
  { block: "Procesal Civil", tema: 2, ref: "Art. 22 LEC", q: "Artículo 22 de la Ley de Enjuiciamiento Civil (terminación del proceso por satisfacción extraprocesal)", a: "1. Cuando, por circunstancias sobrevenidas a la demanda o a la reconvención, dejare de haber interés legítimo en obtener la tutela judicial pretendida, porque se hayan satisfecho, fuera del proceso, las pretensiones del actor y, en su caso, del demandado reconviniente, o por cualquier otra causa, se pondrá de manifiesto esta circunstancia y, si hay acuerdo de las partes, se decretará por el Letrado de la Administración de Justicia la terminación del proceso." },
  { block: "Procesal Civil", tema: 3, ref: "Art. 248 LEC", q: "Artículo 248 de la Ley de Enjuiciamiento Civil (clases de procesos declarativos)", a: "1. Toda contienda judicial entre partes que no tenga señalada por la ley otra tramitación, se ventilará y decidirá en el proceso declarativo que corresponda.\n2. Los procesos declarativos serán el juicio ordinario y el juicio verbal." },
  { block: "Procesal Civil", tema: 5, ref: "Art. 404 LEC", q: "Artículo 404 de la Ley de Enjuiciamiento Civil (admisión de la demanda y emplazamiento)", a: "1. Presentada la demanda, el Tribunal examinará de oficio su jurisdicción y competencia objetiva. Si entiende que tiene jurisdicción y competencia objetiva la admitirá, mediante decreto, y regularmente dará traslado de ella al demandado para que la conteste en el plazo de veinte días." },
  { block: "Procesal Civil", tema: 6, ref: "Art. 416 LEC", q: "Artículo 416 de la Ley de Enjuiciamiento Civil (examen de cuestiones procesales en la audiencia previa)", a: "1. Antes de comenzar la audiencia, y por razones de economía procesal, se examinarán y resolverán todas las cuestiones o circunstancias que puedan impedir la válida prosecución y término del proceso mediante sentencia sobre su objeto y, en particular, las siguientes: 1.ª Falta de capacidad de los litigantes o de representación en sus diversas clases. 2.ª Cosa juzgada o litispendencia. 3.ª Falta del debido litisconsorcio. 4.ª Inadecuación del procedimiento. 5.ª Defecto legal en el modo de proponer la demanda." },
  { block: "Procesal Civil", tema: 7, ref: "Art. 300 LEC", q: "Artículo 300 de la Ley de Enjuiciamiento Civil (momento de proposición de la prueba)", a: "1. En los juicios verbales, las pruebas se propondrán en el acto del juicio.\n2. En el juicio ordinario, se propondrán en el acto de la audiencia previa al juicio, para su práctica en el juicio." },
  { block: "Procesal Civil", tema: 7, ref: "Art. 385 LEC", q: "Artículo 385 de la Ley de Enjuiciamiento Civil (presunciones legales)", a: "1. Las presunciones que la ley establece dispensan de la prueba del hecho presunto a la parte a la que este hecho favorezca.\n3. Las presunciones establecidas por la ley admitirán la prueba en contrario, salvo en los casos en que aquélla expresamente lo prohíba." },
  { block: "Procesal Civil", tema: 8, ref: "Art. 385.3 LEC (presunciones judiciales)", q: "Artículo 386 de la Ley de Enjuiciamiento Civil (presunciones judiciales)", a: "1. A partir de un hecho admitido o probado, el tribunal podrá presumir la certeza, a los efectos del proceso, de otro hecho, si entre el admitido o demostrado y el presunto existe un enlace preciso y directo según las reglas del criterio humano." },
  { block: "Procesal Civil", tema: 9, ref: "Art. 207 LEC", q: "Artículo 207 de la Ley de Enjuiciamiento Civil (resoluciones firmes)", a: "3. Las resoluciones firmes pasan en autoridad de cosa juzgada y el tribunal del proceso en que hayan recaído deberá estar en todo caso a lo dispuesto en ellas.\n4. Transcurridos los plazos previstos para recurrir una resolución sin haberla impugnado, quedará firme y pasada en autoridad de cosa juzgada." },
  { block: "Procesal Civil", tema: 10, ref: "Art. 456 LEC", q: "Artículo 456 de la Ley de Enjuiciamiento Civil (objeto de la apelación)", a: "1. En virtud del recurso de apelación podrá perseguirse, con arreglo a los fundamentos de hecho y de derecho de las pretensiones formuladas ante el tribunal de primera instancia, que se revoque un auto o sentencia y que, en su lugar, se dicte otro u otra favorable al recurrente, mediante nuevo examen de las actuaciones llevadas a cabo ante aquel tribunal." },
  { block: "Procesal Civil", tema: 14, ref: "Art. 76 LEC", q: "Artículo 76 de la Ley de Enjuiciamiento Civil (acumulación de procesos)", a: "1. Procederá la acumulación de procesos cuando la sentencia que haya de recaer en uno de ellos pueda producir efectos prejudiciales en el otro, así como cuando entre los objetos de los procesos cuya acumulación se pida exista tal conexión que, de seguirse por separado, pudieren dictarse sentencias con pronunciamientos o fundamentos contradictorios, incompatibles o mutuamente excluyentes." },
  { block: "Procesal Civil", tema: 15, ref: "Art. 411 LEC", q: "Artículo 411 de la Ley de Enjuiciamiento Civil (perpetuación de la jurisdicción)", a: "Las alteraciones que una vez iniciado el proceso, se produzcan en cuanto al domicilio de las partes, la situación de la cosa litigiosa y el objeto del juicio no modificarán la jurisdicción y la competencia, que se determinarán según lo que se acredite en el momento inicial de la litispendencia." },
];

const PROCESAL_PENAL_3 = [
  { block: "Procesal Penal", tema: 1, ref: "Art. 741 LECrim", q: "Artículo 741 de la Ley de Enjuiciamiento Criminal (valoración de la prueba)", a: "El Tribunal, apreciando según su conciencia las pruebas practicadas en el juicio, las razones expuestas por la acusación y la defensa y lo manifestado por los mismos procesados, dictará sentencia dentro del término fijado en esta Ley." },
  { block: "Procesal Penal", tema: 1, ref: "Art. 142 LECrim", q: "Artículo 142 de la Ley de Enjuiciamiento Criminal (requisitos de las sentencias)", a: "Las sentencias se dictarán por escrito y comenzarán expresando el lugar y fecha en que se dictaren, los hechos que se consideren probados, los fundamentos doctrinales y legales en que se base el fallo, y terminarán con éste." },
  { block: "Procesal Penal", tema: 2, ref: "Art. 259 LECrim (obligación de denunciar)", q: "Artículo 259 de la Ley de Enjuiciamiento Criminal", a: "El que presenciare la perpetración de cualquier delito público está obligado a ponerlo inmediatamente en conocimiento del Juez de Instrucción, de Paz, Comarcal o Municipal, o funcionario fiscal más próximo al sitio en que se hallare, bajo la multa señalada en el artículo 259 bis." },
  { block: "Procesal Penal", tema: 2, ref: "Art. 269 LECrim (denuncia)", q: "Artículo 269 de la Ley de Enjuiciamiento Criminal", a: "Formalizada que sea la denuncia, se procederá o mandará proceder inmediatamente por el Juez o funcionario a quien se hiciese, a la comprobación del hecho denunciado, salvo lo dispuesto en los tres artículos siguientes." },
  { block: "Procesal Penal", tema: 4, ref: "Art. 504 LECrim", q: "Artículo 504 de la Ley de Enjuiciamiento Criminal (duración máxima de la prisión provisional)", a: "2. La prisión provisional no durará más de un año cuando la pena señalada al delito sea igual o inferior a tres años, ni de dos cuando la pena señalada sea superior a esa cifra. En casos de especial complejidad, el Juez podrá acordar mediante auto motivado, la prolongación del plazo de prisión hasta un máximo de dos años en el primer caso y de cuatro en el segundo." },
  { block: "Procesal Penal", tema: 5, ref: "Art. 786 LECrim", q: "Artículo 786 de la Ley de Enjuiciamiento Criminal (apertura del juicio oral y cuestiones previas)", a: "1. El juicio dará comienzo con la lectura de los escritos de acusación y de defensa. Abierto el juicio, se dará la palabra a la acusación y a la defensa, para que puedan exponer las alegaciones que estimen oportunas sobre cuestiones previas que afecten a la competencia del órgano judicial, vulneración de algún derecho fundamental, existencia de artículos de previo pronunciamiento, causas de suspensión del juicio oral y nulidad de actuaciones." },
  { block: "Procesal Penal", tema: 6, ref: "Art. 655 LECrim", q: "Artículo 655 de la Ley de Enjuiciamiento Criminal (conformidad en el procedimiento ordinario)", a: "Si la calificación del Fiscal y la del defensor del procesado fueren idénticas y de conformidad con ella se hallase también el procesado, el Presidente mandará entregarle testimonio de las mismas y le hará saber cuáles son sus derechos, y si el procesado se muestra conforme y su Abogado defensor lo expresase así, en su vista, pidiendo la confirmación de la calificación mutuamente acordada, el Tribunal, sin necesidad de más trámites, dictará sentencia de conformidad." },
  { block: "Procesal Penal", tema: 9, ref: "Art. 855 LECrim (formalización del recurso)", q: "Artículo 855 de la Ley de Enjuiciamiento Criminal (interposición del recurso de casación)", a: "Se interpondrá el recurso presentando escrito autorizado por Procurador y firmado por Letrado ante el Tribunal que hubiere dictado la sentencia." },
  { block: "Procesal Penal", tema: 7, ref: "Art. 100 LECrim", q: "Artículo 100 de la Ley de Enjuiciamiento Criminal", a: "De todo delito o falta nace acción penal para el castigo del culpable, y puede nacer también acción civil para la restitución de la cosa, la reparación del daño y la indemnización de perjuicios causados por el hecho punible." },
];
const MERCANTIL_3 = [
  { block: "Mercantil", tema: 1, ref: "Art. 2 CCom", q: "Artículo 2 del Código de Comercio (actos de comercio)", a: "Los actos de comercio, sean o no comerciantes los que los ejecuten, y estén o no especificados en este Código, se regirán por las disposiciones contenidas en él; en su defecto, por los usos del comercio observados generalmente en cada plaza; y a falta de ambas reglas, por las del derecho común." },
  { block: "Mercantil", tema: 2, ref: "Art. 17 CCom", q: "Artículo 17 del Código de Comercio (Registradores mercantiles)", a: "Los Registradores Mercantiles serán responsables de la inexactitud de los datos que publique el Boletín Oficial del Registro Mercantil, cuando dicha inexactitud sea consecuencia de las omisiones, retrasos o transcripciones defectuosas cometidos en dicho Registro." },
  { block: "Mercantil", tema: 2, ref: "Art. 19 CCom", q: "Artículo 19 del Código de Comercio (publicidad material)", a: "1. Los actos sujetos a inscripción sólo serán oponibles a terceros de buena fe desde su publicación en el Boletín Oficial del Registro Mercantil.\n2. La buena fe del tercero se presume en tanto no se pruebe que conocía el acto sujeto a inscripción y no inscrito." },
  { block: "Mercantil", tema: 3, ref: "Art. 6 LSC", q: "Artículo 6 de la Ley de Sociedades de Capital (forma de constitución)", a: "Las sociedades de capital se constituyen por contrato entre dos o más personas o, en caso de sociedades unipersonales, por acto unilateral, y en ambos casos habrán de adoptar alguno de los tipos sociales previstos en la ley." },
  { block: "Mercantil", tema: 3, ref: "Art. 20 LSC", q: "Artículo 20 de la Ley de Sociedades de Capital (escritura de constitución)", a: "La constitución de las sociedades de capital exigirá escritura pública, que deberá inscribirse en el Registro Mercantil." },
  { block: "Mercantil", tema: 4, ref: "Art. 210 LSC", q: "Artículo 210 de la Ley de Sociedades de Capital (modos de organizar la administración)", a: "1. La administración de la sociedad se podrá confiar a un administrador único, a varios administradores que actúen de forma solidaria o de forma conjunta o a un consejo de administración." },
  { block: "Mercantil", tema: 4, ref: "Art. 217 LSC", q: "Artículo 217 de la Ley de Sociedades de Capital (remuneración de los administradores)", a: "1. El cargo de administrador es gratuito, a menos que los estatutos sociales establezcan lo contrario determinando el sistema de remuneración." },
  { block: "Mercantil", tema: 5, ref: "Art. 6 TRLC", q: "Artículo 6 del Texto Refundido de la Ley Concursal (legitimación para solicitar la declaración de concurso)", a: "1. Para solicitar la declaración de concurso está legitimado el deudor. También lo está cualquiera de sus acreedores, sea cual fuere la naturaleza de su crédito." },
  { block: "Mercantil", tema: 5, ref: "Art. 632 TRLC", q: "Artículo 632 del Texto Refundido de la Ley Concursal (efectos de la apertura de la liquidación)", a: "La apertura de la fase de liquidación producirá la disolución de la sociedad deudora, cesando en su función los administradores o liquidadores, quienes serán sustituidos por la administración concursal." },
  { block: "Mercantil", tema: 6, ref: "Art. 49 LCCh", q: "Artículo 49 de la Ley Cambiaria y del Cheque (acción cambiaria)", a: "El tenedor podrá ejercitar la acción cambiaria contra los endosantes, el librador y las demás personas obligadas, al vencimiento de la letra, si el pago no se ha efectuado." },
  { block: "Mercantil", tema: 7, ref: "Art. 18 Ley 50/1980", q: "Artículo 18 de la Ley de Contrato de Seguro (obligación de indemnizar)", a: "El asegurador está obligado a satisfacer la indemnización al término de las investigaciones y peritaciones necesarias para establecer la existencia del siniestro y, en su caso, el importe de los daños que resulten de las garantías previstas en la póliza." },
  { block: "Mercantil", tema: 8, ref: "Art. 34 Ley de Patentes", q: "Artículo 34 de la Ley de Patentes (derechos conferidos por la patente)", a: "1. La patente confiere a su titular el derecho a impedir a cualquier tercero que no cuente con su consentimiento la fabricación, ofrecimiento, introducción en el comercio o utilización de un producto objeto de la patente o la importación o posesión del mismo para alguno de los fines mencionados." },
];

const ADMINISTRATIVO_3 = [
  { block: "Administrativo", tema: 1, ref: "Art. 35 LPAC", q: "Artículo 35 de la Ley 39/2015 (motivación)", a: "1. Serán motivados, con sucinta referencia de hechos y fundamentos de derecho: a) Los actos que limiten derechos subjetivos o intereses legítimos. b) Los que resuelvan procedimientos de revisión de oficio de actos administrativos, recursos administrativos, y procedimientos de arbitraje. c) Los que se separen del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos." },
  { block: "Administrativo", tema: 2, ref: "Art. 106 LPAC", q: "Artículo 106 de la Ley 39/2015 (revisión de oficio)", a: "1. Las Administraciones Públicas, en cualquier momento, por iniciativa propia o a solicitud de interesado, y previo dictamen favorable del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma, si lo hubiere, declararán de oficio la nulidad de los actos administrativos que hayan puesto fin a la vía administrativa o que no hayan sido recurridos en plazo, en los supuestos previstos en el artículo 47.1." },
  { block: "Administrativo", tema: 3, ref: "Art. 112 LPAC", q: "Artículo 112 de la Ley 39/2015 (objeto y clases de recursos)", a: "1. Contra las resoluciones y los actos de trámite, si estos últimos deciden directa o indirectamente el fondo del asunto, determinan la imposibilidad de continuar el procedimiento, producen indefensión o perjuicio irreparable a derechos e intereses legítimos, podrán interponerse por los interesados los recursos de alzada y potestativo de reposición." },
  { block: "Administrativo", tema: 3, ref: "Art. 125 LPAC", q: "Artículo 125 de la Ley 39/2015 (recurso extraordinario de revisión)", a: "1. Contra los actos firmes en vía administrativa podrá interponerse el recurso extraordinario de revisión ante el órgano administrativo que los dictó, cuando concurra alguna de las circunstancias siguientes: Primera. Que al dictarlos se hubiere incurrido en error de hecho, que resulte de los propios documentos incorporados al expediente. Segunda. Que aparezcan documentos de valor esencial para la resolución del asunto que, aunque sean posteriores, evidencien el error de la resolución recurrida." },
  { block: "Administrativo", tema: 4, ref: "Art. 25.2 LPAC", q: "Artículo 25.2 de la Ley 39/2015 (silencio en procedimientos iniciados de oficio)", a: "En los procedimientos iniciados de oficio, el vencimiento del plazo máximo establecido sin que se haya dictado y notificado resolución expresa no exime a la Administración del cumplimiento de la obligación legal de resolver, produciendo los siguientes efectos: a) En el caso de procedimientos de los que pudiera derivarse el reconocimiento o, en su caso, la constitución de derechos u otras situaciones jurídicas favorables, los interesados que hubieren comparecido podrán entender desestimadas sus pretensiones por silencio administrativo. b) En los procedimientos en que la Administración ejercite potestades sancionadoras o, en general, de intervención, susceptibles de producir efectos desfavorables o de gravamen, se producirá la caducidad." },
  { block: "Administrativo", tema: 5, ref: "Art. 32.5 LRJSP", q: "Artículo 32.5 de la Ley 40/2015 (funcionamiento anormal)", a: "En todo caso, el daño alegado habrá de ser efectivo, evaluable económicamente e individualizado con relación a una persona o grupo de personas. La anulación en vía administrativa o por el orden jurisdiccional contencioso-administrativo de los actos o disposiciones administrativas no presupone, por sí misma, derecho a la indemnización." },
  { block: "Administrativo", tema: 6, ref: "Art. 33 LJCA", q: "Artículo 33 de la Ley 29/1998 (extensión de la jurisdicción)", a: "1. Los órganos del orden jurisdiccional contencioso-administrativo juzgarán dentro del límite de las pretensiones formuladas por las partes y de los motivos que fundamenten el recurso y la oposición." },
  { block: "Administrativo", tema: 6, ref: "Art. 45 LJCA", q: "Artículo 45 de la Ley 29/1998 (iniciación del procedimiento)", a: "1. El recurso contencioso-administrativo se iniciará por un escrito reducido a citar la disposición, acto, inactividad o actuación constitutiva de vía de hecho que se recurra." },
];

const LABORAL_3 = [
  { block: "Laboral", tema: 1, ref: "Art. 3 ET", q: "Artículo 3 del Estatuto de los Trabajadores (fuentes de la relación laboral)", a: "1. Los derechos y obligaciones concernientes a la relación laboral se regulan: a) Por las disposiciones legales y reglamentarias del Estado. b) Por los convenios colectivos. c) Por la voluntad de las partes, manifestada en el contrato de trabajo. d) Por los usos y costumbres locales y profesionales." },
  { block: "Laboral", tema: 2, ref: "Art. 49 ET", q: "Artículo 49 del Estatuto de los Trabajadores (extinción del contrato)", a: "1. El contrato de trabajo se extinguirá: a) Por mutuo acuerdo de las partes. b) Por las causas consignadas válidamente en el contrato. c) Por expiración del tiempo convenido o realización de la obra o servicio objeto del contrato. g) Por muerte, jubilación o incapacidad del empresario. h) Por fuerza mayor. i) Por despido colectivo fundado en causas económicas, técnicas, organizativas o de producción. k) Por despido disciplinario." },
  { block: "Laboral", tema: 2, ref: "Art. 51 ET", q: "Artículo 51 del Estatuto de los Trabajadores (despido colectivo)", a: "1. A efectos de lo dispuesto en la presente Ley se entenderá por despido colectivo la extinción de contratos de trabajo fundada en causas económicas, técnicas, organizativas o de producción, cuando, en un periodo de noventa días, la extinción afecte al menos a: 10 trabajadores en empresas de menos de cien trabajadores; el 10% del número de trabajadores en empresas entre 100 y 300; 30 trabajadores en empresas de 300 o más." },
  { block: "Laboral", tema: 4, ref: "Art. 12 ET", q: "Artículo 12 del Estatuto de los Trabajadores (contrato a tiempo parcial)", a: "1. El contrato de trabajo se entenderá celebrado a tiempo parcial cuando se haya acordado la prestación de servicios durante un número de horas al día, a la semana, al mes o al año inferior a la jornada de trabajo de un trabajador a tiempo completo comparable." },
  { block: "Laboral", tema: 4, ref: "Art. 34 ET", q: "Artículo 34 del Estatuto de los Trabajadores (jornada)", a: "1. La duración de la jornada de trabajo será la pactada en los convenios colectivos o contratos de trabajo. La duración máxima de la jornada ordinaria de trabajo será de cuarenta horas semanales de trabajo efectivo de promedio en cómputo anual." },
  { block: "Laboral", tema: 5, ref: "Art. 1 LRJS", q: "Artículo 1 de la Ley 36/2011 (ámbito de la jurisdicción social)", a: "Los órganos jurisdiccionales del orden social, por medio de los procesos regulados en la presente Ley, conocerán de las pretensiones que se promuevan dentro de la rama social del Derecho, tanto en su vertiente individual como colectiva, incluyendo aquellas que versen sobre materias laborales y de Seguridad Social." },
];

const CONSTITUCIONAL_4 = [
  { block: "Constitucional", tema: 1, ref: "Art. 91 CE", q: "Artículo 91 de la Constitución Española", a: "El Rey sancionará en el plazo de quince días las leyes aprobadas por las Cortes Generales, y las promulgará y ordenará su inmediata publicación." },
  { block: "Constitucional", tema: 1, ref: "Art. 92 CE", q: "Artículo 92 de la Constitución Española (referéndum consultivo)", a: "1. Las decisiones políticas de especial trascendencia podrán ser sometidas a referéndum consultivo de todos los ciudadanos.\n2. El referéndum será convocado por el Rey, mediante propuesta del Presidente del Gobierno, previamente autorizada por el Congreso de los Diputados.\n3. Una ley orgánica regulará las condiciones y el procedimiento de las distintas modalidades de referéndum previstas en esta Constitución." },
  { block: "Constitucional", tema: 2, ref: "Art. 83 CE", q: "Artículo 83 de la Constitución Española (límites de las leyes de bases)", a: "Las leyes de bases no podrán en ningún caso: a) Autorizar la modificación de la propia ley de bases. b) Facultar para dictar normas con carácter retroactivo." },
  { block: "Constitucional", tema: 2, ref: "Art. 84 CE", q: "Artículo 84 de la Constitución Española", a: "Cuando una proposición de ley o una enmienda fuere contraria a una delegación legislativa en vigor, el Gobierno está facultado para oponerse a su tramitación. En tal supuesto, podrá presentarse una proposición de ley para la derogación total o parcial de la ley de delegación." },
  { block: "Constitucional", tema: 2, ref: "Art. 85 CE", q: "Artículo 85 de la Constitución Española", a: "Las disposiciones del Gobierno que contengan legislación delegada recibirán el título de Decretos Legislativos." },
  { block: "Constitucional", tema: 5, ref: "Art. 169 CE", q: "Artículo 169 de la Constitución Española", a: "No podrá iniciarse la reforma constitucional en tiempo de guerra o de vigencia de alguno de los estados previstos en el artículo 116." },
  { block: "Constitucional", tema: 6, ref: "Art. 42 CE", q: "Artículo 42 de la Constitución Española", a: "El Estado velará especialmente por la salvaguardia de los derechos económicos y sociales de los trabajadores españoles en el extranjero, y orientará su política hacia su retorno." },
  { block: "Constitucional", tema: 6, ref: "Art. 53.3 CE", q: "Artículo 53.3 de la Constitución Española (principios rectores)", a: "El reconocimiento, el respeto y la protección de los principios reconocidos en el Capítulo Tercero informarán la legislación positiva, la práctica judicial y la actuación de los poderes públicos. Sólo podrán ser alegados ante la Jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen." },
  { block: "Constitucional", tema: 7, ref: "Art. 121 CE", q: "Artículo 121 de la Constitución Española (errores judiciales)", a: "Los daños causados por error judicial, así como los que sean consecuencia del funcionamiento anormal de la Administración de Justicia, darán derecho a una indemnización a cargo del Estado, conforme a la ley." },
  { block: "Constitucional", tema: 9, ref: "Art. 162 CE", q: "Artículo 162 de la Constitución Española (legitimación)", a: "1. Están legitimados: a) Para interponer el recurso de inconstitucionalidad, el Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores, los órganos colegiados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas. b) Para interponer el recurso de amparo, toda persona natural o jurídica que invoque un interés legítimo, así como el Defensor del Pueblo y el Ministerio Fiscal." },
  { block: "Constitucional", tema: 10, ref: "Art. 163 CE", q: "Artículo 163 de la Constitución Española (cuestión de inconstitucionalidad)", a: "Cuando un órgano judicial considere, en algún proceso, que una norma con rango de ley, aplicable al caso, de cuya validez dependa el fallo, pueda ser contraria a la Constitución, planteará la cuestión ante el Tribunal Constitucional en los supuestos, en la forma y con los efectos que establezca la ley, que en ningún caso serán suspensivos." },
  { block: "Constitucional", tema: 11, ref: "Art. 164 CE", q: "Artículo 164 de la Constitución Española (efectos de las sentencias del TC)", a: "1. Las sentencias del Tribunal Constitucional se publicarán en el Boletín Oficial del Estado con los votos particulares, si los hubiere. Tienen el valor de cosa juzgada a partir del día siguiente de su publicación y no cabe recurso alguno contra ellas.\n2. Salvo que en el fallo se disponga otra cosa, subsistirá la vigencia de la ley en la parte no afectada por la inconstitucionalidad." },
  { block: "Constitucional", tema: 13, ref: "Art. 128 CE", q: "Artículo 128 de la Constitución Española", a: "1. Toda la riqueza del país en sus distintas formas y sea cual fuere su titularidad está subordinada al interés general.\n2. Se reconoce la iniciativa pública en la actividad económica. Mediante ley se podrá reservar al sector público recursos o servicios esenciales, especialmente en caso de monopolio." },
  { block: "Constitucional", tema: 13, ref: "Art. 131 CE", q: "Artículo 131 de la Constitución Española (planificación económica)", a: "1. El Estado, mediante ley, podrá planificar la actividad económica general para atender a las necesidades colectivas, equilibrar y armonizar el desarrollo regional y sectorial y estimular el crecimiento de la renta y de la riqueza y su más justa distribución." },
  { block: "Constitucional", tema: 13, ref: "Art. 134 CE", q: "Artículo 134 de la Constitución Española (Presupuestos Generales del Estado)", a: "1. Corresponde al Gobierno la elaboración de los Presupuestos Generales del Estado y a las Cortes Generales su examen, enmienda y aprobación.\n2. Los Presupuestos Generales del Estado tendrán carácter anual, incluirán la totalidad de los gastos e ingresos del sector público estatal y en ellos se consignará el importe de los beneficios fiscales que afecten a los tributos del Estado.\n3. El Gobierno deberá presentar ante el Congreso de los Diputados los Presupuestos Generales del Estado al menos tres meses antes de la expiración de los del año anterior." },
  { block: "Constitucional", tema: 14, ref: "Art. 58 CE", q: "Artículo 58 de la Constitución Española", a: "La Reina consorte o el consorte de la Reina no podrán asumir funciones constitucionales, salvo lo dispuesto para la Regencia." },
  { block: "Constitucional", tema: 14, ref: "Art. 59 CE", q: "Artículo 59 de la Constitución Española (Regencia)", a: "1. Cuando el Rey fuere menor de edad, el padre o la madre del Rey y, en su defecto, el pariente mayor de edad más próximo a suceder en la Corona, según el orden establecido en la Constitución, entrará a ejercer inmediatamente la Regencia y la ejercerá durante el tiempo de la minoría de edad del Rey." },
  { block: "Constitucional", tema: 14, ref: "Art. 65 CE", q: "Artículo 65 de la Constitución Española", a: "1. El Rey recibe de los Presupuestos del Estado una cantidad global para el sostenimiento de su Familia y Casa, y distribuye libremente la misma.\n2. El Rey nombra y releva libremente a los miembros civiles y militares de su Casa." },
  { block: "Constitucional", tema: 15, ref: "Art. 70 CE", q: "Artículo 70 de la Constitución Española (causas de inelegibilidad e incompatibilidad)", a: "1. La ley electoral determinará las causas de inelegibilidad e incompatibilidad de los Diputados y Senadores, que comprenderán, en todo caso: a) A los componentes del Tribunal Constitucional. b) A los altos cargos de la Administración del Estado que determine la ley. c) Al Defensor del Pueblo. d) A los Magistrados, Jueces y Fiscales en activo. e) A los militares profesionales y miembros de las Fuerzas y Cuerpos de Seguridad y Policía en activo. f) A los miembros de las Juntas Electorales." },
  { block: "Constitucional", tema: 15, ref: "Art. 72 CE", q: "Artículo 72 de la Constitución Española", a: "1. Las Cámaras establecen sus propios Reglamentos, aprueban autónomamente sus presupuestos y, de común acuerdo, regulan el Estatuto del Personal de las Cortes Generales.\n2. Las Cámaras eligen sus respectivos Presidentes y los demás miembros de sus Mesas." },
  { block: "Constitucional", tema: 15, ref: "Art. 75 CE", q: "Artículo 75 de la Constitución Española (Comisiones)", a: "1. Las Cámaras funcionarán en Pleno y por Comisiones.\n2. Las Cámaras podrán delegar en las Comisiones Legislativas Permanentes la aprobación de proyectos o proposiciones de ley. El Pleno podrá, no obstante, recabar en cualquier momento el debate y votación de cualquier proyecto o proposición de ley que haya sido objeto de esta delegación." },
  { block: "Constitucional", tema: 15, ref: "Art. 78 CE", q: "Artículo 78 de la Constitución Española (Diputación Permanente)", a: "1. En cada Cámara habrá una Diputación Permanente compuesta por un mínimo de veintiún miembros, que representarán a los grupos parlamentarios, en proporción a su importancia numérica.\n2. Las Diputaciones Permanentes tendrán por función velar sobre los poderes de las Cámaras, conforme al artículo 73, cuando éstas no estén reunidas." },
  { block: "Constitucional", tema: 15, ref: "Art. 79 CE", q: "Artículo 79 de la Constitución Española (quórum)", a: "1. Para adoptar acuerdos, las Cámaras deben estar reunidas reglamentariamente y con asistencia de la mayoría de sus miembros.\n2. Dichos acuerdos, para ser válidos, deberán ser aprobados por la mayoría de los miembros presentes, sin perjuicio de las mayorías especiales que establezcan la Constitución o las leyes orgánicas y las que para elección de personas establezcan los Reglamentos de las Cámaras." },
  { block: "Constitucional", tema: 16, ref: "Art. 100 CE", q: "Artículo 100 de la Constitución Española", a: "Los demás miembros del Gobierno serán nombrados y separados por el Rey, a propuesta de su Presidente." },
  { block: "Constitucional", tema: 16, ref: "Art. 101 CE", q: "Artículo 101 de la Constitución Española (cese del Gobierno)", a: "1. El Gobierno cesa tras la celebración de elecciones generales, en los casos de pérdida de la confianza parlamentaria previstos en la Constitución, o por dimisión o fallecimiento de su Presidente.\n2. El Gobierno cesante continuará en funciones hasta la toma de posesión del nuevo Gobierno." },
  { block: "Constitucional", tema: 16, ref: "Art. 102 CE", q: "Artículo 102 de la Constitución Española (responsabilidad penal del Presidente y Ministros)", a: "1. La responsabilidad criminal del Presidente y los demás miembros del Gobierno será exigible, en su caso, ante la Sala de lo Penal del Tribunal Supremo.\n2. Si la acusación fuere por traición o por cualquier delito contra la seguridad del Estado en el ejercicio de sus funciones, sólo podrá ser planteada por iniciativa de la cuarta parte de los miembros del Congreso, y con la aprobación de la mayoría absoluta del mismo." },
  { block: "Constitucional", tema: 17, ref: "Art. 114 CE", q: "Artículo 114 de la Constitución Española", a: "1. Si el Congreso niega su confianza al Gobierno, éste presentará su dimisión al Rey, procediéndose a continuación a la designación de Presidente del Gobierno.\n2. Si el Congreso adopta una moción de censura, el Gobierno presentará su dimisión al Rey y el candidato incluido en aquélla se entenderá investido de la confianza de la Cámara." },
  { block: "Constitucional", tema: 19, ref: "Art. 123 CE", q: "Artículo 123 de la Constitución Española (Tribunal Supremo)", a: "1. El Tribunal Supremo, con jurisdicción en toda España, es el órgano jurisdiccional superior en todos los órdenes, salvo lo dispuesto en materia de garantías constitucionales.\n2. El Presidente del Tribunal Supremo será nombrado por el Rey, a propuesta del Consejo General del Poder Judicial, en la forma que determine la ley." },
  { block: "Constitucional", tema: 19, ref: "Art. 126 CE", q: "Artículo 126 de la Constitución Española", a: "La policía judicial depende de los Jueces, de los Tribunales y del Ministerio Fiscal en sus funciones de averiguación del delito y descubrimiento y aseguramiento del delincuente, en los términos que la ley establezca." },
];
const CONSTITUCIONAL_4B = [
  { block: "Constitucional", tema: 19, ref: "Art. 127 CE", q: "Artículo 127 de la Constitución Española (incompatibilidades judiciales)", a: "1. Los Jueces y Magistrados, así como los Fiscales, mientras se hallen en activo, no podrán desempeñar otros cargos públicos, ni pertenecer a partidos políticos o sindicatos. La ley establecerá el sistema y modalidades de asociación profesional de los Jueces, Magistrados y Fiscales.\n2. La ley establecerá el régimen de incompatibilidades de los miembros del poder judicial, que deberá asegurar la total independencia de los mismos." },
  { block: "Constitucional", tema: 20, ref: "Art. 139 CE", q: "Artículo 139 de la Constitución Española", a: "1. Todos los españoles tienen los mismos derechos y obligaciones en cualquier parte del territorio del Estado.\n2. Ninguna autoridad podrá adoptar medidas que directa o indirectamente obstaculicen la libertad de circulación y establecimiento de las personas y la libre circulación de bienes en todo el territorio español." },
  { block: "Constitucional", tema: 20, ref: "Art. 142 CE", q: "Artículo 142 de la Constitución Española (haciendas locales)", a: "Las Haciendas locales deberán disponer de los medios suficientes para el desempeño de las funciones que la ley atribuye a las Corporaciones respectivas y se nutrirán fundamentalmente de tributos propios y de participación en los del Estado y de las Comunidades Autónomas." },
  { block: "Constitucional", tema: 21, ref: "Art. 143 CE", q: "Artículo 143 de la Constitución Española (vía ordinaria de acceso a la autonomía)", a: "1. En el ejercicio del derecho a la autonomía reconocido en el artículo 2 de la Constitución, las provincias limítrofes con características históricas, culturales y económicas comunes, los territorios insulares y las provincias con entidad regional histórica podrán acceder a su autogobierno y constituirse en Comunidades Autónomas." },
  { block: "Constitucional", tema: 21, ref: "Art. 144 CE", q: "Artículo 144 de la Constitución Española", a: "Las Cortes Generales, mediante ley orgánica, podrán, por motivos de interés nacional: a) Autorizar la constitución de una Comunidad Autónoma cuando su ámbito territorial no supere el de una provincia. b) Autorizar o acordar, en su caso, un Estatuto de autonomía para territorios que no estén integrados en la organización provincial." },
  { block: "Constitucional", tema: 21, ref: "Art. 146 CE", q: "Artículo 146 de la Constitución Española (proyecto de Estatuto)", a: "El proyecto de Estatuto será elaborado por una asamblea compuesta por los miembros de la Diputación u órgano interinsular de las provincias afectadas y por los Diputados y Senadores elegidos en ellas y será elevado a las Cortes Generales para su tramitación como ley." },
  { block: "Constitucional", tema: 22, ref: "Art. 150 CE", q: "Artículo 150 de la Constitución Española (leyes marco y de transferencia)", a: "1. Las Cortes Generales, en materias de competencia estatal, podrán atribuir a todas o a alguna de las Comunidades Autónomas la facultad de dictar, para sí mismas, normas legislativas en el marco de los principios, bases y directrices fijados por una ley estatal.\n2. El Estado podrá transferir o delegar en las Comunidades Autónomas, mediante ley orgánica, facultades correspondientes a materia de titularidad estatal que por su propia naturaleza sean susceptibles de transferencia o delegación." },
  { block: "Constitucional", tema: 22, ref: "Art. 152 CE", q: "Artículo 152 de la Constitución Española (organización institucional)", a: "1. En los Estatutos aprobados por el procedimiento a que se refiere el artículo anterior, la organización institucional autonómica se basará en una Asamblea Legislativa, elegida por sufragio universal, con arreglo a un sistema de representación proporcional; un Consejo de Gobierno con funciones ejecutivas y administrativas y un Presidente, elegido por la Asamblea, de entre sus miembros." },
  { block: "Constitucional", tema: 23, ref: "Art. 156 CE", q: "Artículo 156 de la Constitución Española (autonomía financiera)", a: "1. Las Comunidades Autónomas gozarán de autonomía financiera para el desarrollo y ejecución de sus competencias con arreglo a los principios de coordinación con la Hacienda estatal y de solidaridad entre todos los españoles." },
  { block: "Constitucional", tema: 23, ref: "Art. 157 CE", q: "Artículo 157 de la Constitución Española (recursos de las CCAA)", a: "1. Los recursos de las Comunidades Autónomas estarán constituidos por: a) Impuestos cedidos total o parcialmente por el Estado. b) Sus propios impuestos, tasas y contribuciones especiales. c) Transferencias de un Fondo de Compensación Interterritorial. d) Rendimientos procedentes de su patrimonio e ingresos de derecho privado. e) El producto de las operaciones de crédito." },
  { block: "Constitucional", tema: 23, ref: "Art. 158 CE", q: "Artículo 158 de la Constitución Española (Fondo de Compensación)", a: "1. En los Presupuestos Generales del Estado podrá establecerse una asignación a las Comunidades Autónomas en función del volumen de los servicios y actividades estatales que hayan asumido y de la garantía de un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio español.\n2. Con el fin de corregir desequilibrios económicos interterritoriales y hacer efectivo el principio de solidaridad, se constituirá un Fondo de Compensación con destino a gastos de inversión." },
  { block: "Constitucional", tema: 24, ref: "Art. 153 CE", q: "Artículo 153 de la Constitución Española (control de las CCAA)", a: "El control de la actividad de los órganos de las Comunidades Autónomas se ejercerá: a) Por el Tribunal Constitucional, el relativo a la constitucionalidad de sus disposiciones normativas con fuerza de ley. b) Por el Gobierno, previo dictamen del Consejo de Estado, el del ejercicio de funciones delegadas. c) Por la jurisdicción contencioso-administrativa, el de la administración autónoma y sus normas reglamentarias. d) Por el Tribunal de Cuentas, el económico y presupuestario." },
  { block: "Constitucional", tema: 24, ref: "Art. 154 CE", q: "Artículo 154 de la Constitución Española (Delegado del Gobierno)", a: "Un Delegado nombrado por el Gobierno dirigirá la Administración del Estado en el territorio de la Comunidad Autónoma y la coordinará, cuando proceda, con la administración propia de la Comunidad." },
  { block: "Constitucional", tema: 28, ref: "Art. 63 CE", q: "Artículo 63 de la Constitución Española (relaciones internacionales del Rey)", a: "1. El Rey acredita a los embajadores y otros representantes diplomáticos. Los representantes extranjeros en España están acreditados ante él.\n2. Al Rey corresponde manifestar el consentimiento del Estado para obligarse internacionalmente por medio de tratados, de conformidad con la Constitución y las leyes.\n3. Al Rey corresponde, previa autorización de las Cortes Generales, declarar la guerra y hacer la paz." },
  { block: "Constitucional", tema: 6, ref: "Art. 13 CE", q: "Artículo 13 de la Constitución Española (extranjeros)", a: "1. Los extranjeros gozarán en España de las libertades públicas que garantiza el presente Título en los términos que establezcan los tratados y la ley.\n2. Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23, salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o por ley para el derecho de sufragio activo y pasivo en las elecciones municipales.\n4. La ley establecerá los términos en que los ciudadanos de otros países y los apátridas podrán gozar del derecho de asilo en España." },
  { block: "Constitucional", tema: 6, ref: "Art. 11 CE", q: "Artículo 11 de la Constitución Española (nacionalidad)", a: "1. La nacionalidad española se adquiere, se conserva y se pierde de acuerdo con lo establecido por la ley.\n2. Ningún español de origen podrá ser privado de su nacionalidad.\n3. El Estado podrá concertar tratados de doble nacionalidad con los países iberoamericanos o con aquellos que hayan tenido o tengan una particular vinculación con España." },
];
const CIVIL_4A = [
  { block: "Civil", tema: 1, ref: "Art. 8 CC", q: "Artículo 8 del Código Civil (eficacia territorial de las leyes)", a: "Las leyes penales, las de policía y las de seguridad pública obligan a todos los que se hallen en territorio español." },
  { block: "Civil", tema: 1, ref: "Art. 9 CC", q: "Artículo 9 del Código Civil (ley personal)", a: "1. La ley personal correspondiente a las personas físicas es la determinada por su nacionalidad. Dicha ley regirá la capacidad y el estado civil, los derechos y deberes de familia y la sucesión por causa de muerte.\n2. Los efectos del matrimonio se regirán por la ley personal común de los cónyuges al tiempo de contraerlo." },
  { block: "Civil", tema: 1, ref: "Art. 10 CC", q: "Artículo 10 del Código Civil (ley aplicable a bienes y obligaciones)", a: "1. La posesión, la propiedad y los demás derechos sobre bienes inmuebles, así como su publicidad, se regirán por la ley del lugar donde se hallen.\n5. Se aplicará a las obligaciones contractuales la ley a que las partes se hayan sometido expresamente." },
  { block: "Civil", tema: 2, ref: "Art. 3.2 CC", q: "Artículo 3.2 del Código Civil (equidad)", a: "La equidad habrá de ponderarse en la aplicación de las normas, si bien las resoluciones de los Tribunales sólo podrán descansar de manera exclusiva en ella cuando la ley expresamente lo permita." },
  { block: "Civil", tema: 3, ref: "Art. 31 CC", q: "Artículo 31 del Código Civil (nacimiento múltiple)", a: "En los casos de nacimiento de más de un hijo, la prioridad del primer nacido determina, en igualdad de aptitudes, los derechos que a éste correspondan por tal prioridad." },
  { block: "Civil", tema: 3, ref: "Art. 33 CC", q: "Artículo 33 del Código Civil (conmoriencia)", a: "Si se duda, entre dos o más personas llamadas a sucederse, quién de ellas ha muerto primero, el que sostenga la muerte anterior de una o de otra, debe probarla; a falta de prueba, se presumen muertas al mismo tiempo y no tiene lugar la transmisión de derechos de uno a otro." },
  { block: "Civil", tema: 3, ref: "Art. 35 CC", q: "Artículo 35 del Código Civil (personas jurídicas)", a: "Son personas jurídicas: 1.º Las corporaciones, asociaciones y fundaciones de interés público reconocidas por la ley. Su personalidad empieza desde el instante mismo en que, con arreglo a derecho, hubiesen quedado válidamente constituidas. 2.º Las asociaciones de interés particular, sean civiles, mercantiles o industriales, a las que la ley conceda personalidad propia, independiente de la de cada uno de los asociados." },
  { block: "Civil", tema: 3, ref: "Art. 38 CC", q: "Artículo 38 del Código Civil (capacidad de las personas jurídicas)", a: "Las personas jurídicas pueden adquirir y poseer bienes de todas clases, así como contraer obligaciones y ejercitar acciones civiles o criminales, conforme a las leyes y reglas de su constitución. La Iglesia se regirá en este punto por lo concordado entre ambas potestades, y los establecimientos de instrucción y beneficencia por lo que dispongan las leyes especiales." },
  { block: "Civil", tema: 4, ref: "Art. 320 CC", q: "Artículo 320 del Código Civil (dispensa de edad por matrimonio)", a: "Se produce el mismo efecto de la mayor edad, en cuanto a regir su persona, por el matrimonio del menor." },
  { block: "Civil", tema: 4, ref: "Art. 322 CC", q: "Artículo 322 del Código Civil (capacidad del mayor de edad)", a: "El mayor de edad es capaz para todos los actos de la vida civil, salvo las excepciones establecidas en casos especiales por este Código." },
  { block: "Civil", tema: 5, ref: "Art. 182 CC", q: "Artículo 182 del Código Civil (representación del ausente)", a: "En el nombramiento de representante del declarado ausente, se guardará el orden siguiente: 1.º El cónyuge presente mayor de edad no separado legalmente o de hecho. 2.º El hijo mayor de edad. 3.º El ascendiente más próximo de menos edad. 4.º Los hermanos mayores de edad." },
  { block: "Civil", tema: 5, ref: "Art. 191 CC", q: "Artículo 191 del Código Civil (cese de la ausencia legal)", a: "La declaración de ausencia legal cesa por alguna de las siguientes causas: 1.ª Por la presentación del ausente, sea personalmente, sea por medio de apoderado legítimo. 2.ª Por la noticia de su muerte, comprobada suficientemente. 3.ª Por certeza de su existencia. 4.ª Por la declaración de fallecimiento." },
  { block: "Civil", tema: 6, ref: "Art. 51 CC", q: "Artículo 51 del Código Civil (competencia para celebrar el matrimonio)", a: "Será competente para autorizar el matrimonio: 1.º El Juez encargado del Registro Civil y el Secretario judicial o funcionario que ejerza sus funciones del domicilio de cualquiera de los contrayentes. 2.º El Alcalde del municipio donde se celebre el matrimonio o Concejal en quien delegue. 3.º El Notario libremente elegido por ambos contrayentes." },
  { block: "Civil", tema: 6, ref: "Art. 65 CC", q: "Artículo 65 del Código Civil (inscripción del matrimonio)", a: "La inscripción del matrimonio celebrado en España se practicará en el Registro Civil del lugar en que se celebre, en la forma establecida en la Ley del Registro Civil." },
  { block: "Civil", tema: 7, ref: "Art. 91 CC", q: "Artículo 91 del Código Civil (medidas judiciales sobre hijos y cargas)", a: "En las sentencias de nulidad, separación o divorcio, o en ejecución de las mismas, el Juez, en defecto de acuerdo de los cónyuges o en caso de no aprobación del mismo, determinará conforme a lo establecido en los artículos siguientes las medidas que hayan de sustituir a las ya adoptadas con anterioridad en relación con los hijos, la vivienda familiar, las cargas del matrimonio, liquidación del régimen económico y las cautelas o garantías respectivas." },
  { block: "Civil", tema: 7, ref: "Art. 96 CC", q: "Artículo 96 del Código Civil (atribución de la vivienda familiar)", a: "En defecto de acuerdo de los cónyuges aprobado por el Juez, el uso de la vivienda familiar y de los objetos de uso ordinario en ella corresponde a los hijos y al cónyuge en cuya compañía queden." },
  { block: "Civil", tema: 8, ref: "Art. 157 CC", q: "Artículo 157 del Código Civil (patria potestad del menor emancipado)", a: "El menor no emancipado ejercerá sus derechos de la personalidad de acuerdo con su grado de madurez y, en el ejercicio de la patria potestad, sus progenitores intervendrán en función de dicho grado de madurez del menor." },
  { block: "Civil", tema: 8, ref: "Art. 158 CC", q: "Artículo 158 del Código Civil (medidas de protección)", a: "El Juez, de oficio o a instancia del propio hijo, de cualquier pariente o del Ministerio Fiscal, dictará: 1.º Las medidas convenientes para asegurar la prestación de alimentos y proveer a las futuras necesidades del hijo, en caso de incumplimiento de este deber. 3.º Las medidas necesarias para evitar sustracción de menores por alguno de los progenitores o terceras personas." },
  { block: "Civil", tema: 8, ref: "Art. 172 CC", q: "Artículo 172 del Código Civil (guarda y acogimiento de menores)", a: "1. Cuando la entidad pública competente en materia de protección de menores constate que un menor se encuentra en situación de desamparo, tiene por ministerio de la ley la tutela del mismo, y deberá adoptar las medidas de protección necesarias, dando cuenta a la autoridad judicial." },
  { block: "Civil", tema: 9, ref: "Art. 236 CC", q: "Artículo 236 del Código Civil (funciones tuitivas)", a: "Estas medidas de apoyo deberán favorecer que la propia persona con discapacidad pueda desarrollar su propio proceso de toma de decisiones, informándole, ayudándole en su comprensión y razonamiento y facilitando que pueda expresar sus preferencias." },
  { block: "Civil", tema: 9, ref: "Art. 269 CC", q: "Artículo 269 del Código Civil (guarda de hecho)", a: "Quien viniere ejerciendo adecuadamente la guarda de hecho de una persona mayor de edad o menor emancipada en la que concurra causa de curatela, continuará en el ejercicio de dicha guarda, aun si existe una sentencia de provisión de apoyos." },
  { block: "Civil", tema: 10, ref: "Art. 350 CC", q: "Artículo 350 del Código Civil (subsuelo y sobrevuelo)", a: "El propietario de un terreno es dueño de su superficie y de lo que está debajo de ella, y puede hacer en él las obras, plantaciones y excavaciones que le convengan, salvas las servidumbres, y con sujeción a lo dispuesto en las leyes sobre Minas y Aguas, en los reglamentos de policía y en las demás leyes especiales." },
  { block: "Civil", tema: 10, ref: "Art. 609 CC", q: "Artículo 609 del Código Civil (modos de adquirir la propiedad)", a: "La propiedad se adquiere por la ocupación. La propiedad y los demás derechos sobre los bienes se adquieren y transmiten por la ley, por donación, por sucesión testada e intestada, y por consecuencia de ciertos contratos mediante la tradición. Pueden también adquirirse por medio de la prescripción." },
  { block: "Civil", tema: 11, ref: "Art. 438 CC", q: "Artículo 438 del Código Civil (adquisición de la posesión)", a: "La posesión se adquiere por la ocupación material de la cosa o derecho poseído, o por el hecho de quedar éstos sujetos a la acción de nuestra voluntad, o por los actos propios y formalidades legales establecidos para adquirir tal derecho." },
  { block: "Civil", tema: 11, ref: "Art. 460 CC", q: "Artículo 460 del Código Civil (pérdida de la posesión)", a: "El poseedor puede perder su posesión: 1.º Por abandono de la cosa. 2.º Por cesión hecha a otro por título oneroso o gratuito. 3.º Por destrucción o pérdida total de la cosa, o por quedar ésta fuera del comercio. 4.º Por la posesión de otro, aun contra la voluntad del antiguo poseedor, si la nueva posesión hubiese durado más de un año." },
  { block: "Civil", tema: 12, ref: "Art. 1941 CC", q: "Artículo 1941 del Código Civil (posesión hábil para prescribir)", a: "La posesión ha de ser en concepto de dueño, pública, pacífica y no interrumpida." },
  { block: "Civil", tema: 12, ref: "Art. 1963 CC", q: "Artículo 1963 del Código Civil (prescripción de acciones reales sobre bienes muebles)", a: "Las acciones reales sobre bienes muebles prescriben a los seis años de perdida la posesión, salvo que el poseedor haya ganado por menos término el dominio, conforme al artículo 1955, y salvo los casos de extravío y venta pública, y los de hurto o robo." },
  { block: "Civil", tema: 13, ref: "Art. 468 CC", q: "Artículo 468 del Código Civil (constitución del usufructo, contenido)", a: "El usufructo se constituye por ley, por voluntad de los particulares expresada en actos entre vivos o en última voluntad, y por prescripción." },
  { block: "Civil", tema: 13, ref: "Art. 561 CC", q: "Artículo 561 del Código Civil (servidumbres legales)", a: "El propietario de una finca o heredad, rodeada por otras ajenas y sin salida a camino público, tiene derecho a exigir paso por las heredades vecinas, previa la correspondiente indemnización." },
  { block: "Civil", tema: 14, ref: "Art. 1863 CC", q: "Artículo 1863 del Código Civil (segunda hipoteca)", a: "El deudor puede pagar la deuda antes de haber sido requerido para el pago, y aun antes de vencer el plazo, si no fuere en perjuicio del acreedor. Un mismo bien puede ser gravado con dos o más hipotecas." },
  { block: "Civil", tema: 14, ref: "Art. 1880 CC", q: "Artículo 1880 del Código Civil (registro de la hipoteca)", a: "Sólo producirán efecto contra tercero las hipotecas de naves inscritas en el Registro Mercantil, en el cual deberá tomarse razón el mismo día de todas las hipotecas que se otorguen." },
  { block: "Civil", tema: 15, ref: "Art. 1255 CC", q: "Artículo 1255 del Código Civil (libertad contractual)", a: "Los contratantes pueden establecer los pactos, cláusulas y condiciones que tengan por conveniente, siempre que no sean contrarios a las leyes, a la moral, ni al orden público." },
  { block: "Civil", tema: 15, ref: "Art. 1278 CC", q: "Artículo 1278 del Código Civil (libertad de forma)", a: "Los contratos serán obligatorios, cualquiera que sea la forma en que se hayan celebrado, siempre que en ellos concurran las condiciones esenciales para su validez." },
  { block: "Civil", tema: 16, ref: "Art. 1270 CC", q: "Artículo 1270 del Código Civil (dolo incidental)", a: "Para que el dolo produzca la nulidad de los contratos, deberá ser grave y no haber sido empleado por las dos partes contratantes. El dolo incidental sólo obliga al que lo empleó a indemnizar daños y perjuicios." },
  { block: "Civil", tema: 17, ref: "Art. 1302 CC", q: "Artículo 1302 del Código Civil (legitimación para pedir la nulidad)", a: "Pueden ejercitar la acción de nulidad de los contratos los obligados principal o subsidiariamente en virtud de ellos. Las personas capaces no podrán, sin embargo, alegar la incapacidad de aquellos con quienes contrataron." },
  { block: "Civil", tema: 18, ref: "Art. 1125 CC", q: "Artículo 1125 del Código Civil (obligaciones condicionales)", a: "Las obligaciones para cuyo cumplimiento se hubiese señalado un día cierto, sólo serán exigibles cuando el día llegue. Entiéndese por día cierto aquel que necesariamente ha de venir, aunque se ignore cuándo." },
  { block: "Civil", tema: 19, ref: "Art. 1454 CC", q: "Artículo 1454 del Código Civil (arras)", a: "Si hubiesen mediado arras o señal en el contrato de compra y venta, podrá rescindirse el contrato allanándose el comprador a perderlas, o el vendedor a devolverlas duplicadas." },
  { block: "Civil", tema: 19, ref: "Art. 1502 CC", q: "Artículo 1502 del Código Civil (suspensión del pago del precio)", a: "Si el comprador fuere perturbado en la posesión o dominio de la cosa adquirida, o tuviere fundado temor de serlo por una acción reivindicatoria o hipotecaria, podrá suspender el pago del precio hasta que el vendedor haya hecho cesar la perturbación o el peligro." },
  { block: "Civil", tema: 20, ref: "Art. 1569 CC", q: "Artículo 1569 del Código Civil (extinción del arrendamiento por venta de la cosa)", a: "El comprador de una finca arrendada tiene derecho a que termine el arriendo vigente al verificarse la venta, a menos que el mismo aparezca inscrito en el Registro con anterioridad a la venta." },
  { block: "Civil", tema: 21, ref: "Art. 673 CC", q: "Artículo 673 del Código Civil (revocación del testamento)", a: "El testamento anterior queda revocado de derecho por el otorgamiento de testamento posterior perfecto, si el testador no expresa en éste su voluntad de que aquél subsista en todo o en parte." },
  { block: "Civil", tema: 21, ref: "Art. 685 CC", q: "Artículo 685 del Código Civil (testamento abierto)", a: "El testamento abierto deberá ser otorgado ante Notario hábil para actuar en el lugar del otorgamiento." },
  { block: "Civil", tema: 22, ref: "Art. 813 CC", q: "Artículo 813 del Código Civil (protección de la legítima)", a: "El testador no podrá privar a los herederos de su legítima sino en los casos expresamente determinados por la ley. Tampoco podrá imponer sobre ella gravamen, ni condición, ni sustitución de ninguna especie, salvo lo dispuesto en cuanto al usufructo del viudo y lo establecido en el artículo 808 respecto de los hijos o descendientes judicialmente incapacitados." },
  { block: "Civil", tema: 22, ref: "Art. 815 CC", q: "Artículo 815 del Código Civil (complemento de la legítima)", a: "El heredero forzoso a quien el testador haya dejado por cualquier título menos de la legítima que le corresponda, podrá pedir el complemento de la misma." },
  { block: "Civil", tema: 23, ref: "Art. 921 CC", q: "Artículo 921 del Código Civil (proximidad de grado)", a: "En cada línea la división se hace por cabezas, salvo el derecho de representación en los casos en que deba tener lugar." },
  { block: "Civil", tema: 23, ref: "Art. 944 CC", q: "Artículo 944 del Código Civil (sucesión del cónyuge)", a: "En defecto de ascendientes y descendientes, y antes que los colaterales, sucederá al cónyuge fallecido el que sobreviva, si no estuviere separado por sentencia firme, o de hecho." },
  { block: "Civil", tema: 24, ref: "Art. 1905 CC", q: "Artículo 1905 del Código Civil (responsabilidad por animales)", a: "El poseedor de un animal, o el que se sirve de él, es responsable de los perjuicios que causare, aunque se le escape o extravíe. Sólo cesará esta responsabilidad en el caso de que el daño proviniera de fuerza mayor o de culpa del que lo hubiese sufrido." },
  { block: "Civil", tema: 25, ref: "Art. 1128 CC", q: "Artículo 1128 del Código Civil (fijación judicial de plazo)", a: "Si la obligación no señalare plazo, pero de su naturaleza y circunstancias se dedujere que ha querido concederse al deudor, los Tribunales fijarán la duración de aquél. También fijarán los Tribunales la duración del plazo cuando éste haya quedado a voluntad del deudor." },
  { block: "Civil", tema: 26, ref: "Art. 1145 CC", q: "Artículo 1145 del Código Civil (efectos internos entre codeudores solidarios)", a: "El pago hecho por uno de los deudores solidarios extingue la obligación. El que hizo el pago sólo puede reclamar de sus codeudores la parte que a cada uno corresponda, con los intereses del anticipo." },
];
const CIVIL_4B = [
  { block: "Civil", tema: 15, ref: "Art. 1279 CC", q: "Artículo 1279 del Código Civil (elevación a escritura pública)", a: "Si la ley exigiere el otorgamiento de escritura u otra forma especial para hacer efectivas las obligaciones propias de un contrato, los contratantes podrán compelerse recíprocamente a llenar aquella forma desde que hubiese intervenido el consentimiento y demás requisitos necesarios para su validez." },
  { block: "Civil", tema: 16, ref: "Art. 1268 CC", q: "Artículo 1268 del Código Civil (violencia o intimidación de un tercero)", a: "La violencia o intimidación anularán la obligación, aunque se hayan empleado por un tercero que no intervenga en el contrato." },
  { block: "Civil", tema: 18, ref: "Art. 1129 CC", q: "Artículo 1129 del Código Civil (pérdida del beneficio del plazo)", a: "Perderá el deudor todo derecho a utilizar el plazo: 1.º Cuando, después de contraída la obligación, resulte insolvente, salvo que garantice la deuda. 2.º Cuando no otorgue al acreedor las garantías a que estuviese comprometido. 3.º Cuando por actos propios hubiese disminuido aquellas garantías después de establecidas, y cuando por caso fortuito desaparecieran, a menos que sean inmediatamente sustituidas por otras nuevas e igualmente seguras." },
  { block: "Civil", tema: 19, ref: "Art. 1465 CC", q: "Artículo 1465 del Código Civil (gastos de entrega)", a: "Los gastos para la entrega de la cosa vendida serán de cuenta del vendedor, y los de su transporte o traslación de cargo del comprador, salvo el caso de estipulación especial." },
  { block: "Civil", tema: 19, ref: "Art. 1469 CC", q: "Artículo 1469 del Código Civil (venta a cuerpo cierto o por medida)", a: "La venta de bienes inmuebles hecha con expresión de su cabida, a razón de un precio por unidad de medida o número, tendrá lugar la obligación de estar y responder de todo lo que exprese la cabida." },
  { block: "Civil", tema: 20, ref: "Art. 1555 CC", q: "Artículo 1555 del Código Civil (obligaciones del arrendatario)", a: "El arrendatario está obligado: 1.º A pagar el precio del arriendo en los términos convenidos. 2.º A usar de la cosa arrendada como un diligente padre de familia, destinándola al uso pactado. 3.º A pagar los gastos que ocasione la escritura del contrato." },
  { block: "Civil", tema: 21, ref: "Art. 694 CC", q: "Artículo 694 del Código Civil (custodia del testamento ológrafo)", a: "El testamento ológrafo deberá presentarse ante el Notario para su protocolización, dentro de los diez años contados desde el día del fallecimiento del testador." },
  { block: "Civil", tema: 22, ref: "Art. 819 CC", q: "Artículo 819 del Código Civil (imputación de donaciones a la legítima)", a: "Las donaciones hechas a los hijos, que no tengan el concepto de mejoras, se imputarán en su legítima. Las hechas a extraños se imputarán a la parte libre de que hubiese podido disponer el testador por su última voluntad." },
  { block: "Civil", tema: 23, ref: "Art. 931 CC", q: "Artículo 931 del Código Civil (herederos por derecho propio)", a: "Los hijos y sus descendientes suceden a sus padres y demás ascendientes sin distinción de sexo, edad, ni filiación." },
  { block: "Civil", tema: 24, ref: "Art. 1907 CC", q: "Artículo 1907 del Código Civil (responsabilidad por ruina de edificios)", a: "El propietario de un edificio es responsable de los daños que resulten de la ruina de todo o parte de él, si ésta sobreviniere por falta de las reparaciones necesarias." },
  { block: "Civil", tema: 24, ref: "Art. 1908 CC", q: "Artículo 1908 del Código Civil (responsabilidad por daños de cosas)", a: "Igualmente responderán los propietarios de los daños causados: 1.º Por la explosión de máquinas que no hubiesen sido cuidadas con la debida diligencia, y la inflamación de sustancias explosivas que no estuviesen colocadas en lugar seguro y adecuado. 2.º Por los humos excesivos, que sean nocivos a las personas o a las propiedades." },
  { block: "Civil", tema: 25, ref: "Art. 1156 CC", q: "Artículo 1156 del Código Civil (modos de extinción de las obligaciones)", a: "Las obligaciones se extinguen: Por el pago o cumplimiento. Por la pérdida de la cosa debida. Por la condonación de la deuda. Por la confusión de los derechos de acreedor y deudor. Por la compensación. Por la novación." },
  { block: "Civil", tema: 25, ref: "Art. 1195 CC", q: "Artículo 1195 del Código Civil (compensación)", a: "Tendrá lugar la compensación cuando dos personas, por derecho propio, sean recíprocamente acreedoras y deudoras la una de la otra." },
  { block: "Civil", tema: 26, ref: "Art. 1149 CC", q: "Artículo 1149 del Código Civil (indivisibilidad de las obligaciones)", a: "La divisibilidad o indivisibilidad de las cosas objeto de las obligaciones en que hay un solo deudor y un solo acreedor no altera ni modifica los preceptos del capítulo II de este título." },
];
const PENAL_4A = [
  { block: "Penal", tema: 1, ref: "Art. 3 CP", q: "Artículo 3 del Código Penal (garantía procesal y de ejecución)", a: "1. No podrá ejecutarse pena ni medida de seguridad sino en virtud de sentencia firme dictada por el Juez o Tribunal competente, de acuerdo con las leyes procesales.\n2. Tampoco podrá ejecutarse pena ni medida de seguridad en otra forma que la prescrita por la Ley y reglamentos que la desarrollan, ni con otras circunstancias o accidentes que los expresados en su texto." },
  { block: "Penal", tema: 1, ref: "Art. 6 CP", q: "Artículo 6 del Código Penal (medidas de seguridad)", a: "1. Las medidas de seguridad se fundamentan en la peligrosidad criminal del sujeto al que se impongan, exteriorizada en la comisión de un hecho previsto como delito.\n2. Las medidas de seguridad no pueden resultar ni más gravosas ni de mayor duración que la pena abstractamente aplicable al hecho cometido." },
  { block: "Penal", tema: 1, ref: "Art. 8 CP", q: "Artículo 8 del Código Penal (concurso de leyes)", a: "Los hechos susceptibles de ser calificados con arreglo a dos o más preceptos de este Código, y no comprendidos en los artículos 73 a 77, se castigarán observando las siguientes reglas: 1.ª El precepto especial se aplicará con preferencia al general. 2.ª El precepto subsidiario se aplicará sólo en defecto del principal. 3.ª El precepto penal más amplio o complejo absorberá a los que castiguen las infracciones consumidas en aquél. 4.ª En defecto de los criterios anteriores, el precepto penal más grave excluirá los que castiguen el hecho con pena menor." },
  { block: "Penal", tema: 3, ref: "Art. 10 bis CP (redacción histórica)", q: "Precisión sobre el Art. 10 CP", a: "Son delitos las acciones y omisiones dolosas o imprudentes penadas por la ley. Cuando la pena venga determinada por la producción de un ulterior resultado más grave, sólo se responderá de éste si se hubiere causado, al menos, por imprudencia." },
  { block: "Penal", tema: 4, ref: "Art. 5 CP (repaso)", q: "Artículo 5 del Código Penal — enunciado completo", a: "No hay pena sin dolo o imprudencia." },
  { block: "Penal", tema: 8, ref: "Art. 15 CP", q: "Artículo 15 del Código Penal (punibilidad de delitos consumados y tentativa)", a: "Son punibles el delito consumado y la tentativa de delito." },
  { block: "Penal", tema: 9, ref: "Art. 63 CP", q: "Artículo 63 del Código Penal (pena de los cómplices)", a: "A los cómplices de un delito consumado o intentado se les impondrá la pena inferior en grado a la fijada por la Ley para los autores del mismo delito." },
  { block: "Penal", tema: 9, ref: "Art. 65 CP", q: "Artículo 65 del Código Penal (comunicabilidad de las circunstancias)", a: "1. Las circunstancias agravantes o atenuantes que consistan en cualquier causa de naturaleza personal agravarán o atenuarán la responsabilidad sólo de aquellos en quienes concurran.\n2. Las que consistan en la ejecución material del hecho o en los medios empleados para realizarla, servirán únicamente para agravar o atenuar la responsabilidad de los que hayan tenido conocimiento de ellas en el momento de la acción o de su cooperación para el delito." },
  { block: "Penal", tema: 10, ref: "Art. 40 CP", q: "Artículo 40 del Código Penal (duración de las penas privativas de derechos)", a: "1. La duración de las penas de inhabilitación absoluta, inhabilitación especial y suspensión de empleo o cargo público, y de privación del derecho a residir en determinados lugares o acudir a ellos, y de la prohibición de aproximarse o comunicarse con la víctima será de seis meses a veinte años." },
  { block: "Penal", tema: 10, ref: "Art. 66 CP", q: "Artículo 66 del Código Penal (reglas de aplicación de la pena)", a: "1. En la aplicación de la pena, tratándose de delitos dolosos, los jueces o tribunales observarán, según haya o no circunstancias atenuantes o agravantes, las siguientes reglas: 1.ª Cuando concurra sólo una circunstancia atenuante, aplicarán la pena en la mitad inferior. 2.ª Cuando concurran dos o más circunstancias atenuantes, o una o varias muy cualificadas, podrán aplicar la pena inferior en uno o dos grados. 3.ª Cuando concurra sólo una o dos circunstancias agravantes, aplicarán la pena en la mitad superior." },
  { block: "Penal", tema: 11, ref: "Art. 83 CP", q: "Artículo 83 del Código Penal (condiciones de la suspensión)", a: "1. El Juez o Tribunal podrá condicionar la suspensión al cumplimiento de las siguientes prohibiciones y deberes: 1.ª Prohibición de aproximarse a la víctima. 2.ª Prohibición de acudir a determinados lugares. 3.ª Comparecer personalmente ante el Juzgado o Tribunal para informar de sus actividades. 5.ª Participar en programas formativos, laborales, culturales, de educación vial, sexual y otros similares." },
