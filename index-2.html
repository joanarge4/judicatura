  { block: "Penal", tema: 11, ref: "Art. 88 CP", q: "Artículo 88 del Código Penal (sustitución de la pena de prisión, histórica)", a: "Regulación histórica derogada en la reforma de 2015 que permitía sustituir penas de prisión inferiores a un año por multa o trabajos en beneficio de la comunidad; actualmente sustituida por el régimen de suspensión de los artículos 80 y siguientes del Código Penal." },
  { block: "Penal", tema: 12, ref: "Art. 144 CP", q: "Artículo 144 del Código Penal (aborto sin consentimiento)", a: "El que produzca el aborto de una mujer, sin su consentimiento, será castigado con la pena de prisión de cuatro a ocho años e inhabilitación especial para ejercer cualquier profesión sanitaria, o para prestar servicios de toda índole en clínicas, establecimientos o consultorios ginecológicos, públicos o privados, por tiempo de tres a diez años." },
  { block: "Penal", tema: 13, ref: "Art. 153 CP", q: "Artículo 153 del Código Penal (violencia de género y doméstica)", a: "1. El que por cualquier medio o procedimiento causare a otro menoscabo psíquico o una lesión no definida como delito en este Código, o golpeare o maltratare de obra a otro sin causarle lesión, cuando la ofendida sea o haya sido esposa, o mujer que esté o haya estado ligada al autor por análoga relación de afectividad, será castigado con la pena de prisión de seis meses a un año." },
  { block: "Penal", tema: 13, ref: "Art. 173.2 CP", q: "Artículo 173.2 del Código Penal (violencia habitual)", a: "El que habitualmente ejerza violencia física o psíquica sobre quien sea o haya sido su cónyuge, o sobre persona que esté o haya estado ligada a él por una análoga relación de afectividad, o sobre los descendientes, ascendientes o hermanos, será castigado con la pena de prisión de seis meses a tres años." },
  { block: "Penal", tema: 14, ref: "Art. 251 CP", q: "Artículo 251 del Código Penal (estafas impropias)", a: "Será castigado con la pena de prisión de uno a cuatro años: 1.º Quien atribuyéndose falsamente facultad de disposición sobre una cosa mueble o inmueble enajenare, gravare o arrendare a otro, en perjuicio de éste o de tercero. 2.º El que dispusiere de una cosa mueble o inmueble ocultando la existencia de cualquier carga sobre la misma. 3.º El que otorgare en perjuicio de otro un contrato simulado." },
  { block: "Penal", tema: 14, ref: "Art. 252 CP", q: "Artículo 252 del Código Penal (apropiación indebida)", a: "1. Serán punibles con las penas del artículo 249 o, en su caso, con las del artículo 250, salvo que ya estuvieran castigados con una pena más grave en otro precepto de este Código, los que, habiendo recibido en depósito, comisión, o custodia, o que les hayan sido confiados en virtud de cualquier otro título que produzca la obligación de entregarlos o devolverlos, o negaren haberlos recibido, cuando la cuantía de lo apropiado exceda de 400 euros." },
  { block: "Penal", tema: 15, ref: "Art. 244 CP", q: "Artículo 244 del Código Penal (hurto y robo de uso de vehículos)", a: "1. El que sustrajere o utilizare sin la debida autorización un vehículo a motor o ciclomotor ajenos, cuyo valor excediere de 400 euros, sin ánimo de apropiárselo, será castigado con la pena de trabajos en beneficio de la comunidad o multa." },
  { block: "Penal", tema: 16, ref: "Art. 390 CP", q: "Artículo 390 del Código Penal (falsedad en documento público por funcionario)", a: "1. Será castigado con las penas de prisión de tres a seis años, multa de seis a veinticuatro meses e inhabilitación especial por tiempo de dos a seis años, la autoridad o funcionario público que, en el ejercicio de sus funciones, cometa falsedad: 1.º Alterando un documento en alguno de sus elementos o requisitos de carácter esencial. 2.º Simulando un documento en todo o en parte, de manera que induzca a error sobre su autenticidad." },
  { block: "Penal", tema: 16, ref: "Art. 436 CP", q: "Artículo 436 del Código Penal (fraude a la Administración)", a: "La autoridad o funcionario público que, interviniendo por razón de su cargo en cualesquiera de los contratos, asientos, liquidaciones o enajenaciones públicas, se concertara con los interesados o usase de cualquier otro artificio para defraudar a la Administración, será castigado con las penas de prisión de dos a seis años." },
  { block: "Penal", tema: 17, ref: "Art. 24 CP", q: "Artículo 24 del Código Penal (concepto de autoridad y funcionario público)", a: "1. A los efectos penales se reputará autoridad al que por sí solo o como miembro de alguna corporación, tribunal u órgano colegiado tenga mando o ejerza jurisdicción propia.\n2. Se considerará funcionario público todo el que por disposición inmediata de la Ley o por elección o por nombramiento de autoridad competente participe en el ejercicio de funciones públicas." },
];
const PENAL_4B = [
  { block: "Penal", tema: 12, ref: "Art. 138.2 CP", q: "Artículo 138.2 del Código Penal (homicidio agravado)", a: "La pena de prisión del homicidio se impondrá en su mitad superior cuando: a) Concurriere en su comisión alguna de las circunstancias del apartado 1 del artículo 140, o b) los hechos sean además constitutivos de un delito de atentado del artículo 550." },
  { block: "Penal", tema: 13, ref: "Art. 150 CP", q: "Artículo 150 del Código Penal (pérdida o inutilidad de órgano no principal)", a: "El que causare a otro la pérdida o la inutilidad de un órgano o miembro no principal, o la deformidad, será castigado con la pena de prisión de tres a seis años." },
  { block: "Penal", tema: 15, ref: "Art. 241 CP", q: "Artículo 241 del Código Penal (robo con fuerza en casa habitada)", a: "1. El culpable de robo con fuerza en las cosas cometido en casa habitada, edificio o local abiertos al público, o en cualquiera de sus dependencias, será castigado con la pena de prisión de dos a cinco años." },
  { block: "Penal", tema: 14, ref: "Art. 250 CP", q: "Artículo 250 del Código Penal (estafa agravada)", a: "1. El delito de estafa será castigado con las penas de prisión de uno a seis años y multa de seis a doce meses, cuando: 1.º Recaiga sobre cosas de primera necesidad, viviendas u otros bienes de reconocida utilidad social. 5.º El valor de la defraudación superare los 50.000 euros. 6.º Se realice mediante manipulación informática o artificio semejante para transferencia no consentida de activo patrimonial." },
];
const PROCESAL_CIVIL_4 = [
  { block: "Procesal Civil", tema: 2, ref: "Art. 10 LEC", q: "Artículo 10 de la Ley de Enjuiciamiento Civil (legitimación)", a: "Serán considerados partes legítimas quienes comparezcan y actúen en juicio como titulares de la relación jurídica u objeto litigioso." },
  { block: "Procesal Civil", tema: 2, ref: "Art. 23 LEC", q: "Artículo 23 de la Ley de Enjuiciamiento Civil (representación mediante procurador)", a: "1. La comparecencia en juicio será por medio de procurador legalmente habilitado para actuar en el tribunal que conozca del juicio.\n2. No obstante, podrán los litigantes comparecer por sí mismos: en los juicios verbales cuya cuantía no exceda de 2.000 euros y para la petición inicial de los procedimientos monitorios." },
  { block: "Procesal Civil", tema: 2, ref: "Art. 31 LEC", q: "Artículo 31 de la Ley de Enjuiciamiento Civil (intervención de abogado)", a: "1. Los litigantes serán dirigidos por abogados habilitados para ejercer su profesión en el tribunal que conozca del juicio.\n2. Exceptúanse solamente: 1.º Los juicios verbales cuya cuantía no exceda de 2.000 euros. 2.º Los procesos monitorios en su petición inicial." },
  { block: "Procesal Civil", tema: 3, ref: "Art. 251 LEC", q: "Artículo 251 de la Ley de Enjuiciamiento Civil (reglas para el cálculo de la cuantía)", a: "El valor de la cosa litigiosa a efectos de fijar la cuantía se calculará según las reglas siguientes: si se reclama una cantidad de dinero determinada, la cuantía será dicha cantidad; si el objeto del proceso fuere la existencia, validez o eficacia de una obligación, la cuantía se calculará por el total de lo debido." },
  { block: "Procesal Civil", tema: 4, ref: "Art. 438 LEC", q: "Artículo 438 de la Ley de Enjuiciamiento Civil (acumulación de acciones en el juicio verbal)", a: "1. No se admitirá la acumulación objetiva de acciones en el juicio verbal, salvo las excepciones que se establecen en los apartados siguientes de este artículo." },
  { block: "Procesal Civil", tema: 4, ref: "Art. 440 LEC", q: "Artículo 440 de la Ley de Enjuiciamiento Civil (admisión de la demanda y citación en el verbal)", a: "1. Admitida la demanda, el Letrado de la Administración de Justicia, en el plazo de cinco días, citará a las partes para la celebración de vista, que habrá de señalarse dentro del plazo improrrogable de veinte días desde la fecha de la citación." },
  { block: "Procesal Civil", tema: 5, ref: "Art. 402 LEC", q: "Artículo 402 de la Ley de Enjuiciamiento Civil (emplazamiento del demandado)", a: "En la resolución de admisión de la demanda, el Letrado de la Administración de Justicia acordará que se dé traslado de ella al demandado para que se persone en autos y la conteste en el plazo de veinte días." },
  { block: "Procesal Civil", tema: 6, ref: "Art. 419 LEC", q: "Artículo 419 de la Ley de Enjuiciamiento Civil (intento de conciliación o transacción)", a: "Si los litigantes llegaran a un acuerdo que implique la desaparición de la controversia, podrá el Letrado de la Administración de Justicia entender que ha desaparecido el interés legítimo en obtener la tutela judicial pretendida y ordenará el archivo de las actuaciones." },
  { block: "Procesal Civil", tema: 7, ref: "Art. 265 LEC", q: "Artículo 265 de la Ley de Enjuiciamiento Civil (documentos que han de presentarse con la demanda)", a: "1. A toda demanda o contestación habrán de acompañarse: 1.º Los documentos en que las partes funden su derecho a la tutela judicial que pretenden. 2.º Los medios e instrumentos que permitan archivar y conocer palabras, imágenes y sonidos. 3.º Los dictámenes periciales en que las partes apoyen sus pretensiones." },
  { block: "Procesal Civil", tema: 7, ref: "Art. 326 LEC", q: "Artículo 326 de la Ley de Enjuiciamiento Civil (fuerza probatoria de documentos privados)", a: "1. Los documentos privados harán prueba plena en el proceso, en los términos del artículo 319, cuando su autenticidad no sea impugnada por la parte a quien perjudiquen." },
  { block: "Procesal Civil", tema: 8, ref: "Art. 265.3 LEC", q: "Artículo 265.3 de la Ley de Enjuiciamiento Civil (documentos posteriores a la demanda)", a: "También podrán las partes aportar los documentos o dictámenes relativos al fondo del asunto que se encuentren en poder de la parte contraria, mediante solicitud al tribunal, siempre que dichos documentos no hubiesen podido obtenerse con anterioridad." },
  { block: "Procesal Civil", tema: 9, ref: "Art. 400.2 LEC", q: "Artículo 400.2 de la Ley de Enjuiciamiento Civil (efectos de la litispendencia y cosa juzgada)", a: "De conformidad con lo dispuesto en el apartado anterior, a efectos de litispendencia y de cosa juzgada, los hechos y los fundamentos jurídicos aducidos en un litigio se considerarán los mismos que los alegados en otro juicio anterior si hubiesen podido alegarse en éste." },
  { block: "Procesal Civil", tema: 11, ref: "Art. 813 LEC", q: "Artículo 813 de la Ley de Enjuiciamiento Civil (competencia en el monitorio)", a: "Será competente para el proceso monitorio el Juzgado de Primera Instancia del domicilio o residencia del deudor o, si no fueren conocidos, el del lugar en que el deudor pudiera ser hallado a efectos del requerimiento de pago por el tribunal." },
  { block: "Procesal Civil", tema: 12, ref: "Art. 549 LEC", q: "Artículo 549 de la Ley de Enjuiciamiento Civil (demanda ejecutiva)", a: "1. La ejecución forzosa habrá de ser solicitada mediante demanda, en la que se expresará: 1.º El título en que se funda el ejecutante. 2.º La tutela ejecutiva que se pretende. 3.º Los bienes del ejecutado susceptibles de embargo de los que tuviese conocimiento el ejecutante." },
  { block: "Procesal Civil", tema: 13, ref: "Art. 721 LEC", q: "Artículo 721 de la Ley de Enjuiciamiento Civil (potestad general de adopción de medidas cautelares)", a: "1. Bajo su responsabilidad, todo actor, principal o reconvencional, podrá solicitar del tribunal, conforme a lo dispuesto en este Título, la adopción de las medidas cautelares que considere necesarias para asegurar la efectividad de la tutela judicial que pudiera otorgarse en la sentencia estimatoria que se dictare." },
];
const PROCESAL_PENAL_4 = [
  { block: "Procesal Penal", tema: 1, ref: "Art. 741 bis LECrim (motivación)", q: "Exigencia de motivación de la sentencia penal (Art. 142 y 741 LECrim, en relación con el Art. 120.3 CE)", a: "Las sentencias penales han de expresar, de forma clara y motivada, los hechos que se estiman probados, la calificación jurídica de los mismos, la participación de los procesados, y las razones que han llevado al tribunal a formar su convicción, valorando la prueba practicada conforme a las reglas de la sana crítica." },
  { block: "Procesal Penal", tema: 2, ref: "Art. 118.1 LECrim", q: "Artículo 118.1 de la Ley de Enjuiciamiento Criminal (derechos del investigado)", a: "El derecho de defensa comprende, entre otros: ser informado de forma verbal o escrita de los hechos atribuidos y las razones de su privación de libertad; designar libremente abogado; ser asistido gratuitamente por un intérprete; acceder a los elementos de las actuaciones esenciales para impugnar la privación de libertad; y guardar silencio o no declarar contra sí mismo." },
  { block: "Procesal Penal", tema: 3, ref: "Art. 795.2 LECrim", q: "Artículo 795.2 de la Ley de Enjuiciamiento Criminal (delitos flagrantes en el juicio rápido)", a: "A los efectos de este título, se considera flagrante el delito que se estuviese cometiendo o se acabare de cometer cuando el delincuente sea sorprendido en el acto. Se entenderá sorprendido en el acto no sólo al delincuente que fuere detenido en el momento de estar cometiendo el delito, sino también al detenido o perseguido inmediatamente después de cometerlo, si la persecución durare o no se hubiese interrumpido." },
  { block: "Procesal Penal", tema: 4, ref: "Art. 506 LECrim", q: "Artículo 506 de la Ley de Enjuiciamiento Criminal (recursos contra la prisión provisional)", a: "1. Contra los autos que resuelvan sobre la situación personal del investigado o encausado podrán ejercitarse los recursos de reforma, apelación o queja." },
  { block: "Procesal Penal", tema: 5, ref: "Art. 733 LECrim", q: "Artículo 733 de la Ley de Enjuiciamiento Criminal (tesis de desvinculación)", a: "Si juzgando por el resultado de las pruebas entendiere el Tribunal que el hecho justiciable ha sido calificado con manifiesto error, podrá el Presidente emplear la siguiente fórmula: ¿No estiman los defensores de S.M. y del procesado que debió ser calificado el delito objeto de este juicio con la circunstancia (X) que no ha sido objeto de calificación?" },
  { block: "Procesal Penal", tema: 6, ref: "Art. 801 LECrim", q: "Artículo 801 de la Ley de Enjuiciamiento Criminal (conformidad en diligencias urgentes)", a: "1. También se podrá dictar sentencia de conformidad, oralmente y de forma inmediata, en las actuaciones por delitos leves, con reducción de un tercio de la pena, cuando el Fiscal y las demás partes personadas expresen su conformidad, y el hecho justiciable pueda calificarse como delito castigado con pena de hasta tres años de prisión." },
  { block: "Procesal Penal", tema: 7, ref: "Art. 109 LECrim", q: "Artículo 109 de la Ley de Enjuiciamiento Criminal (ofrecimiento de acciones a la víctima)", a: "En el acto de recibirse declaración por el Juez o Tribunal, se instruirá al ofendido y al perjudicado por el delito del derecho que le asiste para mostrarse parte en el proceso y renunciar o no a la restitución de la cosa, reparación del daño e indemnización del perjuicio causado." },
  { block: "Procesal Penal", tema: 9, ref: "Art. 848 LECrim", q: "Artículo 848 de la Ley de Enjuiciamiento Criminal (recurso de casación para unificación de doctrina)", a: "Contra las sentencias dictadas en el ámbito de la casación penal podrá interponerse recurso extraordinario para la unificación de doctrina cuando concurran los requisitos legalmente establecidos, con la finalidad de garantizar la igualdad en la aplicación de la ley." },

const QUESTIONS = [
  ...CONSTITUCIONAL, ...CONSTITUCIONAL_2, ...CONSTITUCIONAL_3, ...CONSTITUCIONAL_4, ...CONSTITUCIONAL_4B,
  ...CIVIL, ...CIVIL_2, ...CIVIL_3, ...CIVIL_4A, ...CIVIL_4B,
  ...PENAL, ...PENAL_2, ...PENAL_3, ...PENAL_4A, ...PENAL_4B,
  ...PROCESAL_CIVIL, ...PROCESAL_CIVIL_2, ...PROCESAL_CIVIL_3, ...PROCESAL_CIVIL_4,
  ...PROCESAL_PENAL, ...PROCESAL_PENAL_2, ...PROCESAL_PENAL_3, ...PROCESAL_PENAL_4,
  ...MERCANTIL, ...MERCANTIL_2, ...MERCANTIL_3, ...MERCANTIL_4,
  ...ADMINISTRATIVO, ...ADMINISTRATIVO_2, ...ADMINISTRATIVO_3, ...ADMINISTRATIVO_4,
  ...LABORAL, ...LABORAL_2, ...LABORAL_3, ...LABORAL_4,
];
(function(){
  const blocks = [...new Set(QUESTIONS.map(q => q.block))];
  const counts = Object.fromEntries(blocks.map(b => [b, QUESTIONS.filter(q => q.block === b).length]));

  const active = new Set(blocks);
  let currentQuestion = null;
  let answerShown = false;
  let lastIndex = -1;

  const blockGrid = document.getElementById('blockGrid');
  const card = document.getElementById('card');
  const nextBtn = document.getElementById('nextBtn');
  const progressNote = document.getElementById('progressNote');

  function renderFilters(){
    blockGrid.innerHTML = '';
    blocks.forEach(b => {
      const label = document.createElement('label');
      label.className = 'block-chip' + (active.has(b) ? ' active' : '');
      label.innerHTML = `
        <input type="checkbox" ${active.has(b) ? 'checked' : ''} data-block="${b}">
        <span>${b}</span>
        <span class="count">${counts[b]}</span>
      `;
      const input = label.querySelector('input');
      input.addEventListener('change', () => {
        if(input.checked){ active.add(b); } else { active.delete(b); }
        label.classList.toggle('active', input.checked);
        drawNewQuestion();
      });
      blockGrid.appendChild(label);
    });
  }

  function pool(){
    return QUESTIONS.filter(q => active.has(q.block));
  }

  function drawNewQuestion(){
    answerShown = false;
    const p = pool();
    if(p.length === 0){
      currentQuestion = null;
      renderEmpty();
      return;
    }
    let idx;
    if(p.length === 1){
      idx = 0;
    } else {
      do { idx = Math.floor(Math.random() * p.length); } while (idx === lastIndex);
    }
    lastIndex = idx;
    currentQuestion = p[idx];
    renderCard();
  }

  function renderEmpty(){
    card.innerHTML = `
      <div class="empty-state">
        <strong>Sin artículos</strong>
        Marca al menos un bloque para empezar a repasar.
      </div>
    `;
    progressNote.textContent = '0 artículos disponibles';
  }

  function escapeHtml(str){
    return str.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function renderCard(){
    const q = currentQuestion;
    card.innerHTML = `
      <div class="card-tag">
        <span class="block-name">${q.block}</span>
        <span class="tema-num">Tema ${q.tema}</span>
      </div>
      <div class="prompt-label">RECITA</div>
      <p class="article-ref">${escapeHtml(q.ref)}</p>
      ${answerShown ? `
        <div class="answer-wrap">
          <div class="a-label">CONTENIDO</div>
          <p class="answer-text">${escapeHtml(q.a)}</p>
        </div>
      ` : `
        <button class="reveal-btn" id="revealBtn">Ver respuesta</button>
      `}
    `;
    if(!answerShown){
      document.getElementById('revealBtn').addEventListener('click', () => {
        answerShown = true;
        renderCard();
      });
    }
    progressNote.textContent = `${pool().length} artículos en el filtro actual`;
  }

  nextBtn.addEventListener('click', drawNewQuestion);

  document.getElementById('selectAll').addEventListener('click', () => {
    blocks.forEach(b => active.add(b));
    renderFilters();
    drawNewQuestion();
  });
  document.getElementById('selectNone').addEventListener('click', () => {
    active.clear();
    renderFilters();
    drawNewQuestion();
  });

  renderFilters();
  drawNewQuestion();
})();




</script>
